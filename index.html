<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Zwartendijk Stalling — Plattegrond</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1B2A4A" />

<!-- iOS: lets "Add to Home Screen" launch full-screen with no browser chrome -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Storage Sites" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />

<!-- Android / general -->
<meta name="mobile-web-app-capable" content="yes" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />

<style>
  :root{
    --paper: #F6F3EA;
    --paper-line: #DAD3BE;
    --ink: #1B2A4A;
    --ink-soft: #5B6580;
    --ink-faint: #97A0B5;
    --card: #FFFEFA;
    --line: #C9C2AC;

    --car: #B54834;
    --car-soft: #F1DAD2;
    --camper: #2E6E62;
    --camper-soft: #D7E6E1;
    --caravan: #47598C;
    --caravan-soft: #DDE1EE;
    --trailer: #B4831F;
    --trailer-soft: #F0E3C9;
    --folding: #6E5B8C;
    --folding-soft: #E1DCEA;

    --radius: 3px;
    --font-display: ui-monospace, 'SFMono-Regular', 'Menlo', 'Consolas', 'Liberation Mono', monospace;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  *{box-sizing:border-box;}
  html{background:var(--paper);}
  body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);overscroll-behavior-x:none;}

  .sheet{
    background:
      repeating-linear-gradient(0deg, transparent, transparent 27px, var(--paper-line) 27px, var(--paper-line) 28px),
      repeating-linear-gradient(90deg, transparent, transparent 27px, var(--paper-line) 27px, var(--paper-line) 28px),
      var(--paper);
    border:1px solid var(--line);
    border-radius:6px;
    padding:28px 28px 36px;
    min-height:400px;
  }

  /* ---------- pin gate ---------- */
  .pin-gate{
    position:fixed;inset:0;z-index:1000;
    background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .pin-card{
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:32px 28px;width:280px;max-width:100%;text-align:center;
    box-shadow:0 20px 50px rgba(27,42,74,.15);
  }
  .pin-eyebrow{
    font-family:var(--font-display);font-size:10.5px;letter-spacing:.14em;
    color:var(--ink-soft);text-transform:uppercase;margin-bottom:6px;
  }
  .pin-card h1{
    font-family:var(--font-display);font-size:19px;color:var(--ink);margin:0 0 18px;
  }
  .pin-input{
    width:100%;box-sizing:border-box;padding:12px;border:1.5px solid var(--line);border-radius:var(--radius);
    font-family:var(--font-display);font-size:22px;letter-spacing:.3em;text-align:center;
    color:var(--ink);background:var(--paper);outline:none;
  }
  .pin-input:focus{border-color:var(--ink);}
  .pin-error{color:var(--car);font-size:12px;margin-top:10px;}
  .login-field{text-align:left;margin-bottom:12px;}
  .login-field label{display:block;font-size:11px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
  .login-field input{
    width:100%;box-sizing:border-box;padding:10px;border:1.5px solid var(--line);border-radius:var(--radius);
    font-family:var(--font-body);font-size:14px;color:var(--ink);background:var(--paper);outline:none;
  }
  .login-field input:focus{border-color:var(--ink);}
  .logout-line{cursor:default;}

  /* ---------- header ---------- */
  .titleblock{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:18px;
    gap:20px;
    flex-wrap:wrap;
  }
  .titleblock-left{flex:1;min-width:220px;}
  .titleblock-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .toolbar-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .eyebrow{
    font-family:var(--font-display);
    font-size:11px;
    letter-spacing:.14em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin-bottom:4px;
  }
  #facilityName{
    font-family:var(--font-display);
    font-weight:700;
    font-size:26px;
    color:var(--ink);
    border:none;
    background:transparent;
    outline:none;
    padding:2px 4px;
    margin-left:-4px;
    border-radius:var(--radius);
    max-width:100%;
  }
  #facilityName:focus{background:var(--card);box-shadow:0 0 0 1px var(--line);}
  .scale-note{font-size:12px;color:var(--ink-faint);margin-top:4px;font-family:var(--font-display);}

  .stats{display:flex;gap:10px;flex-wrap:wrap;}
  .stat{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:8px 14px;
    text-align:center;
    min-width:64px;
  }
  .stat .n{font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1;}
  .stat .l{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin-top:4px;}

  /* ---------- warehouse tabs ---------- */
  .wh-tabs{
    display:flex;
    gap:6px;
    align-items:center;
    margin-bottom:6px;
    overflow-x:auto;
    padding-bottom:4px;
  }
  .wh-tabs::-webkit-scrollbar{height:6px;}
  .wh-tabs::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .wh-tab{
    position:relative;
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px 10px 7px 12px;
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    background:var(--card);
    cursor:pointer;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
  }
  .wh-tab:hover{border-color:var(--ink-faint);color:var(--ink);}
  .wh-tab.active{border-color:var(--ink);background:var(--ink);color:var(--paper);}
  .wh-tab .wh-count{
    font-family:var(--font-display);font-size:10px;font-weight:600;
    padding:1px 5px;border-radius:8px;background:rgba(0,0,0,.08);
  }
  .wh-tab.active .wh-count{background:rgba(255,255,255,.18);}
  .wh-tab-name-text{
    max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .wh-tab-edit{
    display:none;
    width:15px;height:15px;border-radius:50%;
    align-items:center;justify-content:center;
    background:rgba(0,0,0,.12);
    font-size:9px;line-height:1;flex-shrink:0;
    cursor:pointer;
  }
  @media (hover: hover){
    .wh-tab:hover .wh-tab-edit{display:flex;}
  }
  .wh-tab-move{
    display:none;
    width:15px;height:15px;border-radius:50%;
    align-items:center;justify-content:center;
    background:rgba(0,0,0,.12);
    font-size:8px;line-height:1;flex-shrink:0;
    cursor:pointer;
  }
  .wh-tab-move.disabled{opacity:.3;cursor:default;pointer-events:none;}
  @media (hover: hover){
    .wh-tab:hover .wh-tab-move{display:flex;}
  }
  .wh-tab-del{
    display:none;
    width:15px;height:15px;border-radius:50%;
    align-items:center;justify-content:center;
    background:rgba(0,0,0,.12);
    font-size:9px;line-height:1;flex-shrink:0;
  }
  @media (hover: hover){
    .wh-tab:hover .wh-tab-del{display:flex;}
  }
  .wh-tab-add{
    flex-shrink:0;
    padding:7px 12px;
    border:1.5px dashed var(--ink-faint);
    border-radius:var(--radius);
    background:transparent;
    color:var(--ink-faint);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    font-family:var(--font-display);
  }
  .wh-tab-add:hover{color:var(--ink);border-color:var(--ink);}

  .global-stat-line{
    font-size:11.5px;color:var(--ink-soft);margin:2px 0 18px;font-family:var(--font-display);
  }

  .wh-purpose{
    font-size:12.5px;color:var(--ink-soft);margin:-6px 0 18px;
  }
  .wh-purpose b{color:var(--ink);}

  /* ---------- search ---------- */
  .search-wrap{position:relative;margin-bottom:16px;}
  #searchInput{
    width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--radius);
    font-family:var(--font-body);font-size:13.5px;color:var(--ink);background:var(--card);
    outline:none;
  }
  #searchInput:focus{border-color:var(--ink);}
  .search-filters{
    display:flex;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap;
  }
  .search-filters select{
    padding:5px 8px;border:1px solid var(--line);border-radius:var(--radius);
    font-family:var(--font-body);font-size:11.5px;color:var(--ink-soft);background:var(--card);outline:none;
  }
  .search-filters select:focus{border-color:var(--ink);}
  .search-free-toggle{
    display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-soft);cursor:pointer;
  }
  .search-free-toggle input{width:13px;height:13px;cursor:pointer;}
  .search-results{
    display:none;
    position:absolute;top:100%;left:0;right:0;margin-top:6px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 10px 26px rgba(27,42,74,.18);
    max-height:280px;overflow-y:auto;z-index:30;
  }
  .search-results.show{display:block;}
  .search-result{
    display:flex;align-items:center;gap:10px;
    padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--paper-line);
  }
  .search-result:last-child{border-bottom:none;}
  .search-result:hover{background:var(--paper);}
  .search-result .dot{flex-shrink:0;}
  .search-result-main{flex:1;min-width:0;}
  .search-result-name{font-size:13px;font-weight:600;color:var(--ink);}
  .search-result-meta{font-size:11px;color:var(--ink-soft);}
  .search-empty{padding:14px 12px;font-size:12.5px;color:var(--ink-faint);text-align:center;}

  @keyframes bayPulse{
    0%{box-shadow:0 0 0 0 rgba(27,42,74,.55);}
    70%{box-shadow:0 0 0 10px rgba(27,42,74,0);}
    100%{box-shadow:0 0 0 0 rgba(27,42,74,0);}
  }
  .spot.jump-highlight{animation:bayPulse 1s ease-out 2;}

  /* ---------- legend ---------- */
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);}
  .swatch{width:12px;height:12px;border-radius:2px;flex-shrink:0;}

  /* ---------- overview page ---------- */
  .overview{display:flex;flex-direction:column;gap:26px;}
  .overview-section{max-width:520px;}
  .overview-h{
    font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--ink);
    margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em;
  }
  .agenda-summary-bar{display:flex;gap:8px;margin-bottom:14px;}
  .agenda-summary-pill{
    flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:8px 6px;text-align:center;cursor:pointer;transition:box-shadow .15s;
  }
  .agenda-summary-pill:hover{box-shadow:0 2px 8px rgba(27,42,74,.1);}
  .agenda-summary-pill .num{font-family:var(--font-display);font-size:19px;font-weight:700;line-height:1;color:var(--ink);}
  .agenda-summary-pill .lbl{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-top:3px;}
  .agenda-summary-pill.today .num{color:var(--car);}
  .agenda-summary-pill.away .num{color:var(--camper);}
  .agenda-day-heading{
    font-family:var(--font-display);font-size:12px;font-weight:700;color:var(--ink-soft);
    margin:12px 0 6px;display:flex;align-items:baseline;gap:8px;
  }
  .agenda-day-heading:first-of-type{margin-top:0;}
  .agenda-day-heading.today{color:var(--ink);}
  .agenda-day-tag{
    background:var(--car);color:#fff;font-size:9px;font-family:var(--font-body);font-weight:700;
    padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.03em;
  }
  .agenda-week-header{
    width:100%;display:flex;justify-content:space-between;align-items:center;
    background:none;border:none;padding:0 0 10px;cursor:pointer;text-align:left;
    font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--ink);
    text-transform:uppercase;letter-spacing:.04em;
  }
  .agenda-week-count{
    background:var(--paper-line);color:var(--ink-soft);font-size:11px;font-weight:700;
    padding:1px 8px;border-radius:10px;text-transform:none;letter-spacing:0;
  }
  .overview-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .overview-table th{
    text-align:left;font-family:var(--font-display);font-size:10.5px;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.04em;padding:8px 12px;border-bottom:1.5px solid var(--ink);
  }
  .overview-table td{padding:8px 12px;font-size:13px;color:var(--ink);border-bottom:1px solid var(--paper-line);}
  .overview-table td .dot{margin-right:7px;vertical-align:middle;}
  .overview-table tbody tr:last-child td{border-bottom:1px solid var(--paper-line);}
  .overview-table tfoot td{
    font-weight:700;font-family:var(--font-display);font-size:12.5px;
    border-top:1.5px solid var(--ink);border-bottom:none;background:var(--paper);
  }
  .overview-table td.ov-free{color:var(--camper);font-weight:700;}
  .overview-table tbody tr.ov-row{cursor:pointer;}
  .overview-table tbody tr.ov-row:hover{background:var(--paper);}
  .ov-door-note{font-size:11px;color:var(--ink-faint);}

  /* ---------- agenda ---------- */
  .agenda-card{
    background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:var(--radius);
    padding:10px 12px;margin-bottom:8px;
  }
  .agenda-card.needs-action{border-left-color:var(--trailer);}
  .agenda-card.is-linked{border-left-color:var(--camper);}
  .agenda-card.is-away{
    background:#eaf5ec;border-color:#bcdccc;
  }
  .agenda-badge{
    display:inline-block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    padding:2px 6px;border-radius:4px;margin-left:7px;vertical-align:middle;
  }
  .agenda-badge.needs{background:var(--trailer-soft);color:#8a6414;}
  .agenda-badge.linked{background:var(--camper-soft);color:var(--camper);}
  .agenda-card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
  .agenda-expand-icon{color:var(--ink-faint);font-size:13px;flex-shrink:0;padding-top:2px;}
  .agenda-card-details{margin-top:8px;padding-top:8px;border-top:1px solid var(--paper-line);}
  .agenda-date{font-family:var(--font-display);font-size:11px;color:var(--ink-soft);}
  .agenda-name{font-weight:700;font-size:13.5px;color:var(--ink);margin-top:2px;}
  .agenda-sub{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
  .agenda-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
  .contract-badge{display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-family:var(--font-display);font-size:10.5px;font-weight:700;letter-spacing:.02em;color:var(--camper);}
  .agenda-link{font-size:11.5px;color:var(--ink-soft);margin-top:8px;padding-top:8px;border-top:1px dashed var(--paper-line);}

  /* ---------- warehouse plan ---------- */
  /* single shared horizontal scroller so every row (and both sides) move together */
  .plan-scroll{overflow-x:auto;padding-bottom:6px;}
  .plan-scroll::-webkit-scrollbar{height:8px;}
  .plan-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .plan{display:flex;flex-direction:column;width:max-content;min-width:100%;}

  .side-block{display:flex;flex-direction:column;}
  .row-block{margin-bottom:8px;}
  .row-head{
    display:flex;align-items:center;gap:8px;margin-bottom:6px;
    position:sticky;left:0;width:fit-content;
  }
  .row-tag{
    font-family:var(--font-display);
    font-size:10.5px;font-weight:700;color:var(--ink-soft);
    letter-spacing:.04em;text-transform:uppercase;
  }
  .row-actions{margin-left:auto;display:flex;gap:6px;}

  .lane{
    position:relative;
    display:flex;
    align-items:flex-end;
    gap:9px;
    padding:14px 10px 10px;
    background:repeating-linear-gradient(90deg, var(--ink-faint) 0 10px, transparent 10px 20px);
    background-size:100% 2px;
    background-repeat:no-repeat;
    background-position:top;
    min-height:106px;
  }

  .aisle-bar{
    display:flex;align-items:center;justify-content:center;gap:10px;
    margin:6px 0;
    padding:9px 0;
    background:repeating-linear-gradient(90deg, var(--ink) 0 16px, transparent 16px 30px);
    background-size:100% 2px;
    background-position:center;
    background-repeat:no-repeat;
    position:relative;
  }
  .aisle-label{
    background:var(--paper);
    border:1.5px solid var(--ink);
    color:var(--ink);
    font-family:var(--font-display);
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.1em;
    padding:3px 12px;
    border-radius:2px;
    z-index:1;
  }
  .aisle-door{
    position:absolute; top:50%; transform:translateY(-50%);
    font-size:18px; z-index:1;
    background:var(--paper); border:1.5px solid var(--ink); border-radius:2px;
    padding:2px 6px; line-height:1;
  }
  .aisle-door-left{ left:14px; }
  .aisle-door-right{ right:14px; }

  .side-toggle{
    font-size:10.5px;color:var(--ink-faint);background:transparent;border:1px dashed var(--line);
    border-radius:var(--radius);padding:2px 7px;cursor:pointer;font-family:var(--font-display);
  }
  .side-toggle:hover{color:var(--ink);border-color:var(--ink-faint);}

  .spot{
    flex-shrink:0;
    border-radius:var(--radius);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:8px 8px 6px;
    height:88px;
    transition:transform .12s ease, box-shadow .12s ease;
    border:1.5px solid var(--ink);
    position:relative;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    touch-action:pan-x;
  }
  .spot:hover{transform:translateY(-2px);box-shadow:0 3px 8px rgba(27,42,74,.18);}

  .spot.empty{
    background:repeating-linear-gradient(135deg, transparent 0 6px, var(--paper-line) 6px 7px);
    border-style:dashed;
    border-color:var(--ink-faint);
    align-items:center;
    justify-content:center;
  }
  .spot.empty .plus{font-size:20px;color:var(--ink-faint);font-family:var(--font-display);}

  .spot.gap{
    background:repeating-linear-gradient(45deg, transparent 0 5px, var(--paper-line) 5px 6px);
    border-style:dotted;
    border-color:var(--ink-faint);
    opacity:.6;
    align-items:center;
    justify-content:center;
  }
  .spot.gap:hover{opacity:.85;}

  .spot.door{
    background:repeating-linear-gradient(90deg, var(--ink) 0 8px, transparent 8px 16px);
    background-color:var(--paper);
    border-style:solid;
    border-color:var(--ink);
    align-items:center;
    justify-content:center;
  }
  .door-label{
    font-size:10px;color:var(--ink);text-align:center;line-height:1.5;
    font-family:var(--font-display);text-transform:uppercase;letter-spacing:.03em;
    background:var(--paper);padding:2px 4px;border-radius:2px;
  }

  .spot.dragging{ opacity:.35; }
  .spot.drop-target{ outline:3px solid var(--ink); outline-offset:2px; }
  .drag-ghost{
    position:fixed; pointer-events:none; z-index:500;
    opacity:.95; transform:scale(1.06);
    box-shadow:0 14px 30px rgba(27,42,74,.4);
    border-radius:var(--radius);
  }
  .gap-label{
    font-size:9.5px;color:var(--ink-faint);text-align:center;line-height:1.3;
    font-family:var(--font-display);text-transform:uppercase;letter-spacing:.03em;
  }

  .spot-id{font-family:var(--font-display);font-size:10px;color:var(--ink-soft);}
  .spot-label{font-family:var(--font-body);font-weight:600;font-size:12.5px;color:var(--ink);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .spot-sub{font-size:10.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .spot-dim{font-family:var(--font-display);font-size:9.5px;color:var(--ink-faint);align-self:flex-end;}

  .spot-del{
    position:absolute;top:-8px;right:-8px;
    width:18px;height:18px;border-radius:50%;
    background:var(--card);border:1px solid var(--line);
    color:var(--ink-soft);font-size:11px;line-height:1;
    display:none;align-items:center;justify-content:center;
    cursor:pointer;
  }
  @media (hover: hover){
    .spot:hover .spot-del{display:flex;}
  }

  .spot.long-stay{border-left-width:4px;border-left-color:var(--trailer);}
  .long-stay-badge{
    position:absolute;top:-7px;left:-7px;
    width:16px;height:16px;border-radius:50%;
    background:var(--trailer);color:var(--card);
    font-size:9px;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .spot.is-away{
    background:#e2f3e6 !important;
    border-color:#3c8e52 !important;
  }
  .away-badge{
    position:absolute;top:-7px;right:16px;
    background:var(--ink);color:var(--card);
    font-family:var(--font-display);font-size:8px;font-weight:700;letter-spacing:.05em;
    padding:2px 5px;border-radius:2px;
  }
  .winter-badge{
    position:absolute;bottom:-7px;left:-7px;
    width:16px;height:16px;border-radius:50%;
    background:#3c6e9e;color:var(--card);
    font-size:9px;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .winterklant-badge{
    position:absolute;bottom:-7px;right:-7px;
    max-width:75%;
    background:#3c6e9e;color:#fff;
    font-family:var(--font-display);font-size:8px;font-weight:700;letter-spacing:.02em;
    padding:2px 5px;border-radius:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  .add-spot-wrap{position:relative;flex-shrink:0;}
  .add-spot-btn{
    height:88px;width:50px;
    border:1.5px dashed var(--ink-faint);
    background:transparent;
    border-radius:var(--radius);
    color:var(--ink-faint);
    font-size:22px;
    cursor:pointer;
    font-family:var(--font-display);
  }
  .add-spot-btn:hover{color:var(--ink);border-color:var(--ink);}

  .add-menu{
    position:absolute;bottom:100%;left:0;margin-bottom:6px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 6px 18px rgba(27,42,74,.18);
    padding:10px;z-index:20;width:220px;
  }
  .add-menu.below{ bottom:auto; top:100%; margin-bottom:0; margin-top:6px; }
  .add-menu .type-row{margin-bottom:10px;}
  .add-menu .type-chip{font-size:11px;padding:6px 3px;min-width:0;}
  .add-menu-qty{
    display:flex;align-items:center;gap:8px;
    padding-top:8px;border-top:1px dashed var(--line);
  }
  .add-menu-qty label{font-size:11px;color:var(--ink-soft);font-weight:600;}
  .add-menu-qty input{
    width:52px;padding:5px 6px;border:1px solid var(--line);border-radius:var(--radius);
    font-family:var(--font-body);font-size:13px;color:var(--ink);background:var(--paper);outline:none;
  }
  .add-menu-qty input:focus{border-color:var(--ink);}
  .add-menu-qty .btn{margin-left:auto;}
  .add-menu button{
    width:100%;text-align:left;background:transparent;border:none;
    padding:7px 8px;font-size:12.5px;color:var(--ink);cursor:pointer;
    border-radius:2px;display:flex;align-items:center;gap:8px;font-family:var(--font-body);
  }
  .add-menu button:hover{background:var(--paper);}
  .dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}

  /* ---------- buttons ---------- */
  .btn{
    font-family:var(--font-body);
    font-size:12.5px;
    font-weight:600;
    padding:6px 12px;
    border-radius:var(--radius);
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
  }
  .btn:hover{opacity:.88;}
  .btn.ghost{background:transparent;color:var(--ink-soft);border-color:var(--line);}
  .btn.ghost:hover{color:var(--ink);border-color:var(--ink-soft);}
  .btn.small{padding:4px 9px;font-size:11.5px;}
  .btn.danger{background:var(--car);border-color:var(--car);}

  .empty-state{
    text-align:center;padding:50px 20px;color:var(--ink-soft);font-size:13.5px;
  }
  .empty-state b{color:var(--ink);}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(27,42,74,.35);
    display:none;align-items:center;justify-content:center;z-index:100;
    padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--card);border-radius:6px;border:1px solid var(--line);
    width:340px;max-width:100%;padding:20px;
    box-shadow:0 20px 50px rgba(27,42,74,.3);
    max-height:85vh;overflow-y:auto;
  }
  .modal h3{margin:0 0 4px;font-family:var(--font-display);font-size:15px;color:var(--ink);}
  .modal .sub{font-size:11.5px;color:var(--ink-soft);margin-bottom:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
  .field input, .field textarea, .field select{
    width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:var(--radius);
    font-family:var(--font-body);font-size:13px;color:var(--ink);background:var(--paper);
    outline:none;
  }
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--ink);}
  .field textarea{resize:vertical;min-height:50px;}
  .modal-actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;}
  .type-row{display:flex;gap:6px;flex-wrap:wrap;}
  .type-chip{
    flex:1;min-width:70px;text-align:center;padding:7px 4px;border-radius:var(--radius);
    border:1.5px solid var(--line);font-size:11.5px;font-weight:600;cursor:pointer;color:var(--ink-soft);
  }
  .type-chip.active{border-color:var(--ink);color:var(--ink);}

  .occ-list{max-height:260px;overflow-y:auto;margin-bottom:8px;}
  .occ-row{
    border:1px solid var(--paper-line);border-radius:var(--radius);
    padding:7px;margin-bottom:7px;background:var(--paper);
  }
  .occ-row-top{display:flex;gap:5px;align-items:center;margin-bottom:5px;}
  .occ-row-top .occ-name{flex:2;}
  .occ-row-contact{display:flex;gap:5px;margin-bottom:5px;}
  .occ-row-contact input{flex:1;}
  .occ-row input{
    min-width:0;padding:6px 7px;border:1px solid var(--line);border-radius:var(--radius);
    font-family:var(--font-body);font-size:12px;color:var(--ink);background:var(--card);outline:none;
  }
  .occ-row input:focus{border-color:var(--ink);}
  .occ-row-top .occ-name{flex:1.4;}
  .occ-row-top .occ-reg{flex:1;}
  .occ-row-top .occ-since{flex:1;color:var(--ink-soft);font-size:11px;}
  .occ-row .occ-notes{width:100%;box-sizing:border-box;}
  .occ-away-toggle{
    display:flex;align-items:center;gap:6px;margin-top:5px;
    font-size:10.5px;color:var(--ink-soft);cursor:pointer;
  }
  .occ-away-toggle input{width:13px;height:13px;cursor:pointer;}
  .occ-remove{
    flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);
    background:transparent;color:var(--ink-soft);font-size:11px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .occ-remove:hover{border-color:var(--car);color:var(--car);}
  .occ-move{
    flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);
    background:transparent;color:var(--ink-soft);font-size:11px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .occ-move:hover{border-color:var(--ink);color:var(--ink);}

  .status-line{font-size:11px;color:var(--ink-faint);text-align:center;margin-top:14px;font-family:var(--font-display);}

  /* ---------- manage types modal ---------- */
  .modal.wide{width:400px;}
  .type-manage-row{
    display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--paper-line);
  }
  .type-manage-row input[type="color"]{
    width:26px;height:26px;padding:0;border:1px solid var(--line);border-radius:4px;cursor:pointer;flex-shrink:0;background:none;
  }
  .type-manage-row .tm-label{
    flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--radius);padding:5px 7px;
    font-family:var(--font-body);font-size:12.5px;color:var(--ink);background:var(--paper);outline:none;
  }
  .type-manage-row .tm-label:focus{border-color:var(--ink);}
  .type-manage-row .tm-length{
    width:50px;border:1px solid var(--line);border-radius:var(--radius);padding:5px 6px;
    font-family:var(--font-body);font-size:12px;color:var(--ink);background:var(--paper);outline:none;flex-shrink:0;
  }
  .type-manage-row .tm-length:focus{border-color:var(--ink);}
  .type-manage-row .tm-usage{font-size:10px;color:var(--ink-faint);width:52px;flex-shrink:0;text-align:right;font-family:var(--font-display);}
  .type-manage-row .tm-del{
    flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:transparent;
    color:var(--ink-soft);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .type-manage-row .tm-del:disabled{opacity:.3;cursor:not-allowed;}
  .type-manage-row .tm-del:not(:disabled):hover{border-color:var(--car);color:var(--car);}
  .add-type-row{
    display:flex;align-items:center;gap:8px;padding-top:12px;margin-top:6px;border-top:1.5px dashed var(--line);
  }
  /* ---------- print ---------- */
  .print-only{display:none;}
  .print-report h1{font-family:var(--font-display);font-size:20px;margin:0 0 2px;}
  .print-report .print-meta{font-size:11px;color:#555;margin-bottom:14px;}
  .print-report .print-summary{display:flex;gap:24px;margin-bottom:18px;font-size:12px;}
  .print-warehouse{margin-bottom:14px;}
  .print-warehouse h2{
    font-family:var(--font-display);font-size:14px;margin:0 0 2px;
    border-bottom:1.5px solid #000;padding-bottom:4px;
  }
  .print-empty{font-size:11px;color:#777;font-style:italic;padding:6px 0;}
  .print-row-label{font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:#555;margin:9px 0 3px;}
  .print-row{display:flex;flex-wrap:wrap;gap:5px;}
  .print-aisle{
    text-align:center;font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    border-top:1px dashed #000;border-bottom:1px dashed #000;padding:5px 0;margin:8px 0;
  }
  .print-bay-box{
    width:96px;min-height:56px;border:1px solid #000;border-radius:2px;
    padding:4px 5px;font-size:9px;line-height:1.25;
    display:flex;flex-direction:column;justify-content:flex-start;
    break-inside:avoid;box-sizing:border-box;
  }
  .print-bay-box.print-empty-box{border-style:dashed;color:#666;}
  .print-bay-box.print-door{
    align-items:center;text-align:center;justify-content:center;
    background:repeating-linear-gradient(90deg,#000 0 4px,transparent 4px 8px);
    background-size:100% 1px;background-position:top;background-repeat:no-repeat;
  }
  .pbb-tag{font-weight:700;font-size:10.5px;}
  .pbb-type{color:#555;font-size:8.5px;margin-top:1px;}
  .pbb-name{font-weight:700;margin-top:3px;}
  .pbb-reg{color:#333;}
  .pbb-since{color:#777;font-size:8.5px;}
  .pbb-sub{color:#777;font-size:8.5px;margin-top:2px;}
  .pbb-notes{
    color:#444;font-size:8px;font-style:italic;margin-top:3px;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  /* ============================================================
     TOUCH DEVICES
     Anything hidden-until-hover on desktop needs to be visible by
     default here, since touchscreens don't have a real hover state
     — buttons that only ever appear on :hover are invisible on a
     phone. Slightly larger touch targets too, since a precise mouse
     click and a fingertip aren't the same kind of "precise".
     ============================================================ */
  @media (hover:none){
    .wh-tab-edit, .wh-tab-del, .wh-tab-move{
      display:flex;
      width:20px;height:20px;
    }
    .spot-del{
      display:flex;
      width:22px;height:22px;
      top:-9px;right:-9px;
    }
  }

  /* ============================================================
     NARROW SCREENS
     ============================================================ */
  @media (max-width:640px){
    /* Prevent iOS Safari's automatic zoom-on-focus, which otherwise
       fires on any text input styled under 16px. */
    input, select, textarea{ font-size:16px !important; }

    /* The most-used modal in the app — editing bay occupants.
       Name / reg / date / delete-button in one row is fine on a
       laptop but far too cramped on a phone; wrap it into two
       comfortable rows instead. */
    .occ-row-top{ flex-wrap:wrap; }
    .occ-row-top .occ-name{ flex-basis:100%; }
    .occ-row-top .occ-reg{ flex:1; min-width:90px; }
    .occ-row-top .occ-since{ flex:1; min-width:120px; }
    .occ-row-contact{ flex-wrap:wrap; }
    .occ-row-contact input{ min-width:140px; }

    /* Titleblock stacks more comfortably with less side padding lost
       to the logo at this width. */
    .titleblock-right{ align-items:flex-start; width:100%; }
    .toolbar-actions{ justify-content:flex-start; }

    /* Modal padding, slightly tightened so more content is visible
       without scrolling on a small screen. */
    .modal{ padding:18px 16px; }

    /* Search filters row — the free-only checkbox has room to sit on
       its own line rather than fighting the dropdown for space. */
    .search-filters{ gap:8px 14px; }
  }

  @media print{
    body *{visibility:hidden;}
    .print-only, .print-only *{visibility:visible;}
    .print-only{display:block;position:absolute;top:0;left:0;width:100%;margin:0;padding:16px;background:#fff;color:#000;}
    .print-warehouse{page-break-before:always;}
    .print-warehouse:first-of-type{page-break-before:auto;}
    @page{margin:12mm;}
  }
</style>
</head>
<body>

<div class="sheet" id="sheet">
  <div class="titleblock">

      <svg viewBox="0 0 323 367" width="40" height="45" style="flex-shrink:0;" xmlns="http://www.w3.org/2000/svg">

<!-- Optional cross-device sync. Safe to leave as-is if you haven't set up
     Firebase yet — the app just runs without sync until firebase-config.js
     has real values in it. See firebase-config.js for setup notes. -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="firebase-config.js"></script>

<script>
(function(){
  const DEFAULT_TYPES = {
    car:           { label:'Auto',             length:4.5, color:'#B54834', price:0, period:'jaar' },
    campervan:     { label:'Camper',           length:6.0, color:'#2E6E62', price:0, period:'jaar' },
    caravan:       { label:'Caravan',          length:7.0, color:'#47598C', price:0, period:'jaar' },
    trailer:       { label:'Trailer',          length:5.0, color:'#B4831F', price:0, period:'jaar' },
    foldingTrailer:{ label:'Vouwwagen',        length:4.0, color:'#6E5B8C', price:0, period:'jaar' },
  };
  // TYPES always points at state.vehicleTypes once state is loaded (see bindTypes()),
  // so edits made through "Manage types" are visible everywhere without extra plumbing.
  let TYPES = DEFAULT_TYPES;
  function bindTypes(){ TYPES = state.vehicleTypes; }
  function hexAlpha(hex, alpha){
    const a = Math.round(alpha * 255).toString(16).padStart(2,'0');
    return (hex.length === 7 ? hex : '#999999') + a;
  }
  const LONG_STAY_MS = 365 * 24 * 60 * 60 * 1000;
  function isLongStay(since){
    if(!since) return false;
    const d = new Date(since);
    if(isNaN(d.getTime())) return false;
    return (Date.now() - d.getTime()) > LONG_STAY_MS;
  }
  function slugify(label, existingKeys){
    let base = label.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'type';
    let key = base, n = 1;
    while(existingKeys.includes(key)) key = `${base}-${++n}`;
    return key;
  }
  const PX_PER_M = 15.5;
  const MIN_W = 56;
  const STORAGE_KEY = 'yard-plan-state-v2';

  function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }

  function emptyRow(){ return { id: uid(), spots: [] }; }

  function defaultWarehouse(cfg){
    return {
      id: uid(),
      name: cfg.name,
      purpose: cfg.purpose || '',
      recommended: cfg.recommended || null,
      layout: cfg.layout || 'aisle', // 'aisle' (two-sided, indoor) or 'single' (one row, outdoor — no aisle)
      aisleDoor: cfg.aisleDoor || null, // 'left' | 'right' | null — only meaningful for 'aisle' layout
      left: Array.from({length: cfg.left}, emptyRow),
      right: Array.from({length: cfg.right || 0}, emptyRow),
    };
  }

  function defaultState(){
    const warehouses = [
      defaultWarehouse({ name:'Loods 1', left:1, right:1, purpose:'Caravans & vouwwagens', recommended:['caravan','foldingTrailer'] }),
      defaultWarehouse({ name:'Loods 2', left:1, right:1, purpose:'Caravans & vouwwagens', recommended:['caravan','foldingTrailer'] }),
      defaultWarehouse({ name:'Loods 3', left:1, right:1, purpose:'Auto\'s, caravans & campers', recommended:['car','caravan','campervan'] }),
      defaultWarehouse({ name:'Loods 4', left:2, right:2 }),
      defaultWarehouse({ name:'Loods 5', left:2, right:1 }),
    ];
    return {
      facilityName: 'Storage Sites',
      warehouses,
      activeWarehouseId: warehouses[0].id,
      vehicleTypes: JSON.parse(JSON.stringify(DEFAULT_TYPES)),
    };
  }

  function spotDefault(type, seq){
    return { id: uid(), type, length: TYPES[type].length, occupants: [], seq, removed: false, isDoor: false, winterKlant: { name:'', objectNummer:'', price:'', betaald:false } };
  }
  function nextSeqFor(row){
    return row.spots.reduce((max, s) => Math.max(max, s.seq || 0), 0) + 1;
  }

  let state = null;
  let showOverview = false; // UI-only, not persisted
  let saveTimer = null;

  function migrate(loaded){
    if(!loaded || !Array.isArray(loaded.warehouses)) return null;
    if(!loaded.vehicleTypes || typeof loaded.vehicleTypes !== 'object'){
      loaded.vehicleTypes = JSON.parse(JSON.stringify(DEFAULT_TYPES));
    }
    Object.values(loaded.vehicleTypes).forEach(t => {
      if(typeof t.price !== 'number') t.price = 0;
      if(typeof t.period !== 'string') t.period = 'jaar';
    });
    loaded.warehouses.forEach(w => {
      // upgrade a pre-side/row save (single "aisles" array) into left/right rows
      if(Array.isArray(w.aisles) && !Array.isArray(w.left)){
        w.left = [{ id: uid(), spots: w.aisles.flatMap(a => a.spots) }];
        w.right = [emptyRow()];
        delete w.aisles;
      }
      if(!Array.isArray(w.left)) w.left = [emptyRow()];
      if(!Array.isArray(w.right)) w.right = [emptyRow()];
      if(typeof w.purpose !== 'string') w.purpose = '';
      if(w.layout !== 'single' && w.layout !== 'aisle') w.layout = 'aisle';
      if(w.aisleDoor !== 'left' && w.aisleDoor !== 'right') w.aisleDoor = null;
      // Relabels "links"/"rechts" for this warehouse without moving any
      // row/spot/customer between the two screen columns — see
      // sideLabelInfo().
      if(typeof w.labelsSwapped !== 'boolean') w.labelsSwapped = false;
      [...w.left, ...w.right].forEach(row => {
        row.spots.forEach((s, i) => {
          if(typeof s.seq !== 'number') s.seq = i + 1;
          if(typeof s.removed !== 'boolean') s.removed = false;
          if(typeof s.isDoor !== 'boolean') s.isDoor = false;
          if(!s.winterKlant || typeof s.winterKlant !== 'object'){
            s.winterKlant = { name:'', objectNummer:'', price:'', betaald:false };
          } else {
            if(typeof s.winterKlant.name !== 'string') s.winterKlant.name = '';
            if(typeof s.winterKlant.objectNummer !== 'string') s.winterKlant.objectNummer = '';
            if(typeof s.winterKlant.price !== 'string' && typeof s.winterKlant.price !== 'number') s.winterKlant.price = '';
            if(typeof s.winterKlant.betaald !== 'boolean') s.winterKlant.betaald = false;
          }
          if(!Array.isArray(s.occupants)){
            s.occupants = s.occupant ? [s.occupant] : [];
          }
          delete s.occupant;
          s.occupants.forEach(o => {
            if(typeof o.away !== 'boolean') o.away = false;
            if(typeof o.objectNummer !== 'string') o.objectNummer = '';
            if(typeof o.email !== 'string') o.email = '';
            if(typeof o.phone !== 'string') o.phone = '';
            // Tracks, per occupant, whether they've confirmed they're
            // returning this storage season — used on the "Klanten in
            // winterstalling" tab so staff can check off returning
            // customers rather than re-checking manually every year.
            if(typeof o.komtDitJaar !== 'boolean') o.komtDitJaar = false;
          });
        });
      });
    });
    return loaded;
  }

  // Uses window.storage when running inside Claude.ai (needs a connection).
  // Falls back to the browser's own localStorage when opened as a standalone
  // file with no connection at all — that's what makes offline use possible.
  const hasCloudStorage = typeof window.storage !== 'undefined' && window.storage;

  // Optional real-time sync across devices via Firebase, configured in firebase-config.js.
  // Not required — the app works fine without it, just without cross-device sync.
  const hasFirebaseSync = typeof FIREBASE_ENABLED !== 'undefined' && FIREBASE_ENABLED
    && typeof firebaseConfig !== 'undefined' && firebaseConfig.apiKey && firebaseConfig.databaseURL;
  const useRealLogin = hasFirebaseSync && typeof USE_REAL_LOGIN !== 'undefined' && USE_REAL_LOGIN;
  let syncRef = null;      // base ref at SYNC_PATH — parent of both 'data' and 'backups'
  let syncDataRef = null;  // syncRef.child('data') — the live, currently-synced state
  let applyingRemote = false;   // guards against feedback loops while applying an incoming update
  let suppressNextEcho = false; // set right after our own write, so we don't re-render our own echo

  function initFirebaseAppOnce(){
    if(!firebase.apps || !firebase.apps.length){
      firebase.initializeApp(firebaseConfig);
    }
  }

  function initFirebaseSync(){
    if(!hasFirebaseSync) return;
    let connected = false;
    const timeoutId = setTimeout(() => {
      if(!connected){
        setStatus('sync reageert niet — controleer firebase-config.js en je database rules');
      }
    }, 7000);
    try{
      initFirebaseAppOnce();
      syncRef = firebase.database().ref(typeof SYNC_PATH !== 'undefined' ? SYNC_PATH : 'storage-sites-data');
      syncDataRef = syncRef.child('data');

      // With real login (useRealLogin), you're already authenticated by the
      // time this runs — no separate anonymous sign-in needed, and calling
      // signInAnonymously() here would actually replace your real session
      // with an anonymous one, so it's skipped entirely in that mode.
      const needsAuth = !useRealLogin && (
        (typeof APPOINTMENTS_PATH !== 'undefined' && APPOINTMENTS_PATH)
        || (typeof BLOCKED_DATES_PATH !== 'undefined' && BLOCKED_DATES_PATH)
        || (typeof NIEUWE_KLANTEN_ENABLED !== 'undefined' && NIEUWE_KLANTEN_ENABLED)
      );
      if(useRealLogin){
        initAppointmentsSync();
        initBlockedDatesSync();
        initNieuweKlantenSync();
      } else if(needsAuth && firebase.auth){
        firebase.auth().signInAnonymously().then(() => {
          initAppointmentsSync();
          initBlockedDatesSync();
          initNieuweKlantenSync();
        }).catch((err) => {
          console.error('Anonymous sign-in failed', err);
        });
      }

      syncDataRef.on('value', (snapshot) => {
        connected = true;
        clearTimeout(timeoutId);
        if(suppressNextEcho){ suppressNextEcho = false; return; }
        const remote = snapshot.val();
        if(!remote){
          // Nothing at the live-data path. This does NOT automatically push
          // anything anymore — an earlier version did, and a transient/empty
          // read caused real data loss. Now it just tells you, and pushing
          // is a deliberate, confirmed action via the Backups dialog.
          const n = allSpotsGlobal().length;
          setStatus(`cloud is leeg — dit apparaat heeft ${n} plek${n===1?"":"ken"} lokaal; open "Back-ups" om ze te versturen als je het zeker weet`);
          return;
        }
        const parsed = migrate(JSON.parse(remote));
        if(!parsed) return;
        // don't yank the rug out from under an in-progress edit
        if(document.getElementById('overlay').classList.contains('show')) return;
        applyingRemote = true;
        state = parsed;
        if(!state.warehouses.find(w => w.id === state.activeWarehouseId)){
          state.activeWarehouseId = state.warehouses[0]?.id;
        }
        bindTypes();
        render();
        setStatus('zojuist gesynchroniseerd');
        applyingRemote = false;
      }, (error) => {
        connected = true;
        clearTimeout(timeoutId);
        console.error('Firebase sync error', error);
        setStatus('sync fout: ' + (error && error.message ? error.message : error) + ' — controleer je database rules');
      });
    }catch(e){
      clearTimeout(timeoutId);
      console.error('Firebase sync failed to start', e);
      setStatus('sync kon niet starten: ' + (e && e.message ? e.message : e));
    }
  }

  // ---------- agenda / appointments (from the public booking widget) ----------
  let appointments = [];       // [{id, name, contact, vehicleDesc, date, notes, createdAt, linked:{warehouseId,spotId}|null, status}]
  let appointmentsRef = null;
  let showAgenda = false;      // UI-only, not persisted

  function initAppointmentsSync(){
    if(!hasFirebaseSync || typeof APPOINTMENTS_PATH === 'undefined' || !APPOINTMENTS_PATH) return;
    try{
      appointmentsRef = firebase.database().ref(APPOINTMENTS_PATH);
      appointmentsRef.on('value', (snapshot) => {
        const val = snapshot.val() || {};
        appointments = Object.keys(val).map(k => ({ id: k, ...val[k] }));
        renderTabs();
        if(showAgenda) renderAgendaPage();
      }, (error) => {
        console.error('Appointments sync error', error);
      });
    }catch(e){
      console.error('Appointments sync failed to start', e);
    }
  }

  // ---------- blocked pickup dates ----------
  let blockedDates = {};       // { "YYYY-MM-DD": true, ... }
  let blockedDatesRef = null;

  function initBlockedDatesSync(){
    if(!hasFirebaseSync || typeof BLOCKED_DATES_PATH === 'undefined' || !BLOCKED_DATES_PATH) return;
    try{
      blockedDatesRef = firebase.database().ref(BLOCKED_DATES_PATH);
      blockedDatesRef.on('value', (snapshot) => {
        blockedDates = snapshot.val() || {};
      }, (error) => {
        console.error('Blocked dates sync error', error);
      });
    }catch(e){
      console.error('Blocked dates sync failed to start', e);
    }
  }

  // ---------- nieuwe klanten (signed contracts from the separate contract system) ----------
  let nieuweKlanten = [];      // signed ('voltooid') contracts not yet placed into a bay
  // ALL signed contracts (placed or not), keyed by normalized object nummer —
  // lets the Klanten tab show a "contract getekend" badge on any occupant
  // whose object nummer matches a signed contract, not just unplaced ones.
  let signedContractsByObjNum = {};
  let contractDb = null;
  let showNieuweKlanten = false; // UI-only, not persisted
  let showWinterstalling = false; // UI-only, not persisted
  let showKlanten = false; // UI-only, not persisted

  function initNieuweKlantenSync(){
    if(!hasFirebaseSync || typeof NIEUWE_KLANTEN_ENABLED === 'undefined' || !NIEUWE_KLANTEN_ENABLED || !firebase.firestore) return;
    try{
      contractDb = firebase.firestore();
      contractDb.collection('aanvragen').where('status', '==', 'voltooid')
        .onSnapshot((snap) => {
          const all = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          nieuweKlanten = all.filter(d => !d.geplaatstInStorageSites);
          signedContractsByObjNum = {};
          all.forEach(d => {
            const key = (d.objectnummer || '').trim().toLowerCase();
            if(key) signedContractsByObjNum[key] = d;
          });
          renderTabs();
          if(showNieuweKlanten) renderNieuweKlantenPage();
          // Klanten is intentionally NOT force-re-rendered here — it has its
          // own live search box, and re-rendering on every contract update
          // would drop focus/typed text mid-search. The badge still shows
          // correctly on the next natural render (opening the tab, etc.).
        }, (error) => {
          console.error('Nieuwe klanten sync error', error);
        });
    }catch(e){
      console.error('Nieuwe klanten sync failed to start', e);
    }
  }

  async function load(){
    try{
      if(hasCloudStorage){
        const res = await window.storage.get(STORAGE_KEY, false);
        state = res && res.value ? migrate(JSON.parse(res.value)) : null;
      } else {
        const raw = localStorage.getItem(STORAGE_KEY);
        state = raw ? migrate(JSON.parse(raw)) : null;
      }
      if(!state) state = defaultState();
      if(!state.warehouses.find(w => w.id === state.activeWarehouseId)){
        state.activeWarehouseId = state.warehouses[0]?.id;
      }
    }catch(e){
      state = defaultState();
    }
    bindTypes();
    render();
    setStatus(hasCloudStorage ? 'opgeslagen' : (hasFirebaseSync ? 'verbinden met sync…' : 'opgeslagen in deze browser (offline)'));
    initFirebaseSync();
  }

  function save(){
    if(applyingRemote) return; // this "change" came from the server itself — don't bounce it back
    setStatus('opslaan…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try{
        if(hasCloudStorage){
          const ok = await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
          setStatus(ok ? 'opgeslagen' : 'opslaan mislukt — wijzigingen alleen bewaard in deze sessie');
        } else {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          setStatus(hasFirebaseSync ? 'lokaal opgeslagen' : 'opgeslagen in deze browser (offline)');
        }
        if(hasFirebaseSync && syncDataRef){
          suppressNextEcho = true;
          syncDataRef.set(JSON.stringify(state))
            .then(() => setStatus('gesynchroniseerd tussen apparaten'))
            .catch(() => setStatus('lokaal opgeslagen — sync mislukt (offline?)'));
        }
        maybeAutoBackup();
      }catch(e){
        setStatus('opslaan mislukt — wijzigingen alleen bewaard in deze sessie');
      }
    }, 250);
  }

  // ---------- backup history ----------
  // Auto-snapshots at most once every 15 minutes of activity, plus always
  // right before a restore (so a restore itself is never a one-way door).
  const MAX_BACKUPS = 15;
  const BACKUP_INTERVAL_MS = 15 * 60 * 1000;
  const LOCAL_BACKUPS_KEY = STORAGE_KEY + '-backups';
  let lastBackupAt = 0;

  function maybeAutoBackup(){
    const now = Date.now();
    if(now - lastBackupAt < BACKUP_INTERVAL_MS) return;
    lastBackupAt = now;
    createBackup();
  }

  function createBackup(){
    const ts = Date.now();
    const json = JSON.stringify(state);
    if(hasFirebaseSync && syncRef){
      syncRef.child('backups').child(String(ts)).set(json).then(() => pruneFirebaseBackups()).catch(() => {});
    } else {
      try{
        const raw = localStorage.getItem(LOCAL_BACKUPS_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        arr.push({ ts, json });
        while(arr.length > MAX_BACKUPS) arr.shift();
        localStorage.setItem(LOCAL_BACKUPS_KEY, JSON.stringify(arr));
      }catch(e){}
    }
  }

  function pruneFirebaseBackups(){
    syncRef.child('backups').once('value').then(snap => {
      const val = snap.val();
      if(!val) return;
      const keys = Object.keys(val).sort((a,b) => Number(a) - Number(b));
      while(keys.length > MAX_BACKUPS){
        syncRef.child('backups').child(keys.shift()).remove();
      }
    }).catch(() => {});
  }

  function listBackups(callback){
    if(hasFirebaseSync && syncRef){
      syncRef.child('backups').once('value').then(snap => {
        const val = snap.val() || {};
        const list = Object.keys(val).map(k => ({ ts: Number(k), json: val[k] })).sort((a,b) => b.ts - a.ts);
        callback(list);
      }).catch(() => callback([]));
    } else {
      try{
        const raw = localStorage.getItem(LOCAL_BACKUPS_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        callback([...arr].sort((a,b) => b.ts - a.ts));
      }catch(e){ callback([]); }
    }
  }

  function pushLocalToCloudSectionHtml(){
    if(!hasFirebaseSync) return '';
    const n = allSpotsGlobal().length;
    return `
      <div class="field" style="border:1px solid var(--line);border-radius:var(--radius);padding:10px;background:var(--paper);">
        <label style="margin-bottom:4px;">Cloud synchronisatie</label>

      statusEl.style.display = 'block';

      try{
        emailjs.init(BACKUP_EMAIL_PUBLIC_KEY);
        const json = JSON.stringify(state, null, 2);
        const base64 = btoa(unescape(encodeURIComponent(json)));
        const stamp = new Date().toISOString().slice(0,10);
        const filename = `${(state.facilityName || 'storage-sites').replace(/\s+/g,'-')}-backup-${stamp}.json`;

        emailjs.send(BACKUP_EMAIL_SERVICE_ID, EMAILJS_TEMPLATE_ID_BACKUP, {
          to_email: BACKUP_EMAIL_TO,
          filename,
          date: new Date().toLocaleString(),
          backup_base64: base64,
          backup_filename: filename,

          statusEl.style.color = 'var(--accent-dark)';

  // ---------- modal: manage blocked pickup dates ----------
  function openBlockedDatesModal(){
    const overlay = document.getElementById('overlay');
    const body = document.getElementById('modalBody');
    body.className = 'modal';

    function groupIntoRanges(sortedDates){
      const ranges = [];
      sortedDates.forEach(d => {
        const last = ranges[ranges.length - 1];
        if(last){
          const nextExpected = new Date(last.end + 'T00:00:00');
          nextExpected.setDate(nextExpected.getDate() + 1);
          if(nextExpected.toISOString().slice(0,10) === d){
            last.end = d;
            last.dates.push(d);
            return;
          }
        }
        ranges.push({ start: d, end: d, dates: [d] });
      });
      return ranges;
    }

    function renderList(){
      const dates = Object.keys(blockedDates).sort();
      const ranges = groupIntoRanges(dates);
      body.innerHTML = `
        <h3>Geblokkeerde ophaaldata</h3>
        <div class="sub">Klanten kunnen deze data niet kiezen op het boekingsformulier — handig voor feestdagen of periodes dat je gesloten bent.</div>
        <div class="field">
          <label>Blokkeer een periode (gebruik dezelfde datum tweemaal voor één dag)</label>
          <div style="display:flex;gap:8px;align-items:center;">
            <input type="date" id="blockFrom" style="flex:1;" />
            <span style="font-size:12px;color:var(--ink-soft);">t/m</span>
            <input type="date" id="blockTo" style="flex:1;" />
          </div>
          <button class="btn small" id="addBlockedRangeBtn" style="margin-top:8px;width:100%;">Periode blokkeren</button>
        </div>
        <div id="blockedList">
          ${ranges.length === 0
            ? `<div class="print-empty">Er zijn momenteel geen data geblokkeerd.</div>`
            : ranges.map((r, i) => {
                const startLabel = new Date(r.start + 'T00:00:00').toLocaleDateString();
                const label = r.start === r.end
                  ? startLabel
                  : `${startLabel} – ${new Date(r.end + 'T00:00:00').toLocaleDateString()} (${r.dates.length} dagen)`;
                return `
                  <div class="type-manage-row">
                    <span style="flex:1;font-size:12.5px;color:var(--ink);">${escapeHtml(label)}</span>
                    <button class="btn ghost small" data-unblock-range="${i}">Deblokkeren</button>
                  </div>
                `;
              }).join('')
          }
        </div>
        <div class="modal-actions"><button class="btn ghost" id="bdCloseBtn">Sluiten</button></div>
      `;

      document.getElementById('addBlockedRangeBtn').addEventListener('click', () => {
        const fromVal = document.getElementById('blockFrom').value;
        const toVal = document.getElementById('blockTo').value;
        if(!fromVal || !toVal || !blockedDatesRef) return;
        let start = new Date(fromVal + 'T00:00:00');
        let end = new Date(toVal + 'T00:00:00');
        if(start > end){ const tmp = start; start = end; end = tmp; }
        const updates = {};
        const cursor = new Date(start);
        while(cursor <= end){
          updates[cursor.toISOString().slice(0,10)] = true;
          cursor.setDate(cursor.getDate() + 1);
        }
        blockedDatesRef.update(updates).then(renderList);
      });
      body.querySelectorAll('[data-unblock-range]').forEach(btn => {
        btn.addEventListener('click', () => {
          const range = ranges[parseInt(btn.getAttribute('data-unblock-range'), 10)];
          if(!blockedDatesRef) return;
          const updates = {};
          range.dates.forEach(d => { updates[d] = null; });
          blockedDatesRef.update(updates).then(renderList);
        });
      });
      document.getElementById('bdCloseBtn').addEventListener('click', closeModal);
    }

    renderList();
    overlay.classList.add('show');
    overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); }, { once:true });
  }

  function setStatus(t){

  function widthFor(length){
    // All bays render at the same fixed width now, regardless of the
    // vehicle length stored on them — the length itself is still tracked
    // and shown on the tile, it just no longer changes the bay's size on
    // the plan. FIXED_BAY_METERS is the "standard" size every bay is drawn
    // at; change it here if you ever want a different standard size.
    const FIXED_BAY_METERS = 5;
    return Math.max(MIN_W, Math.round(FIXED_BAY_METERS * PX_PER_M));
  }

  function activeWarehouse(){
    return state.warehouses.find(w => w.id === state.activeWarehouseId) || state.warehouses[0];
  }

  function warehouseRows(w){
    return [...w.left, ...w.right];
  }
  function warehouseSpots(w){
    return warehouseRows(w).flatMap(r => r.spots).filter(s => !s.removed && !s.isDoor);
  }
  function allSpots(){
    return warehouseSpots(activeWarehouse());
  }
  function allSpotsGlobal(){
    return state.warehouses.flatMap(w => warehouseSpots(w));
  }
  function findRow(rowId){
    const w = activeWarehouse();
    return warehouseRows(w).find(r => r.id === rowId);

  function renderOverviewStats(){
    const spots = allSpotsGlobal();
    const total = spots.length;
    const occupied = spots.filter(s => s.occupants && s.occupants.length > 0).length;
    const free = total - occupied;
    const el = document.getElementById('stats');
    el.innerHTML = '';
    [['Plekken', total], ['In gebruik', occupied], ['Vrij', free]].forEach(([l,n]) => {
      const d = document.createElement('div');
      d.className = 'stat';
      d.innerHTML = `<div class="n">${n}</div><div class="l">${l}</div>`;
      el.appendChild(d);
    });
    document.getElementById('globalStatLine').textContent = `Alle ${state.warehouses.length} loodsen`;

  function renderOverviewPage(){
    const wrap = document.getElementById('plan');
    wrap.innerHTML = '';

    const container = document.createElement('div');
    container.className = 'overview';

    // ---- per-warehouse availability ----
    const whSection = document.createElement('div');
    whSection.className = 'overview-section';
    let whRows = state.warehouses.map(w => {
      const spots = warehouseSpots(w);
      const occupied = spots.filter(s => s.occupants && s.occupants.length > 0).length;
      const away = spots.filter(s => s.occupants && s.occupants.some(o => o.away)).length;
      const doors = warehouseRows(w).flatMap(r => r.spots).filter(s => s.isDoor && !s.removed).length;
      return { id: w.id, name: w.name, total: spots.length, occupied, free: spots.length - occupied, away, doors };
    });
    const whTotals = whRows.reduce((acc, r) => ({
      total: acc.total + r.total, occupied: acc.occupied + r.occupied, free: acc.free + r.free, away: acc.away + r.away
    }), { total:0, occupied:0, free:0, away:0 });

    whSection.innerHTML = `
      <h3 class="overview-h">Beschikbare plekken per loods</h3>
      <table class="overview-table">
        <thead><tr><th>Loods</th><th>Plekken</th><th>In gebruik</th><th>Vrij</th><th>Weg</th></tr></thead>
        <tbody>
          ${whRows.map(r => `
            <tr class="ov-row" data-jump-wh="${r.id}" title="${escapeAttr(r.name)} openen">
              <td>${escapeHtml(r.name)}${r.doors ? ` <span class="ov-door-note">(${r.doors} ${doorIconSvg(10)})</span>` : ''}</td>

              <td>${r.away || ''}</td>

          `).join('')}
        </tbody>
        <tfoot>
          <tr>
            <td>Totaal</td>
            <td>${whTotals.total}</td>
            <td>${whTotals.occupied}</td>
            <td>${whTotals.free}</td>
            <td>${whTotals.away}</td>

    whSection.querySelectorAll('[data-jump-wh]').forEach(row => {

        state.activeWarehouseId = row.getAttribute('data-jump-wh');
        render();
      });
    });
    container.appendChild(whSection);

    // ---- pieces per vehicle type (counts individual vehicles, not bays —
    // a bay holding 3 motors counts as 3 pieces of that type) ----
    const typeSection = document.createElement('div');
    typeSection.className = 'overview-section';
    const typeCounts = {};
    Object.keys(TYPES).forEach(k => typeCounts[k] = 0);
    allSpotsGlobal().forEach(s => {
      if(!s.occupants) return;
      const n = s.occupants.length;
      if(n > 0) typeCounts[s.type] = (typeCounts[s.type] || 0) + n;
    });
    const totalPieces = Object.values(typeCounts).reduce((a,b) => a+b, 0);

    typeSection.innerHTML = `
      <h3 class="overview-h">Aantal per voertuigtype</h3>

              <tr>

                <td>${n}</td>
              </tr>
            `;
          }).join('')}
        </tbody>
        <tfoot>
          <tr><td>Totaal</td><td>${totalPieces}</td></tr>
        </tfoot>
      </table>

    container.appendChild(typeSection);

    wrap.appendChild(container);

  // ---------- agenda page ----------
  const DUTCH_DAY_NAMES = ['Zondag','Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag'];
  const DUTCH_MONTH_NAMES = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
  function formatDutchDate(dateStr){
    if(!dateStr) return '';
    const d = new Date(dateStr + 'T00:00:00');
    if(isNaN(d.getTime())) return dateStr;
    return `${DUTCH_DAY_NAMES[d.getDay()]} ${d.getDate()} ${DUTCH_MONTH_NAMES[d.getMonth()]}`;
  }

  function getWeekStart(dateStr){
    const d = new Date(dateStr + 'T00:00:00');
    if(isNaN(d.getTime())) return null;
    const day = d.getDay();
    const diff = (day === 0 ? -6 : 1 - day);
    const monday = new Date(d);
    monday.setDate(d.getDate() + diff);
    return monday;
  }

  // Moves just ONE occupant out of a bay that holds several — for a bay
  // with e.g. 12 different customers, drag-and-swap would move all 12 at
  // once, which is almost never what's actually wanted. This searches for
  // an empty destination bay and moves only the one occupant there,
  // leaving everyone else in the original bay untouched.
  function openMoveOneOccupantSearchModal(sourceSpot, occIdx){
    const occupant = sourceSpot.occupants[occIdx];
    if(!occupant) return;
    const overlay = document.getElementById('overlay');
    const body = document.getElementById('modalBody');
    body.className = 'modal wide';
    body.innerHTML = `

    `;

    const input = document.getElementById('moveOccSearchInput');
    input.focus();

    function runSearch(){
      const results = searchAvailableBaysForReturn(input.value);
      const resEl = document.getElementById('moveOccResults');
      if(results.length === 0){
        resEl.innerHTML = `<div class="search-empty">Geen beschikbare plekken gevonden.</div>`;
        return;
      }
      resEl.innerHTML = results.map((r, i) => `
        <div class="search-result" data-move-occ-result="${i}">
          <div class="search-result-main">
            <div class="search-result-name">Plek ${escapeHtml(r.tag)}</div>
            <div class="search-result-meta">${escapeHtml(r.warehouse.name)}${r.awayNames ? ` · momenteel weg: ${escapeHtml(r.awayNames)}` : ''}</div>
          </div>
        </div>
      `).join('');
      resEl.querySelectorAll('[data-move-occ-result]').forEach(node => {
        node.addEventListener('click', () => {
          const r = results[parseInt(node.getAttribute('data-move-occ-result'), 10)];
          const idx = sourceSpot.occupants.indexOf(occupant);
          if(idx === -1){ closeModal(); return; }
          sourceSpot.occupants.splice(idx, 1);
          r.spot.occupants = (r.spot.occupants || []).concat([occupant]);
          closeModal();
          render(); save();
        });
      });
    }
    input.addEventListener('input', runSearch);
    runSearch();

    document.getElementById('moveOccCancelBtn').addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); }, { once:true });
  }
