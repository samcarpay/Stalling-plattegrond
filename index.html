            <div class="search-result-meta">${escapeHtml(r.warehouse.name)}${r.awayNames ? ` · momenteel weg: ${escapeHtml(r.awayNames)}` : ''}</div>
          </div>
        </div>
      `).join('');
      resEl.querySelectorAll('[data-return-result]').forEach(node => {
        node.addEventListener('click', () => {
          const r = results[parseInt(node.getAttribute('data-return-result'), 10)];
          if(!occupant){ closeModal(); return; }
          const idx = info.spot.occupants.indexOf(occupant);
          if(idx === -1){ closeModal(); return; }
          info.spot.occupants.splice(idx, 1);
          occupant.away = false;
          r.spot.occupants = (r.spot.occupants || []).concat([occupant]);
          closeModal();
          render(); save();
        });
      });
    }
    input.addEventListener('input', runSearch);
    runSearch();

    document.getElementById('returnSearchCancelBtn').addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); }, { once:true });
  }

  // Finds the ONE occupant in a (possibly multi-vehicle) bay that a given
  // appointment actually refers to — matches by object nummer first (most
  // precise), then by name, and only assumes "the only occupant" when
  // there's genuinely just one. Returns null if it can't tell for sure,
  // rather than guessing and risking the wrong person getting toggled.
  function findMatchingOccupant(spot, appt){
    if(!spot || !spot.occupants || spot.occupants.length === 0) return null;
    if(spot.occupants.length === 1) return spot.occupants[0];
    const apptObjNum = (appt.vehicleDesc || '').trim().toLowerCase();
    if(apptObjNum){
      const byObjNum = spot.occupants.find(o => (o.objectNummer || '').trim().toLowerCase() === apptObjNum);
      if(byObjNum) return byObjNum;
    }
    const apptName = (appt.name || '').trim().toLowerCase();
    if(apptName){
      const byName = spot.occupants.find(o => (o.name || '').trim().toLowerCase() === apptName);
      if(byName) return byName;
    }
    return null;
  }

  function findLinkedInfo(linked){
    if(!linked) return null;
    const w = state.warehouses.find(x => x.id === linked.warehouseId);
    if(!w) return null;
    for(const side of ['left','right']){
      for(const row of w[side]){
        const s = row.spots.find(sp => sp.id === linked.spotId);
        if(s) return { warehouse: w, spot: s, side };
      }
    }
    return null;
  }

  // Looks for a bay whose object nummer exactly matches what the customer
  // typed in the booking form — lets a request be linked in one click
  // instead of a manual search, without ever linking silently on its own.
  function findObjectNummerMatch(appt){
    const q = (appt.vehicleDesc || '').trim().toLowerCase();
    if(!q) return null;
    for(const w of state.warehouses){
      const hasAisle = w.layout !== 'single';
      for(const side of ['left','right']){
        for(const row of w[side]){
          for(const spot of row.spots){
            if(spot.removed || spot.isDoor) continue;
            for(const o of (spot.occupants || [])){
              if((o.objectNummer || '').trim().toLowerCase() === q){
                return { warehouse: w, spot, side };
              }
            }
          }
        }
      }
    }
    return null;
  }

  let showAgendaHistory = false; // UI-only, not persisted

  let agendaSearchQuery = ''; // persisted across re-renders
  let expandedWeekKeys = new Set(); // which weeks are manually expanded; current week always included

  // Builds one fully-wired appointment card — shared by the away summary,
  // search results, and the normal week-grouped list, so all three stay
  // in sync automatically instead of drifting apart over time.
  let expandedCardIds = new Set(); // which appointment cards are tapped open; persists across re-renders

  function looksLikeEmail(s){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((s || '').trim());
  }

  // Builds a mailto: link pre-filled with a reply to this appointment,
  // quoting the customer's own note when there is one. This opens
  // whatever mail app is set as default (Outlook, Mail, etc.) with the
  // message ready to review and send by hand — nothing is sent
  // automatically, unlike the EmailJS confirmation the booking widget sends.
  function buildMailtoLink(a){
    const to = (a.contact || '').trim();
    const subjectParts = ['Ophaalafspraak'];
    if(a.vehicleDesc) subjectParts.push(`object ${a.vehicleDesc}`);
    const subject = subjectParts.join(' — ');
    const firstName = (a.name || '').trim().split(/\s+/)[0] || '';
    let body = `Beste ${firstName || 'klant'},\n\n`;
    if(a.notes && a.notes.trim()){
      const context = [a.vehicleDesc ? `object ${a.vehicleDesc}` : '', a.date ? `op ${formatDutchDate(a.date)}` : '']
        .filter(Boolean).join(' ');
      body += `Naar aanleiding van uw opmerking bij de ophaalaanvraag${context ? ' (' + context + ')' : ''}:\n"${a.notes.trim()}"\n\n\n`;
    } else {
      body += '\n\n';
    }
    return `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  }

  function buildActiveAppointmentCard(a){
    const info = findLinkedInfo(a.linked);
    const suggestion = !info ? findObjectNummerMatch(a) : null;
    const matchedOcc = info ? findMatchingOccupant(info.spot, a) : null;
    const away = matchedOcc ? !!matchedOcc.away : false;
    const isOpen = expandedCardIds.has(a.id);
    const card = document.createElement('div');
    card.className = 'agenda-card' + (away ? ' is-away' : '') + (info ? ' is-linked' : ' needs-action');

    // One compact line: where it's linked if it is, otherwise the vehicle/contact info.
    const compactSub = info
      ? `${info.warehouse.name} · plek ${displayTag(info.spot, info.warehouse.layout==='single' ? '' : (info.side==='left'?'L':'R'))}`
      : [a.vehicleDesc, a.contact].filter(Boolean).join(' · ');

    card.innerHTML = `
      <div class="agenda-card-top" style="cursor:pointer;">
        <div>
          <div class="agenda-date">${a.date ? escapeHtml(formatDutchDate(a.date)) : '(geen datum opgegeven)'}${info ? '<span class="agenda-badge linked">Gekoppeld</span>' : '<span class="agenda-badge needs">Nog koppelen</span>'}</div>
          <div class="agenda-name">${escapeHtml(a.name || 'Naam onbekend')}</div>
          <div class="agenda-sub">${escapeHtml(compactSub)}${away ? ' · <strong style="color:var(--ink);">momenteel weg</strong>' : ''}</div>
        </div>
        <div class="agenda-expand-icon">${isOpen ? '▾' : '▸'}</div>
      </div>
      <div class="agenda-card-details" style="display:${isOpen ? 'block' : 'none'};">
        ${(a.vehicleDesc || a.contact) && info ? `<div class="agenda-sub">${escapeHtml([a.vehicleDesc, a.contact].filter(Boolean).join(' · '))}</div>` : ''}
        ${a.notes ? `<div class="agenda-sub">${escapeHtml(a.notes)}</div>` : ''}
        <div class="agenda-link">
          ${info
            ? `Gekoppeld aan <strong>${escapeHtml(info.warehouse.name)}</strong>, plek ${escapeHtml(displayTag(info.spot, info.warehouse.layout==='single' ? '' : (info.side==='left'?'L':'R')))}${away ? ' — <span style="color:var(--ink);font-weight:700;">momenteel weg</span>' : ''}`
            : suggestion
              ? `<span style="color:var(--camper);">Mogelijke match:</span> <strong>${escapeHtml(suggestion.warehouse.name)}</strong>, plek ${escapeHtml(displayTag(suggestion.spot, suggestion.warehouse.layout==='single' ? '' : (suggestion.side==='left'?'L':'R')))} (object nummer komt overeen)`
              : `<span style="color:var(--car);">Nog niet gekoppeld aan een plek</span>`
          }
        </div>
        <div class="agenda-actions"></div>
      </div>
    `;
    card.querySelector('.agenda-card-top').addEventListener('click', () => {
      if(expandedCardIds.has(a.id)) expandedCardIds.delete(a.id);
      else expandedCardIds.add(a.id);
      render();
    });
    const actionsEl = card.querySelector('.agenda-actions');
    if(looksLikeEmail(a.contact)){
      const mailBtn = document.createElement('a');
      mailBtn.className = 'btn ghost small';
      mailBtn.style.cssText = 'text-decoration:none;display:inline-block;';
      mailBtn.textContent = '✉️ E-mail beantwoorden';
      mailBtn.href = buildMailtoLink(a);
      mailBtn.addEventListener('click', (e) => e.stopPropagation());
      actionsEl.appendChild(mailBtn);
    }
    if(info){
      const awayBtn = document.createElement('button');
      awayBtn.className = 'btn ghost small';
      awayBtn.textContent = away ? 'Terug gemeld' : 'Markeer als weg';
      awayBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if(away){
          openReturnConfirmModal(info, matchedOcc);
        } else if(matchedOcc){
          matchedOcc.away = true;
          render(); save();
        } else {
          alert('Kan niet met zekerheid bepalen welk voertuig in deze plek het betreft (meerdere voertuigen, geen duidelijke overeenkomst met naam of object nummer). Pas de plek zelf handmatig aan om deze klant als weg te markeren.');
        }
      });
      actionsEl.appendChild(awayBtn);
    } else {
      if(suggestion){
        const confirmBtn = document.createElement('button');
        confirmBtn.className = 'btn small';
        confirmBtn.textContent = 'Match bevestigen';
        confirmBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          appointmentsRef.child(a.id).update({
            linked: { warehouseId: suggestion.warehouse.id, spotId: suggestion.spot.id }
          });
        });
        actionsEl.appendChild(confirmBtn);
      }
      const linkBtn = document.createElement('button');
      linkBtn.className = 'btn ghost small';
      linkBtn.textContent = suggestion ? 'Toch zoeken' : 'Koppel aan plek';
      linkBtn.addEventListener('click', (e) => { e.stopPropagation(); openLinkAppointmentModal(a.id); });
      actionsEl.appendChild(linkBtn);
    }
    const doneBtn = document.createElement('button');
    doneBtn.className = 'btn ghost small';
    doneBtn.textContent = 'Markeer als afgerond';
    doneBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      appointmentsRef.child(a.id).update({ status: 'done', completedAt: Date.now() });
    });
    actionsEl.appendChild(doneBtn);
    const delBtn = document.createElement('button');
    delBtn.className = 'btn ghost small';
    delBtn.textContent = '✕';
    delBtn.title = 'Deze aanvraag verwijderen';
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      confirmAction('Deze aanvraag verwijderen?', `Dit verwijdert de aanvraag permanent uit de agenda.`, () => {
        appointmentsRef.child(a.id).remove();
      });
    });
    actionsEl.appendChild(delBtn);
    return { card, away };
  }

  function renderAgendaPage(){
    const wrap = document.getElementById('plan');
    wrap.innerHTML = '';

    if(!appointmentsRef){
      wrap.innerHTML = `<div class="print-empty">Verbinden…</div>`;
      return;
    }

    const container = document.createElement('div');
    container.className = 'overview';

    const toolbarRow = document.createElement('div');
    toolbarRow.style.cssText = 'display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;';

    const addBtn = document.createElement('button');
    addBtn.className = 'btn small';
    addBtn.textContent = '+ Nieuwe afspraak';
    addBtn.addEventListener('click', () => openNewAppointmentModal());
    toolbarRow.appendChild(addBtn);

    const historyToggle = document.createElement('button');
    historyToggle.className = 'btn ghost small';
    historyToggle.textContent = showAgendaHistory ? 'Geschiedenis verbergen' : 'Geschiedenis tonen (afgeronde ophalingen)';
    historyToggle.addEventListener('click', () => {
      showAgendaHistory = !showAgendaHistory;
      renderAgendaPage();
    });
    toolbarRow.appendChild(historyToggle);

    container.appendChild(toolbarRow);

    const active = appointments.filter(a => a.status !== 'done');

    if(active.length === 0 && !showAgendaHistory){
      const empty = document.createElement('div');
      empty.className = 'print-empty';
      empty.textContent = 'Nog geen ophaalafspraken. Ze verschijnen hier zodra klanten ze via je website indienen.';
      container.appendChild(empty);
      wrap.appendChild(container);
      return;
    }

    // ---- summary bar: today / this week / currently away, at a glance ----
    const todayStr = new Date().toISOString().slice(0,10);
    const todayCount = active.filter(a => a.date === todayStr).length;
    const thisWeekMonday = getWeekStart(todayStr);
    const thisWeekKeyStr = thisWeekMonday ? thisWeekMonday.toISOString().slice(0,10) : null;
    const weekCount = active.filter(a => {
      const m = getWeekStart(a.date);
      return m && thisWeekKeyStr && m.toISOString().slice(0,10) === thisWeekKeyStr;
    }).length;
    const awayCountForSummary = active.filter(a => {
      const info = findLinkedInfo(a.linked);
      if(!info) return false;
      const matchedOcc = findMatchingOccupant(info.spot, a);
      return matchedOcc && matchedOcc.away;
    }).length;

    const summaryBar = document.createElement('div');
    summaryBar.className = 'agenda-summary-bar';
    summaryBar.innerHTML = `
      <div class="agenda-summary-pill today"><div class="num">${todayCount}</div><div class="lbl">Vandaag</div></div>
      <div class="agenda-summary-pill week"><div class="num">${weekCount}</div><div class="lbl">Deze week</div></div>
      <div class="agenda-summary-pill away"><div class="num">${awayCountForSummary}</div><div class="lbl">Momenteel weg</div></div>
    `;
    if(thisWeekKeyStr){
      summaryBar.querySelector('.today').addEventListener('click', () => { expandedWeekKeys.add(thisWeekKeyStr); renderAgendaPage(); });
      summaryBar.querySelector('.week').addEventListener('click', () => { expandedWeekKeys.add(thisWeekKeyStr); renderAgendaPage(); });
    }
    summaryBar.querySelector('.away').addEventListener('click', () => {
      const awaySection = document.getElementById('agendaAwaySection');
      if(awaySection) awaySection.scrollIntoView({ behavior:'smooth', block:'start' });
    });
    container.appendChild(summaryBar);

    const searchInput = document.createElement('input');
    searchInput.type = 'text';
    searchInput.placeholder = 'Zoek op naam, object, kenteken of notitie…';
    searchInput.value = agendaSearchQuery;
    searchInput.style.cssText = 'width:100%;padding:9px 11px;margin-bottom:14px;border:1px solid var(--line);border-radius:var(--radius);font-size:13.5px;font-family:inherit;background:var(--card);color:var(--ink);box-sizing:border-box;';
    container.appendChild(searchInput);

    const resultsWrap = document.createElement('div');
    container.appendChild(resultsWrap);

    function renderResults(){
      resultsWrap.innerHTML = '';
      const q = agendaSearchQuery.trim().toLowerCase();

      if(q){
        const matches = active.filter(a => {
          const hay = [a.name, a.vehicleDesc, a.contact, a.notes].filter(Boolean).join(' ').toLowerCase();
          return hay.includes(q);
        }).sort((a,b) => (a.date||'').localeCompare(b.date||''));

        const section = document.createElement('div');
        section.className = 'overview-section';
        section.style.maxWidth = '640px';
        section.innerHTML = `<h3 class="overview-h">${matches.length} resultaat${matches.length===1?'':'en'} voor "${escapeHtml(agendaSearchQuery)}"</h3>`;
        if(matches.length === 0){
          const empty = document.createElement('div');
          empty.className = 'print-empty';
          empty.textContent = 'Niets gevonden.';
          section.appendChild(empty);
        }
        matches.forEach(a => {
          const { card } = buildActiveAppointmentCard(a);
          section.appendChild(card);
        });
        resultsWrap.appendChild(section);
        return;
      }

      // Currently-away customers — computed now, but rendered after the
      // week list below, since upcoming pickups matter more at a glance.
      const awayList = active.filter(a => {
        const info = findLinkedInfo(a.linked);
        if(!info) return false;
        const matchedOcc = findMatchingOccupant(info.spot, a);
        return matchedOcc && matchedOcc.away;
      });

      if(active.length === 0){
        const empty = document.createElement('div');
        empty.className = 'print-empty';
        empty.textContent = 'Op dit moment geen actieve ophaalafspraken.';
        resultsWrap.appendChild(empty);
        return;
      }

      // ---- week-grouped list, collapsible so upcoming weeks don't force endless scrolling ----
      const weeks = {};
      active.forEach(a => {
        const monday = getWeekStart(a.date) || new Date(a.createdAt || Date.now());
        const key = monday.toISOString().slice(0,10);
        if(!weeks[key]) weeks[key] = { monday, items: [] };
        weeks[key].items.push(a);
      });
      let weekKeys = Object.keys(weeks).sort();
      const currentWeekKey = getWeekStart(new Date().toISOString().slice(0,10));
      const currentWeekKeyStr = currentWeekKey ? currentWeekKey.toISOString().slice(0,10) : null;
      if(currentWeekKeyStr){
        expandedWeekKeys.add(currentWeekKeyStr);
        if(weekKeys.includes(currentWeekKeyStr)){
          weekKeys = [currentWeekKeyStr, ...weekKeys.filter(k => k !== currentWeekKeyStr)];
        }
      }

      weekKeys.forEach(key => {
        const wk = weeks[key];
        wk.items.sort((a,b) => (a.date||'').localeCompare(b.date||''));
        const endDate = new Date(wk.monday);
        endDate.setDate(endDate.getDate() + 6);
        const isExpanded = expandedWeekKeys.has(key);

        const section = document.createElement('div');
        section.className = 'overview-section';
        section.style.maxWidth = '640px';

        const headerBtn = document.createElement('button');
        headerBtn.className = 'agenda-week-header';
        headerBtn.innerHTML = `<span>${isExpanded ? '▾' : '▸'} Week van ${wk.monday.toLocaleDateString()} – ${endDate.toLocaleDateString()}</span><span class="agenda-week-count">${wk.items.length}</span>`;
        headerBtn.addEventListener('click', () => {
          if(expandedWeekKeys.has(key)) expandedWeekKeys.delete(key);
          else expandedWeekKeys.add(key);
          renderResults();
        });
        section.appendChild(headerBtn);

        if(isExpanded){
          const byDay = {};
          wk.items.forEach(a => {
            const dayKey = a.date || '(geen datum)';
            if(!byDay[dayKey]) byDay[dayKey] = [];
            byDay[dayKey].push(a);
          });
          Object.keys(byDay).sort().forEach(dayKey => {
            const dayHeading = document.createElement('div');
            const isToday = dayKey === todayStr;
            dayHeading.className = 'agenda-day-heading' + (isToday ? ' today' : '');
            const label = dayKey === '(geen datum)' ? 'Geen datum opgegeven' : formatDutchDate(dayKey);
            dayHeading.innerHTML = isToday
              ? `<span class="agenda-day-tag">Vandaag</span> ${escapeHtml(label)}`
              : escapeHtml(label);
            section.appendChild(dayHeading);
            byDay[dayKey].forEach(a => {
              const { card } = buildActiveAppointmentCard(a);
              section.appendChild(card);
            });
          });
        }

        resultsWrap.appendChild(section);
      });

      // ---- currently-away summary — now below the pickup list, since upcoming pickups matter more at a glance ----
      if(awayList.length > 0){
        const awaySection = document.createElement('div');
        awaySection.className = 'overview-section';
        awaySection.style.maxWidth = '640px';
        awaySection.innerHTML = `<h3 class="overview-h">Momenteel weg (${awayList.length})</h3>`;
        awayList.forEach(a => {
          const { card } = buildActiveAppointmentCard(a);
          awaySection.appendChild(card);
        });
        resultsWrap.appendChild(awaySection);
      }
    }

    searchInput.addEventListener('input', () => {
      agendaSearchQuery = searchInput.value;
      renderResults();
    });

    renderResults();

    if(showAgendaHistory){
      const done = appointments.filter(a => a.status === 'done')
        .sort((a,b) => (b.completedAt || 0) - (a.completedAt || 0));

      const histSection = document.createElement('div');
      histSection.className = 'overview-section';
      histSection.style.maxWidth = '640px';
      histSection.innerHTML = `<h3 class="overview-h">Geschiedenis — afgeronde ophalingen</h3>`;

      if(done.length === 0){
        const empty = document.createElement('div');
        empty.className = 'print-empty';
        empty.textContent = 'Nog geen afgeronde ophalingen.';
        histSection.appendChild(empty);
      }

      done.forEach(a => {
        const info = findLinkedInfo(a.linked);
        const card = document.createElement('div');
        card.className = 'agenda-card';
        card.style.opacity = '.75';
        card.innerHTML = `
          <div class="agenda-card-top">
            <div>
              <div class="agenda-date">${a.date ? escapeHtml(formatDutchDate(a.date)) : ''}${a.completedAt ? ' · afgerond op ' + new Date(a.completedAt).toLocaleDateString() : ''}</div>
              <div class="agenda-name">${escapeHtml(a.name || 'Naam onbekend')}</div>
              <div class="agenda-sub">${escapeHtml(a.vehicleDesc || '')}${a.contact ? ' · ' + escapeHtml(a.contact) : ''}</div>
            </div>
            <div class="agenda-actions"></div>
          </div>
          <div class="agenda-link">
            ${info
              ? `Was gekoppeld aan <strong>${escapeHtml(info.warehouse.name)}</strong>, plek ${escapeHtml(displayTag(info.spot, info.warehouse.layout==='single' ? '' : (info.side==='left'?'L':'R')))}`
              : `Was niet gekoppeld aan een plek`
            }
          </div>
        `;
        const actionsEl = card.querySelector('.agenda-actions');
        const reopenBtn = document.createElement('button');
        reopenBtn.className = 'btn ghost small';
        reopenBtn.textContent = 'Heropenen';
        reopenBtn.title = 'Terugzetten naar actieve afspraken';
        reopenBtn.addEventListener('click', () => {
          appointmentsRef.child(a.id).update({ status: 'requested', completedAt: null });
        });
        actionsEl.appendChild(reopenBtn);
        const delBtn = document.createElement('button');
        delBtn.className = 'btn ghost small';
        delBtn.textContent = '✕';
        delBtn.title = 'Permanent verwijderen';
        delBtn.addEventListener('click', () => {
          confirmAction('Dit geschiedenisitem verwijderen?', 'Dit verwijdert het permanent — hierna is er geen geschiedenis meer van.', () => {
            appointmentsRef.child(a.id).remove();
          });
        });
        actionsEl.appendChild(delBtn);
        histSection.appendChild(card);
      });

      container.appendChild(histSection);
    }

    wrap.appendChild(container);
  }

  // ---------- nieuwe klanten page ----------
  // ---------- winterstalling: consolidated view across all Winter warehouses ----------
  // Finds every occupied bay whose objectNummer matches, in any warehouse
  // OTHER than the one given — used to show "this customer also currently
  // holds a spot elsewhere" without needing a separate manual link, since
  // the outdoor bay itself doesn't stay reserved for them over winter.
  function findOtherBaysWithObjectNummer(objectNummer, excludeWarehouseId){
    const q = (objectNummer || '').trim().toLowerCase();
    if(!q) return [];
    const matches = [];
    state.warehouses.forEach(w => {
      if(w.id === excludeWarehouseId) return;
      const hasAisle = w.layout !== 'single';
      const sides = warehouseSides(w);
      sides.forEach(([key, tagPrefix]) => {
        w[key].forEach(row => {
          row.spots.forEach(spot => {
            if(spot.removed || spot.isDoor) return;
            (spot.occupants || []).forEach(o => {
              if((o.objectNummer || '').trim().toLowerCase() === q){
                matches.push({ warehouse: w, spot, tagPrefix });
              }
            });
            if(spot.winterKlant && (spot.winterKlant.objectNummer || '').trim().toLowerCase() === q){
              matches.push({ warehouse: w, spot, tagPrefix });
            }
          });
        });
      });
    });
    return matches;
  }

  // ---------- klanten: master list of every customer, sorted by object nummer ----------
  let klantenSearchQuery = ''; // persisted across re-renders so typing doesn't reset

  function renderKlantenPage(){
    const wrap = document.getElementById('plan');
    wrap.innerHTML = '';

    const container = document.createElement('div');
    container.className = 'overview';

    const allRows = [];
    state.warehouses.forEach(w => {
      const hasAisle = w.layout !== 'single';
      const sides = warehouseSides(w);
      sides.forEach(([key, tagPrefix]) => {
        w[key].forEach(row => {
          row.spots.forEach(spot => {
            if(spot.removed || spot.isDoor) return;
            (spot.occupants || []).forEach(o => {
              if(!o.name && !o.reg && !o.objectNummer) return;
              allRows.push({ warehouse: w, spot, tagPrefix, occupant: o });
            });
            if(spot.winterKlant && (spot.winterKlant.name || spot.winterKlant.objectNummer)){
              allRows.push({
                warehouse: w, spot, tagPrefix,
                occupant: { name: spot.winterKlant.name, objectNummer: spot.winterKlant.objectNummer, reg:'', phone:'', email:'' },
                isWinterKlant: true,
                winterPrice: spot.winterKlant.price,
                winterBetaald: spot.winterKlant.betaald,
              });
            }
          });
        });
      });
    });

  // Finds empty (unoccupied, non-door, non-removed) bays across every
  // warehouse — used when placing a new customer into a real bay.
  function searchEmptyBaysForPlacement(query){
    const q = query.trim().toLowerCase();
    const results = [];
    state.warehouses.forEach(w => {
      const hasAisle = w.layout !== 'single';
      const sides = warehouseSides(w);
      sides.forEach(([key, tagPrefix]) => {
        w[key].forEach(row => {
          row.spots.forEach(spot => {
            if(spot.removed || spot.isDoor) return;
            if(spot.occupants && spot.occupants.length > 0) return;
            const tag = displayTag(spot, tagPrefix);
            const hay = [spot.label || '', tag, w.name].join(' ').toLowerCase();
            if(!q || hay.includes(q)){
              results.push({ warehouse: w, spot, tagPrefix, tag });
            }
          });
        });
      });
    });
    return results.slice(0, 30);
  }

  // Same as above, but also includes bays that aren't empty — as long as
  // EVERY occupant currently there is marked away, meaning the physical
  // space is genuinely free right now even though it's still "someone's"
  // bay on paper. Only used for the "terug gemeld" flow, since placing a
  // brand new customer into an away customer's bay wouldn't make sense —
  // this is specifically for a vehicle that's coming back and can share
  // the space with whoever's currently away from it.
  function searchAvailableBaysForReturn(query){
    const q = query.trim().toLowerCase();
    const results = [];
    state.warehouses.forEach(w => {
      const hasAisle = w.layout !== 'single';
      const sides = warehouseSides(w);
      sides.forEach(([key, tagPrefix]) => {
        w[key].forEach(row => {
          row.spots.forEach(spot => {
            if(spot.removed || spot.isDoor) return;
            const isEmpty = !spot.occupants || spot.occupants.length === 0;
            const allAway = !isEmpty && spot.occupants.every(o => o.away);
            if(!isEmpty && !allAway) return;
            const tag = displayTag(spot, tagPrefix);
            const hay = [spot.label || '', tag, w.name].join(' ').toLowerCase();
            if(!q || hay.includes(q)){
              const awayNames = allAway ? spot.occupants.map(o => o.name || 'Naam onbekend').join(', ') : null;
              results.push({ warehouse: w, spot, tagPrefix, tag, awayNames, isEmpty });
            }
          });
        });
      });
    });
    // Truly empty bays first — with a lot of "away" bays in the mix, a
    // fixed result cap could otherwise fill up entirely with those before
    // ever reaching an empty one, hiding the more common choice.
    results.sort((a, b) => (a.isEmpty === b.isEmpty) ? 0 : (a.isEmpty ? -1 : 1));
    return results.slice(0, 60);
  }

  function guessTypeKeyFor(categorie){
    const c = (categorie || '').trim().toLowerCase();
    const keys = Object.keys(TYPES);
    const byLabel = keys.find(k => TYPES[k].label.toLowerCase() === c);
    if(byLabel) return byLabel;
    // loose fallback matches for common Dutch category names
    if(c.includes('camper')) return keys.find(k => k.toLowerCase().includes('camper')) || keys[0];
    if(c.includes('caravan')) return keys.find(k => k.toLowerCase().includes('caravan')) || keys[0];
    if(c.includes('auto')) return keys.find(k => k.toLowerCase().includes('car')) || keys[0];
    if(c.includes('aanhanger') || c.includes('trailer')) return keys.find(k => k.toLowerCase().includes('trailer')) || keys[0];
    return keys[0];
  }

  // Opens the normal bay-edit modal, but pre-filled with this signed
  // customer's details, and marks the contract as placed once saved.
  function openPlacementBayModal(aanvraag, result){
    // switch to the right warehouse first, so the bay actually renders correctly afterward
    state.activeWarehouseId = result.warehouse.id;
    showNieuweKlanten = false;
    render();

    const spot = result.spot;
    const t = guessTypeKeyFor(aanvraag.categorie);
    if(TYPES[t]) spot.type = t;

    const notesParts = [];
    if(aanvraag.categorie) notesParts.push(aanvraag.categorie);
    if(aanvraag.merk || aanvraag.type) notesParts.push(`${aanvraag.merk || ''} ${aanvraag.type || ''}`.trim());
    if(aanvraag.lengte && aanvraag.breedte) notesParts.push(`${aanvraag.lengte}m × ${aanvraag.breedte}m`);
    if(aanvraag.adres) notesParts.push(`${aanvraag.adres}, ${aanvraag.postcode || ''} ${aanvraag.woonplaats || ''}`.trim());

  function openLinkAppointmentModal(appointmentId){
    const appt = appointments.find(a => a.id === appointmentId);
    if(!appt) return;
    const overlay = document.getElementById('overlay');
    const body = document.getElementById('modalBody');
    body.className = 'modal wide';
    body.innerHTML = `
      <h3>Koppel aan een plek</h3>
      <div class="sub">Aangevraagd door ${escapeHtml(appt.name || 'Naam onbekend')} — ${escapeHtml(appt.vehicleDesc || 'geen voertuigomschrijving opgegeven')}</div>

      </div>
      <div id="linkResults" style="max-height:320px;overflow-y:auto;"></div>
      <div class="modal-actions"><button class="btn ghost" id="linkCancelBtn">Annuleren</button></div>
    `;
    overlay.classList.add('show');
    const input = document.getElementById('linkSearchInput');
    input.value = appt.vehicleDesc || appt.name || '';
    input.focus();

    function runSearch(){
      const results = searchOccupiedBaysForLink(input.value);
      const resEl = document.getElementById('linkResults');
      if(results.length === 0){
        resEl.innerHTML = `<div class="search-empty">Geen resultaten — probeer een andere zoekterm.</div>`;
        return;
      }
      resEl.innerHTML = results.map((r, i) => {
        const t = TYPES[r.spot.type] || { color:'#7A7A7A', label:'Onbekend' };
        const tag = displayTag(r.spot, r.tagPrefix);
        return `
          <div class="search-result" data-link-result="${i}">
            <span class="dot" style="background:${t.color}"></span>
            <div class="search-result-main">
              <div class="search-result-name">${escapeHtml(r.occupant.name || 'Naam onbekend')}${r.occupant.reg ? ' · ' + escapeHtml(r.occupant.reg) : ''}</div>
              <div class="search-result-meta">${escapeHtml(r.warehouse.name)} · plek ${escapeHtml(tag)} · ${t.label}</div>
            </div>
          </div>
        `;
      }).join('');
      resEl.querySelectorAll('[data-link-result]').forEach(node => {
        node.addEventListener('click', () => {
          const r = results[parseInt(node.getAttribute('data-link-result'), 10)];
          appointmentsRef.child(appointmentId).update({
            linked: { warehouseId: r.warehouse.id, spotId: r.spot.id }
          });
          body.className = 'modal';
          closeModal();
        });
      });
    }
    input.addEventListener('input', runSearch);
    runSearch();

    document.getElementById('linkCancelBtn').addEventListener('click', () => { body.className = 'modal'; closeModal(); });
    overlay.addEventListener('click', (e) => { if(e.target === overlay){ body.className = 'modal'; closeModal(); } }, { once:true });
  }

  function openRenameWarehouseModal(warehouseId){
    const w = state.warehouses.find(x => x.id === warehouseId);
    if(!w) return;
    const overlay = document.getElementById('overlay');
    const body = document.getElementById('modalBody');
    body.className = 'modal';
    let layout = w.layout;
    let aisleDoor = w.aisleDoor;

    function layoutChipHtml(){
      return `
        <div class="type-row" id="layoutRow">
          <div class="type-chip ${layout==='aisle'?'active':''}" data-layout="aisle">Pad (binnen, twee kanten)</div>
          <div class="type-chip ${layout==='single'?'active':''}" data-layout="single">Enkele rij (buiten)</div>
        </div>
      `;
    }
    function doorChipHtml(){
      // Labels reflect w.labelsSwapped, but data-door stays tied to the
      // physical/screen side ('left'/'right') — swapping the labels never
      // changes what data-door="left" means, only what word is shown for it.
      const leftName = sideLabelInfo(w, 'left').name.toLowerCase();
      const rightName = sideLabelInfo(w, 'right').name.toLowerCase();
      return `
        <div class="type-row" id="doorRow">
          <div class="type-chip ${!aisleDoor?'active':''}" data-door="">Geen deurmarkering</div>
          <div class="type-chip ${aisleDoor==='left'?'active':''}" data-door="left">Deur ${leftName}</div>
          <div class="type-chip ${aisleDoor==='right'?'active':''}" data-door="right">Deur ${rightName}</div>
        </div>
      `;
    }

    body.innerHTML = `
      <h3>Loods instellingen</h3>
      <div class="field">
        <label>Naam loods</label>
        <input type="text" id="fWhName" value="${escapeAttr(w.name)}" />
      </div>
      <div class="field">
        <label>Doel / omschrijving (optioneel)</label>
        <input type="text" id="fWhPurpose" value="${escapeAttr(w.purpose || '')}" placeholder="bijv. Caravans & vouwwagens" />
      </div>
      <div class="field">
        <label>Indeling</label>
        <div id="layoutWrap">${layoutChipHtml()}</div>
      </div>
      <div class="field" id="doorField" style="${layout==='single'?'display:none;':''}">
        <label>Positie deur op het pad</label>
        <div id="doorWrap">${doorChipHtml()}</div>
      </div>
      <div class="field" id="swapField" style="${layout==='single'?'display:none;':''}">
        <label>Links en rechts staan verwisseld?</label>
        <button type="button" class="btn ghost" id="whSwapBtn">${w.labelsSwapped ? '⇄ Links en rechts weer terugzetten' : '⇄ Verwissel links en rechts'}</button>
        <div style="font-size:.78rem;color:var(--ink-soft);margin-top:6px;">
          Verandert alleen hoe deze loods "links" en "rechts" noemt (labels, zoeken, print) —
          er verplaatst geen enkele plek of klant naar de andere kant. Direct doorgevoerd, ook
          zonder op Opslaan te klikken.
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="whCancelBtn">Annuleren</button>
        <button class="btn" id="whSaveBtn">Opslaan</button>
      </div>
    `;
    overlay.classList.add('show');
    const input = document.getElementById('fWhName');
    input.focus();
    input.select();

    function bindLayoutChips(){
      document.querySelectorAll('#layoutRow [data-layout]').forEach(chip => {
        chip.addEventListener('click', () => {
          layout = chip.getAttribute('data-layout');
          document.getElementById('layoutWrap').innerHTML = layoutChipHtml();
          bindLayoutChips();
          document.getElementById('doorField').style.display = layout === 'single' ? 'none' : '';
          document.getElementById('swapField').style.display = layout === 'single' ? 'none' : '';
        });
      });
    }
    function bindDoorChips(){
      document.querySelectorAll('#doorRow [data-door]').forEach(chip => {
        chip.addEventListener('click', () => {
          aisleDoor = chip.getAttribute('data-door') || null;
          document.getElementById('doorWrap').innerHTML = doorChipHtml();
          bindDoorChips();
        });
      });
    }
    bindLayoutChips();
    bindDoorChips();

    // Relabels "links"/"rechts" for this warehouse only — w.left/w.right
    // themselves (and every row, spot and customer inside them) are left
    // exactly where they are; only the word/tag-letter shown for each
    // screen column flips (see sideLabelInfo(), used everywhere a side is
    // displayed, searched, or printed).
    document.getElementById('whSwapBtn').addEventListener('click', () => {
      const oldLeftTag = sideLabelInfo(w, 'left').tag;
      const oldRightTag = sideLabelInfo(w, 'right').tag;
      w.labelsSwapped = !w.labelsSwapped;
      const newLeftTag = sideLabelInfo(w, 'left').tag;
      const newRightTag = sideLabelInfo(w, 'right').tag;

      // The plain auto-generated tag (e.g. "L2") already updates on its
      // own, since it's computed fresh from sideLabelInfo() every render —
      // only custom-typed labels (e.g. "L2-1", "L2-2" on a split bay) need
      // to be rewritten here.
      w.left.forEach(row => row.spots.forEach(spot => {
        if(spot.label) spot.label = relabelCustomSpotLabel(spot.label, oldLeftTag, newLeftTag);
      }));
      w.right.forEach(row => row.spots.forEach(spot => {
        if(spot.label) spot.label = relabelCustomSpotLabel(spot.label, oldRightTag, newRightTag);
      }));

      document.getElementById('whSwapBtn').textContent = w.labelsSwapped
        ? '⇄ Links en rechts weer terugzetten'
        : '⇄ Verwissel links en rechts';
      document.getElementById('doorWrap').innerHTML = doorChipHtml();
      bindDoorChips();
      render();
      save();
    });

    const finish = (shouldSave) => {
      if(shouldSave){
        const val = input.value.trim();
        if(val) w.name = val;
        w.purpose = document.getElementById('fWhPurpose').value.trim();
        if(layout !== w.layout){
          if(layout === 'single'){
            // merge the bays from both sides into one row — not one row per
            // side, so switching to "single" actually ends up as one row
            if(w.left.length === 0) w.left = [emptyRow()];
            const rightSpots = w.right.flatMap(r => r.spots);
            w.left[0].spots = [...w.left[0].spots, ...rightSpots];
            w.left = [w.left[0]]; // drop any extra left rows too — single means one row
            w.right = [];
          } else if(w.right.length === 0){
            w.right = [emptyRow()];
          }
          w.layout = layout;
        }
        w.aisleDoor = layout === 'single' ? null : aisleDoor;
      }
      closeModal();
      render();
      if(shouldSave) save();
    };
    document.getElementById('whCancelBtn').addEventListener('click', () => finish(false));
    document.getElementById('whSaveBtn').addEventListener('click', () => finish(true));
    input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter') finish(true);
      if(e.key === 'Escape') finish(false);
    });
    overlay.addEventListener('click', (e) => { if(e.target === overlay) finish(false); }, { once:true });
  }

  function rowLabel(sideName, idx, hasAisle){
    if(!hasAisle) return `Rij ${idx+1}`;
    if(idx === 0) return `${sideName} · rij 1 (bij het pad)`;
    return `${sideName} · rij ${idx+1} (achter)`;
  }

  let lastPlanWarehouseId = null; // tracks which warehouse the current scroll position belongs to

  function renderPlan(){
    const wrap = document.getElementById('plan');
    const activeWh = activeWarehouse();
    const existingScroller = wrap.querySelector('.plan-scroll');
    // Only carry the scroll position over if we're re-rendering the SAME
    // warehouse (e.g. after saving a bay) — switching to a different
    // warehouse should still start scrolled to the left, same as before.
    const preserveScrollLeft = (existingScroller && activeWh && lastPlanWarehouseId === activeWh.id)
      ? existingScroller.scrollLeft
      : 0;
    lastPlanWarehouseId = activeWh ? activeWh.id : null;

    wrap.innerHTML = '';
    const w = activeWh;
    if(!w) return;
    const hasAisle = w.layout !== 'single';

    const scroller = document.createElement('div');
    scroller.className = 'plan-scroll';

    const plan = document.createElement('div');
    plan.className = 'plan';

    if(hasAisle){
      const rightInfo = sideLabelInfo(w, 'right');
      const leftInfo = sideLabelInfo(w, 'left');

      // right side, farthest row first so it sits furthest from the aisle bar
      [...w.right].reverse().forEach((row, i) => {
        const realIdx = w.right.length - 1 - i;
        plan.appendChild(renderRowBlock(row, rightInfo.name, realIdx, w.right.length, 'right', rightInfo.tag, true));
      });

      const aisle = document.createElement('div');
      aisle.className = 'aisle-bar';
      let doorHtml = '';
      if(w.aisleDoor === 'left') doorHtml = `<span class="aisle-door aisle-door-left" title="Deur">${doorIconSvg(16)}</span>`;
      if(w.aisleDoor === 'right') doorHtml = `<span class="aisle-door aisle-door-right" title="Deur">${doorIconSvg(16)}</span>`;
      aisle.innerHTML = `${doorHtml}<span class="aisle-label">PAD</span>`;
      plan.appendChild(aisle);

      // left side, row 1 nearest the aisle first
      w.left.forEach((row, i) => {
        plan.appendChild(renderRowBlock(row, leftInfo.name, i, w.left.length, 'left', leftInfo.tag, true));
      });
    } else {
      // outdoor / single-row layout — no aisle, no left/right split
      w.left.forEach((row, i) => {
        plan.appendChild(renderRowBlock(row, 'Rij', i, w.left.length, 'left', '', false));
      });
    }

    scroller.appendChild(plan);
    wrap.appendChild(scroller);
    if(preserveScrollLeft > 0){
      scroller.scrollLeft = preserveScrollLeft;
    }
  }

  function renderRowBlock(row, sideName, idx, sideCount, sideKey, tagPrefix, hasAisle){
    const block = document.createElement('div');
    block.className = 'row-block';

    const head = document.createElement('div');
    head.className = 'row-head';
    let actionsHtml = `<span class="add-spot-wrap"><button class="btn ghost small" data-add-spot="${row.id}">+ Plek toevoegen</button></span>`;
    if(idx === sideCount - 1){
      // controls live on the outermost (back) row
      if(sideCount > 1){
        actionsHtml += `<button class="side-toggle" data-remove-row="${sideKey}">− verwijder rij ${idx+1} (verwijdert de plekken erin)</button>`;
      } else {
        actionsHtml += `<button class="side-toggle" data-add-row="${sideKey}">+ nog een rij toevoegen</button>`;
      }
    }
    const activeCount = row.spots.filter(s => !s.removed).length;
    const removedCount = row.spots.length - activeCount;
    const countLabel = `${activeCount} bay${activeCount===1?'':'s'}` + (removedCount ? ` · ${removedCount} removed` : '');
    head.innerHTML = `
      <span class="row-tag">${rowLabel(sideName, idx, hasAisle)}</span>
      <span style="font-size:10.5px;color:var(--ink-faint);font-family:var(--font-display)">${countLabel}</span>
      <div class="row-actions">${actionsHtml}</div>
    `;
    block.appendChild(head);

    const lane = document.createElement('div');
    lane.className = 'lane';
    row.spots.forEach((spot, sIdx) => {
      lane.appendChild(renderSpot(row, spot, sideName, idx, sIdx, tagPrefix));
    });
    lane.appendChild(renderAddSpotControl(row));
    block.appendChild(lane);

    return block;
  }

  // A physical side of the aisle (the 'left' screen column / the 'right'
  // screen column — i.e. which of w.left / w.right an array lives in)
  // maps to a display name and tag-prefix letter. Normally left→Links/L
  // and right→Rechts/R, but a warehouse can have that flipped via
  // w.labelsSwapped, for when the real-world links/rechts turned out to
  // be the other way round from how the two columns happen to render on
  // screen. This only changes labels/tags/search/print text — it never
  // moves any row, spot, or customer between the two columns.
  function sideLabelInfo(w, sideKey){
    const swapped = !!(w && w.labelsSwapped);
    if(sideKey === 'left') return swapped ? { name:'Rechts', tag:'R' } : { name:'Links', tag:'L' };
    return swapped ? { name:'Links', tag:'L' } : { name:'Rechts', tag:'R' };
  }
  // The [[sideKey, tagPrefix], ...] list used throughout search/list/print
  // code to iterate both sides of a warehouse with the right tag letter.
  function warehouseSides(w){
    if(w.layout === 'single') return [['left','']];
    return [['left', sideLabelInfo(w,'left').tag], ['right', sideLabelInfo(w,'right').tag]];
  }

  function autoTag(tagPrefix, seq){
    return `${tagPrefix}${seq}`;
  }
  // A spot with a custom label (typed into the "Plek label" field — e.g.
  // "L2-1"/"L2-2" for a bay someone split in two) doesn't recompute
  // automatically the way the plain auto-generated "L2"/"R2" tag does,
  // since it's just free text. Swapping links/rechts should still fix it
  // up when it clearly follows the tag: rewrite the leading letter only
  // when the label starts with exactly the OLD prefix followed by a digit
  // or dash, so unrelated custom text (a name, a note) is left untouched.
  function relabelCustomSpotLabel(label, oldTag, newTag){
    const trimmed = (label || '').trim();
    if(!trimmed || !oldTag || oldTag === newTag) return label;
    if(trimmed.startsWith(oldTag) && /^[0-9-]/.test(trimmed.slice(oldTag.length))){
      return newTag + trimmed.slice(oldTag.length);
    }
    return label;
  }
  function displayTag(spot, tagPrefix){
    return (spot.label && spot.label.trim()) ? spot.label.trim() : autoTag(tagPrefix, spot.seq);
  }

  // Finds whether any occupant of this spot also currently holds a bay in
  // ANY other warehouse (matched by objectNummer) — e.g. a customer who
  // moves from Buiten Boven to Buiten Beneden for winter, or from an
  // outdoor bay into a Winter warehouse's aisle. Returns the first match
  // found (warehouse + bay tag), or null if there isn't one, so the badge
  // can show exactly where the customer's other spot is.
  // Loose "is this plausibly the same person" check — handles the natural
  // variation real records have for the same customer (nicknames, only a
  // surname the second time, "Ronald en Greet" vs "Ronald/Greet", etc.)
  // without needing an exact match. Dutch connector words and very short
  // fragments are ignored so they don't cause false matches on their own.
  function namesLikelyMatch(a, b){
    const stopWords = new Set(['en','de','van','vd','v','der','den','het','tot','een']);
    const words = (s) => (s || '').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, ' ').split(/\s+/)
      .filter(w => w.length >= 3 && !stopWords.has(w));
    const wordsA = words(a), wordsB = words(b);
    if(wordsA.length === 0 || wordsB.length === 0) return false;
    return wordsA.some(w => wordsB.includes(w));
  }

  // Checks whether an object nummer is already used elsewhere in a way that
  // should be BLOCKED as a likely mistake. The same object nummer under the
  // same (or plausibly the same) customer name is the normal, intended way
  // to show a customer has a different bay for another season — that's
  // never blocked. It's only blocked when the SAME object nummer turns up
  // under a clearly DIFFERENT name, which is almost certainly a typo.
  // excludeSpotId leaves the bay currently being edited out of the check,
  // since its own pre-save values are about to be overwritten anyway.
  function findBlockingDuplicateObjectNummer(objectNummer, name, kind, excludeSpotId){
    const q = (objectNummer || '').trim().toLowerCase();
    if(!q) return null;
    for(const w of state.warehouses){
      const hasAisle = w.layout !== 'single';
      const sides = hasAisle ? ['left','right'] : ['left'];
      for(const key of sides){
        for(const row of w[key]){
          for(const s of row.spots){
            if(s.removed || s.isDoor || s.id === excludeSpotId) continue;
            if(kind === 'occupant'){
              for(const o of (s.occupants || [])){
                if((o.objectNummer || '').trim().toLowerCase() === q && !namesLikelyMatch(name, o.name)){
                  return { warehouse: w, spot: s, otherName: o.name };
                }
              }
            } else {
              if(s.winterKlant && (s.winterKlant.objectNummer || '').trim().toLowerCase() === q && !namesLikelyMatch(name, s.winterKlant.name)){
                return { warehouse: w, spot: s, otherName: s.winterKlant.name };
              }
            }
          }
        }
      }
    }
    return null;
  }

  function findOccupantElsewhere(spot, excludeWarehouseId){
    const objNums = (spot.occupants || []).map(o => (o.objectNummer || '').trim().toLowerCase()).filter(Boolean);
    if(spot.winterKlant && spot.winterKlant.objectNummer){
      objNums.push(spot.winterKlant.objectNummer.trim().toLowerCase());
    }
    if(objNums.length === 0) return null;
    for(const w of state.warehouses){
      if(w.id === excludeWarehouseId) continue;
      const hasAisle = w.layout !== 'single';
      const sides = warehouseSides(w);
      for(const [key, tagPrefix] of sides){
        for(const row of w[key]){
          for(const s of row.spots){
            if(s.removed || s.isDoor) continue;
            for(const o of (s.occupants || [])){
              if(objNums.includes((o.objectNummer || '').trim().toLowerCase())){
                return { warehouse: w, spot: s, tag: displayTag(s, tagPrefix) };
              }
            }
            if(s.winterKlant && s.winterKlant.objectNummer && objNums.includes(s.winterKlant.objectNummer.trim().toLowerCase())){
              return { warehouse: w, spot: s, tag: displayTag(s, tagPrefix) };
            }
          }
        }
      }
    }
    return null;
  }

  function renderSpot(row, spot, sideName, rowIdx, sIdx, tagPrefix){
    const el = document.createElement('div');
    const w = widthFor(spot.length);
    el.style.width = w + 'px';
    el.setAttribute('data-spot-id', spot.id);
    const tag = displayTag(spot, tagPrefix);

    if(spot.removed){
      el.className = 'spot gap';
      el.title = 'Verwijderde plek — klik om opnieuw te gebruiken';
      el.innerHTML = `
        <div class="spot-del" data-hard-remove="${spot.id}" title="Deze plek permanent verwijderen">✕</div>
        <span class="spot-id" style="align-self:flex-start">${escapeHtml(tag)}</span>
        <span class="gap-label">verwijderd<br/>tik om te hergebruiken</span>
      `;
      el.addEventListener('click', (e) => {
        if(e.target.closest('[data-hard-remove]')) return;
        spot.removed = false;
        render(); save();
      });
      return el;
    }

    if(spot.isDoor){
      el.className = 'spot door';
      el.title = 'Deur — klik om te bewerken';
      el.innerHTML = `
        <div class="spot-del" data-remove-spot="${spot.id}" title="Plek verwijderen">✕</div>
        <span class="spot-id" style="align-self:flex-start">${escapeHtml(tag)}</span>
        <span class="door-label">${doorIconSvg(20)}<br/>${escapeHtml(spot.label && spot.label.trim() ? spot.label.trim() : 'door')}</span>
      `;
      el.addEventListener('click', (e) => {
        if(e.target.closest('[data-remove-spot]')) return;
        openSpotModal(row, spot, sideName, rowIdx, sIdx, tagPrefix);
      });
      return el;
    }

    const wk = spot.winterKlant;
    const wkLabel = wk && (wk.name || wk.objectNummer) ? (wk.name || wk.objectNummer) : null;
    const wkTitle = wk ? `Winterklant: ${wk.name || '(geen naam)'}${wk.objectNummer ? ' · object ' + wk.objectNummer : ''}${wk.price ? ' · € ' + wk.price : ''}${wk.name || wk.objectNummer ? (wk.betaald ? ' · betaald' : ' · nog niet betaald') : ''}` : '';
    const wkBadge = wkLabel ? `<div class="winterklant-badge" title="${escapeAttr(wkTitle)}">❄ ${escapeHtml(wkLabel)}</div>` : '';

    if(spot.occupants && spot.occupants.length > 0){
      const t = TYPES[spot.type] || { color:'#7A7A7A', label:'Onbekend' };
      const longStay = spot.occupants.some(o => isLongStay(o.since));
      const anyAway = spot.occupants.some(o => o.away);
      const elsewhere = findOccupantElsewhere(spot, state.activeWarehouseId);
      el.className = 'spot' + (longStay ? ' long-stay' : '') + (anyAway ? ' is-away' : '');
      el.style.background = hexAlpha(t.color, 0.16);
      el.style.borderColor = t.color;
      const multi = spot.occupants.length > 1;
      const primary = multi ? `${spot.occupants.length}× ${t.label}` : (spot.occupants[0].name || 'Naam onbekend');
      const single = spot.occupants[0];
      const sub = multi
        ? spot.occupants.map(o => o.name || 'Naam onbekend').join(', ')
        : [single.reg, single.since].filter(Boolean).join(' · ');
      el.innerHTML = `
        <div class="spot-del" data-clear="${spot.id}" title="Plek leegmaken">✕</div>
        ${longStay ? `<div class="long-stay-badge" title="Langer dan een jaar gestald">⏱</div>` : ''}
        ${anyAway ? `<div class="away-badge" title="Momenteel weg — tijdelijk opgehaald">WEG</div>` : ''}
        ${elsewhere ? `<div class="winter-badge" title="Heeft ook een plek in ${escapeAttr(elsewhere.warehouse.name)}, plek ${escapeAttr(elsewhere.tag)}">❄️</div>` : ''}
        <div class="spot-id">${escapeHtml(tag)}</div>
        <div>
          <div class="spot-label">${escapeHtml(primary)}</div>
          <div class="spot-sub">${escapeHtml(sub)}</div>
        </div>
        <div class="spot-dim">${spot.length}m</div>
        ${wkBadge}
      `;
    } else {
      el.className = 'spot empty';
      el.innerHTML = `
        <div class="spot-del" data-remove-spot="${spot.id}" title="Plek verwijderen">✕</div>
        <span class="plus">+</span>
        ${spot.label ? `<div class="spot-id" style="align-self:flex-start">${escapeHtml(spot.label)}</div>` : ''}
        ${wkBadge}
      `;
    }
    el.addEventListener('click', (e) => {
      if(e.target.closest('[data-clear]') || e.target.closest('[data-remove-spot]')) return;
      if(dragJustHappened){ dragJustHappened = false; return; }
      openSpotModal(row, spot, sideName, rowIdx, sIdx, tagPrefix);
    });
    attachDragToSwap(el, spot.id);
    return el;
  }

  // ---------- press-and-hold drag to swap two bays' contents ----------
  // A quick swipe still scrolls the row normally; only a held-then-moved
  // touch/click picks a bay up, so the two gestures don't fight each other.
  let dragState = null;
  let dragJustHappened = false; // suppresses the click that follows a drag release

  function findSpotById(id){
    for(const w of state.warehouses){
      for(const r of warehouseRows(w)){
        const s = r.spots.find(sp => sp.id === id);
        if(s) return s;
      }
    }
    return null;
  }

  function swapSpotContents(idA, idB){
    const a = findSpotById(idA), b = findSpotById(idB);
    if(!a || !b || a.removed || b.removed || a.isDoor || b.isDoor) return;
    // Only what's PARKED there moves — the bay's own name/number (label, seq)
    // stays put, since that's the physical bay's identity, not the vehicle's.
    const fields = ['type','length','occupants'];
    const tmp = {};
    fields.forEach(f => tmp[f] = a[f]);
    fields.forEach(f => a[f] = b[f]);
    fields.forEach(f => b[f] = tmp[f]);
  }

  function attachDragToSwap(el, spotId){
    el.addEventListener('pointerdown', (e) => {
      if(e.target.closest('.spot-del')) return;
      if(e.pointerType === 'mouse' && e.button !== 0) return;
      // Belt-and-braces alongside the CSS: tell the browser up front not to
      // start its own touch gesture (text selection, callout) for this
      // touch at all, rather than relying only on user-select/touch-action.
      // Touch only — desktop mouse users don't have this problem.
      if(e.pointerType === 'touch') e.preventDefault();
      const startX = e.clientX, startY = e.clientY;
      const pointerId = e.pointerId;
      let cancelled = false;

      const cancelIfMoved = (ev) => {
        if(Math.hypot(ev.clientX - startX, ev.clientY - startY) > 10){
          cancelled = true;
          clearTimeout(timer);
          el.removeEventListener('pointermove', cancelIfMoved);
          el.removeEventListener('pointerup', cancelEarly);
        }
      };
      const cancelEarly = () => {
        cancelled = true;
        clearTimeout(timer);
        el.removeEventListener('pointermove', cancelIfMoved);
        el.removeEventListener('pointerup', cancelEarly);
      };
      el.addEventListener('pointermove', cancelIfMoved);
      el.addEventListener('pointerup', cancelEarly);

      const timer = setTimeout(() => {
        el.removeEventListener('pointermove', cancelIfMoved);
        el.removeEventListener('pointerup', cancelEarly);
        if(cancelled) return;
        startDrag(el, spotId, pointerId, startX, startY);
      }, 450);
    });
  }

  function startDrag(sourceEl, spotId, pointerId, startX, startY){
    try{ sourceEl.setPointerCapture(pointerId); }catch(e){}
    sourceEl.classList.add('dragging');
    // Fully take over touch handling for the duration of the drag — the
    // CSS touch-action:pan-x is only meant for quick swipes before a drag
    // has started; once we're actually dragging, no default gesture
    // (panning in any direction) should be allowed to compete with it.
    // We replace that native panning with our own edge auto-scroll below,
    // so dragging toward the edge of the screen still reaches bays that
    // are currently off-screen.
    const prevTouchAction = sourceEl.style.touchAction;
    sourceEl.style.touchAction = 'none';

    const rect = sourceEl.getBoundingClientRect();
    const ghost = sourceEl.cloneNode(true);
    ghost.className = 'spot drag-ghost';
    ghost.style.width = rect.width + 'px';
    ghost.style.height = rect.height + 'px';
    ghost.style.left = rect.left + 'px';
    ghost.style.top = rect.top + 'px';
    ghost.querySelectorAll('.spot-del').forEach(n => n.remove());
    document.body.appendChild(ghost);

    let currentTarget = null;
    let curX = startX, curY = startY;
    const scrollContainer = sourceEl.closest('.plan-scroll');
    const EDGE_ZONE = 46;      // px from the screen edge that triggers scrolling
    const MAX_SCROLL_SPEED = 16; // px per frame at the very edge
    let scrolling = true;

    function updateGhostPosition(){
      const dx = curX - startX, dy = curY - startY;
      ghost.style.transform = `translate(${dx}px, ${dy}px) scale(1.06)`;
    }

    function updateDropTarget(){
      ghost.style.display = 'none';
      const under = document.elementFromPoint(curX, curY);
      ghost.style.display = '';
      const targetEl = under ? under.closest('.spot:not(.gap):not(.door)') : null;

      if(targetEl !== currentTarget){
        if(currentTarget) currentTarget.classList.remove('drop-target');
        if(targetEl && targetEl !== sourceEl) targetEl.classList.add('drop-target');
        currentTarget = (targetEl && targetEl !== sourceEl) ? targetEl : null;
      }
    }

    function autoScrollStep(){
      if(!scrolling) return;
      if(scrollContainer){
        const r = scrollContainer.getBoundingClientRect();
        let dx = 0;
        if(curX < r.left + EDGE_ZONE){
          dx = -MAX_SCROLL_SPEED * Math.min(1, (r.left + EDGE_ZONE - curX) / EDGE_ZONE);
        } else if(curX > r.right - EDGE_ZONE){
          dx = MAX_SCROLL_SPEED * Math.min(1, (curX - (r.right - EDGE_ZONE)) / EDGE_ZONE);
        }
        if(dx !== 0){
          scrollContainer.scrollLeft += dx;
          // Content shifts under a finger that may not be moving right now
          // (it's just sitting in the edge zone) — re-check what's under it.
          updateDropTarget();
        }
      }
      requestAnimationFrame(autoScrollStep);
    }
    requestAnimationFrame(autoScrollStep);

    function onMove(e){
      e.preventDefault();
      curX = e.clientX; curY = e.clientY;
      updateGhostPosition();
      updateDropTarget();
    }

    function cleanup(){
      scrolling = false;
      sourceEl.removeEventListener('pointermove', onMove);
      sourceEl.removeEventListener('pointerup', onUp);
      sourceEl.removeEventListener('pointercancel', onCancel);
      sourceEl.classList.remove('dragging');
      sourceEl.style.touchAction = prevTouchAction;
      if(currentTarget) currentTarget.classList.remove('drop-target');
      ghost.remove();
    }

    function onUp(e){
      const target = currentTarget;
      cleanup();
      if(target){
        const targetId = target.getAttribute('data-spot-id');
        swapSpotContents(spotId, targetId);
        dragJustHappened = true;
        setTimeout(() => { dragJustHappened = false; }, 300);
        render(); save();
      }
    }

    function onCancel(){
      cleanup();
    }

    sourceEl.addEventListener('pointermove', onMove, { passive: false });
    sourceEl.addEventListener('pointerup', onUp, { passive: false });
    sourceEl.addEventListener('pointercancel', onCancel, { passive: false });
  }

  function renderAddSpotControl(row){
    const wrap = document.createElement('div');
    wrap.className = 'add-spot-wrap';
    wrap.innerHTML = `<button class="add-spot-btn" data-add-spot="${row.id}">+</button>`;
    return wrap;
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s){ return escapeHtml(s); }

  function doorIconSvg(size){
    return `<svg viewBox="0 0 16 16" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.3" style="display:inline-block;vertical-align:middle;flex-shrink:0;">
      <rect x="3" y="1.3" width="10" height="13.4" rx="0.6"/>
      <circle cx="10.3" cy="8" r="0.85" fill="currentColor" stroke="none"/>
    </svg>`;
  }

  function typeOrderFor(w){
    const keys = Object.keys(TYPES);
    if(!w.recommended) return keys;
    return [...w.recommended, ...keys.filter(k => !w.recommended.includes(k))];
  }

  // ---------- modal: add spot type + quantity picker ----------
  function openAddBayModal(rowId){
    const overlay = document.getElementById('overlay');
    const body = document.getElementById('modalBody');
    body.className = 'modal';
    const w = activeWarehouse();
    const order = typeOrderFor(w);
    const row = findRow(rowId);
    let selectedType = row.spots.length ? row.spots[row.spots.length - 1].type : order[0];

    body.innerHTML = `
      <h3>Plek(ken) toevoegen</h3>
      <div class="sub">Voeg één of meer lege plekken toe aan deze rij — wijs later eigenaren toe.</div>
      <div class="field">
        <label>Type</label>
        <div class="type-row" id="quickTypeRow">
          ${order.map(key => {
            const t = TYPES[key];
            const active = key===selectedType;
            const styleAttr = active ? ` style="border-color:${t.color};background:${hexAlpha(t.color,0.14)};color:${t.color}"` : '';
            return `<div class="type-chip ${active?'active':''}" data-qtype="${key}"${styleAttr}>${escapeHtml(t.label)}</div>`;
          }).join('')}
        </div>
      </div>
      <div class="field">
        <label>Aantal</label>
        <input type="number" id="quickQty" min="1" max="20" value="1" />
      </div>

        <button class="btn" id="quickAddBtn">Toevoegen</button>
      </div>
    `;

    body.querySelectorAll('[data-qtype]').forEach(chip => {
      chip.addEventListener('click', () => {
        selectedType = chip.getAttribute('data-qtype');
        body.querySelectorAll('[data-qtype]').forEach(c => {
          c.classList.remove('active');
          c.style.borderColor = ''; c.style.background = ''; c.style.color = '';
        });

        chip.style.background = hexAlpha(t.color, 0.14);
        chip.style.color = t.color;
      });
    });

    overlay.classList.add('show');
    document.getElementById('quickCancelBtn').addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); }, { once:true });

    document.getElementById('quickAddBtn').addEventListener('click', () => {
      const qtyInput = document.getElementById('quickQty');

      const targetRow = findRow(rowId);
      for(let i = 0; i < qty; i++) targetRow.spots.push(spotDefault(selectedType, nextSeqFor(targetRow)));
      closeModal();
      render(); save();
    });
  }

  // ---------- modal: assign / edit occupants, or mark as a door ----------
  function openSpotModal(row, spot, sideName, rowIdx, sIdx, tagPrefix, prefillOccupant){

    const order = typeOrderFor(w);
    const auto = autoTag(tagPrefix, spot.seq);

    let occDraft = (spot.occupants && spot.occupants.length)
      ? spot.occupants.map(o => ({ name:o.name||'', reg:o.reg||'', since:o.since||'', notes:o.notes||'', away:!!o.away, komtDitJaar:!!o.komtDitJaar, objectNummer:o.objectNummer||'', email:o.email||'', phone:o.phone||'', _wasAway:!!o.away }))
      : [{ name:'', reg:'', since:'', notes:'', away:false, komtDitJaar:false, objectNummer:'', email:'', phone:'', _wasAway:false, ...(prefillOccupant || {}) }];

    body.innerHTML = `
      <h3>${isEditing ? 'Plek bewerken' : 'Plek toevoegen / bewerken'}</h3>
      <div class="sub">Het type bepaalt de afmeting op de plattegrond.</div>
