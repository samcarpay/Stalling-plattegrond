<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Storage Sites — Yard Plan</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1B2A4A" />

<!-- iOS: lets "Add to Home Screen" launch full-screen with no browser chrome -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Storage Sites" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />

<!-- Android / general -->
<meta name="mobile-web-app-capable" content="yes" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />

<style>
  :root{
    --paper: #F6F3EA;
    --paper-line: #DAD3BE;
    --ink: #1B2A4A;
    --ink-soft: #5B6580;
    --ink-faint: #97A0B5;
    --card: #FFFEFA;
    --line: #C9C2AC;

    --car: #B54834;
    --car-soft: #F1DAD2;
    --camper: #2E6E62;
    --camper-soft: #D7E6E1;
    --caravan: #47598C;
    --caravan-soft: #DDE1EE;
    --trailer: #B4831F;
    --trailer-soft: #F0E3C9;
    --folding: #6E5B8C;
    --folding-soft: #E1DCEA;

    --radius: 3px;
    --font-display: ui-monospace, 'SFMono-Regular', 'Menlo', 'Consolas', 'Liberation Mono', monospace;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  *{box-sizing:border-box;}
  html{background:var(--paper);}
  body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);overscroll-behavior-x:none;}

  .sheet{
    background:
      repeating-linear-gradient(0deg, transparent, transparent 27px, var(--paper-line) 27px, var(--paper-line) 28px),
      repeating-linear-gradient(90deg, transparent, transparent 27px, var(--paper-line) 27px, var(--paper-line) 28px),
      var(--paper);
    border:1px solid var(--line);
    border-radius:6px;
    padding:28px 28px 36px;
    min-height:400px;
  }

  /* ---------- pin gate ---------- */
  .pin-gate{
    position:fixed;inset:0;z-index:1000;
    background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .pin-card{
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:32px 28px;width:280px;max-width:100%;text-align:center;
    box-shadow:0 20px 50px rgba(27,42,74,.15);
  }
  .pin-eyebrow{
    font-family:var(--font-display);font-size:10.5px;letter-spacing:.14em;
    color:var(--ink-soft);text-transform:uppercase;margin-bottom:6px;
  }
  .pin-card h1{
    font-family:var(--font-display);font-size:19px;color:var(--ink);margin:0 0 18px;
  }
  .pin-input{
    width:100%;box-sizing:border-box;padding:12px;border:1.5px solid var(--line);border-radius:var(--radius);
    font-family:var(--font-display);font-size:22px;letter-spacing:.3em;text-align:center;
    color:var(--ink);background:var(--paper);outline:none;
  }
  .pin-input:focus{border-color:var(--ink);}
  .pin-error{color:var(--car);font-size:12px;margin-top:10px;}

  /* ---------- header ---------- */
  .titleblock{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:18px;
    gap:20px;
    flex-wrap:wrap;
  }
  .titleblock-left{flex:1;min-width:220px;}
  .eyebrow{
    font-family:var(--font-display);
    font-size:11px;
    letter-spacing:.14em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin-bottom:4px;
  }
  #facilityName{
    font-family:var(--font-display);
    font-weight:700;
    font-size:26px;
    color:var(--ink);
    border:none;
    background:transparent;
    outline:none;
    padding:2px 4px;
    margin-left:-4px;
    border-radius:var(--radius);
    max-width:100%;
  }
  #facilityName:focus{background:var(--card);box-shadow:0 0 0 1px var(--line);}
  .scale-note{font-size:12px;color:var(--ink-faint);margin-top:4px;font-family:var(--font-display);}

  .stats{display:flex;gap:10px;flex-wrap:wrap;}
  .stat{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:8px 14px;
    text-align:center;
    min-width:64px;
  }
  .stat .n{font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1;}
  .stat .l{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin-top:4px;}

  /* ---------- warehouse tabs ---------- */
  .wh-tabs{
    display:flex;
    gap:6px;
    align-items:center;
    margin-bottom:6px;
    overflow-x:auto;
    padding-bottom:4px;
  }
  .wh-tabs::-webkit-scrollbar{height:6px;}
  .wh-tabs::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .wh-tab{
    position:relative;
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px 10px 7px 12px;
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    background:var(--card);
    cursor:pointer;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
  }
  .wh-tab:hover{border-color:var(--ink-faint);color:var(--ink);}
  .wh-tab.active{border-color:var(--ink);background:var(--ink);color:var(--paper);}
  .wh-tab .wh-count{
    font-family:var(--font-display);font-size:10px;font-weight:600;
    padding:1px 5px;border-radius:8px;background:rgba(0,0,0,.08);
  }
  .wh-tab.active .wh-count{background:rgba(255,255,255,.18);}
  .wh-tab-name-text{
    max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .wh-tab-edit{
    display:none;
    width:15px;height:15px;border-radius:50%;
    align-items:center;justify-content:center;
    background:rgba(0,0,0,.12);
    font-size:9px;line-height:1;flex-shrink:0;
    cursor:pointer;
  }
  .wh-tab:hover .wh-tab-edit{display:flex;}
  .wh-tab-del{
    display:none;
    width:15px;height:15px;border-radius:50%;
    align-items:center;justify-content:center;
    background:rgba(0,0,0,.12);
    font-size:9px;line-height:1;flex-shrink:0;
  }
  .wh-tab:hover .wh-tab-del{display:flex;}
  .wh-tab-add{
    flex-shrink:0;
    padding:7px 12px;
    border:1.5px dashed var(--ink-faint);
    border-radius:var(--radius);
    background:transparent;
    color:var(--ink-faint);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    font-family:var(--font-display);
  }
  .wh-tab-add:hover{color:var(--ink);border-color:var(--ink);}

  .global-stat-line{
    font-size:11.5px;color:var(--ink-soft);margin:2px 0 18px;font-family:var(--font-display);
  }

  .wh-purpose{
    font-size:12.5px;color:var(--ink-soft);margin:-6px 0 18px;
  }
  .wh-purpose b{color:var(--ink);}

  /* ---------- search ---------- */
  .search-wrap{position:relative;margin-bottom:16px;}
  #searchInput{
    width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--radius);
    font-family:var(--font-body);font-size:13.5px;color:var(--ink);background:var(--card);
    outline:none;
  }
  #searchInput:focus{border-color:var(--ink);}
  .search-filters{
    display:flex;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap;
  }
  .search-filters select{
    padding:5px 8px;border:1px solid var(--line);border-radius:var(--radius);
    font-family:var(--font-body);font-size:11.5px;color:var(--ink-soft);background:var(--card);outline:none;
  }
  .search-filters select:focus{border-color:var(--ink);}
  .search-free-toggle{
    display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-soft);cursor:pointer;
  }
  .search-free-toggle input{width:13px;height:13px;cursor:pointer;}
  .search-results{
    display:none;
    position:absolute;top:100%;left:0;right:0;margin-top:6px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 10px 26px rgba(27,42,74,.18);
    max-height:280px;overflow-y:auto;z-index:30;
  }
  .search-results.show{display:block;}
  .search-result{
    display:flex;align-items:center;gap:10px;
    padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--paper-line);
  }
  .search-result:last-child{border-bottom:none;}
  .search-result:hover{background:var(--paper);}
  .search-result .dot{flex-shrink:0;}
  .search-result-main{flex:1;min-width:0;}
  .search-result-name{font-size:13px;font-weight:600;color:var(--ink);}
  .search-result-meta{font-size:11px;color:var(--ink-soft);}
  .search-empty{padding:14px 12px;font-size:12.5px;color:var(--ink-faint);text-align:center;}

  @keyframes bayPulse{
    0%{box-shadow:0 0 0 0 rgba(27,42,74,.55);}
    70%{box-shadow:0 0 0 10px rgba(27,42,74,0);}
    100%{box-shadow:0 0 0 0 rgba(27,42,74,0);}
  }
  .spot.jump-highlight{animation:bayPulse 1s ease-out 2;}

  /* ---------- legend ---------- */
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);}
  .swatch{width:12px;height:12px;border-radius:2px;flex-shrink:0;}

  /* ---------- overview page ---------- */
  .overview{display:flex;flex-direction:column;gap:26px;}
  .overview-section{max-width:520px;}
  .overview-h{
    font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--ink);
    margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em;
  }
  .overview-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .overview-table th{
    text-align:left;font-family:var(--font-display);font-size:10.5px;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.04em;padding:8px 12px;border-bottom:1.5px solid var(--ink);
  }
  .overview-table td{padding:8px 12px;font-size:13px;color:var(--ink);border-bottom:1px solid var(--paper-line);}
  .overview-table td .dot{margin-right:7px;vertical-align:middle;}
  .overview-table tbody tr:last-child td{border-bottom:1px solid var(--paper-line);}
  .overview-table tfoot td{
    font-weight:700;font-family:var(--font-display);font-size:12.5px;
    border-top:1.5px solid var(--ink);border-bottom:none;background:var(--paper);
  }
  .overview-table td.ov-free{color:var(--camper);font-weight:700;}
  .overview-table tbody tr.ov-row{cursor:pointer;}
  .overview-table tbody tr.ov-row:hover{background:var(--paper);}
  .ov-door-note{font-size:11px;color:var(--ink-faint);}

  /* ---------- warehouse plan ---------- */
  /* single shared horizontal scroller so every row (and both sides) move together */
  .plan-scroll{overflow-x:auto;padding-bottom:6px;}
  .plan-scroll::-webkit-scrollbar{height:8px;}
  .plan-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .plan{display:flex;flex-direction:column;width:max-content;min-width:100%;}

  .side-block{display:flex;flex-direction:column;}
  .row-block{margin-bottom:8px;}
  .row-head{
    display:flex;align-items:center;gap:8px;margin-bottom:6px;
    position:sticky;left:0;width:fit-content;
  }
  .row-tag{
    font-family:var(--font-display);
    font-size:10.5px;font-weight:700;color:var(--ink-soft);
    letter-spacing:.04em;text-transform:uppercase;
  }
  .row-actions{margin-left:auto;display:flex;gap:6px;}

  .lane{
    position:relative;
    display:flex;
    align-items:flex-end;
    gap:9px;
    padding:14px 10px 10px;
    background:repeating-linear-gradient(90deg, var(--ink-faint) 0 10px, transparent 10px 20px);
    background-size:100% 2px;
    background-repeat:no-repeat;
    background-position:top;
    min-height:106px;
  }

  .aisle-bar{
    display:flex;align-items:center;justify-content:center;gap:10px;
    margin:6px 0;
    padding:9px 0;
    background:repeating-linear-gradient(90deg, var(--ink) 0 16px, transparent 16px 30px);
    background-size:100% 2px;
    background-position:center;
    background-repeat:no-repeat;
    position:relative;
  }
  .aisle-label{
    background:var(--paper);
    border:1.5px solid var(--ink);
    color:var(--ink);
    font-family:var(--font-display);
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.1em;
    padding:3px 12px;
    border-radius:2px;
    z-index:1;
  }
  .aisle-door{
    position:absolute; top:50%; transform:translateY(-50%);
    font-size:18px; z-index:1;
    background:var(--paper); border:1.5px solid var(--ink); border-radius:2px;
    padding:2px 6px; line-height:1;
  }
  .aisle-door-left{ left:14px; }
  .aisle-door-right{ right:14px; }

  .side-toggle{
    font-size:10.5px;color:var(--ink-faint);background:transparent;border:1px dashed var(--line);
    border-radius:var(--radius);padding:2px 7px;cursor:pointer;font-family:var(--font-display);
  }
  .side-toggle:hover{color:var(--ink);border-color:var(--ink-faint);}

  .spot{
    flex-shrink:0;
    border-radius:var(--radius);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:8px 8px 6px;
    height:88px;
    transition:transform .12s ease, box-shadow .12s ease;
    border:1.5px solid var(--ink);
    position:relative;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    touch-action:pan-x;
  }
  .spot:hover{transform:translateY(-2px);box-shadow:0 3px 8px rgba(27,42,74,.18);}

  .spot.empty{
    background:repeating-linear-gradient(135deg, transparent 0 6px, var(--paper-line) 6px 7px);
    border-style:dashed;
    border-color:var(--ink-faint);
    align-items:center;
    justify-content:center;
  }
  .spot.empty .plus{font-size:20px;color:var(--ink-faint);font-family:var(--font-display);}

  .spot.gap{
    background:repeating-linear-gradient(45deg, transparent 0 5px, var(--paper-line) 5px 6px);
    border-style:dotted;
    border-color:var(--ink-faint);
    opacity:.6;
    align-items:center;
    justify-content:center;
  }
  .spot.gap:hover{opacity:.85;}

  .spot.door{
    background:repeating-linear-gradient(90deg, var(--ink) 0 8px, transparent 8px 16px);
    background-color:var(--paper);
    border-style:solid;
    border-color:var(--ink);
    align-items:center;
    justify-content:center;
  }
  .door-label{
    font-size:10px;color:var(--ink);text-align:center;line-height:1.5;
    font-family:var(--font-display);text-transform:uppercase;letter-spacing:.03em;
    background:var(--paper);padding:2px 4px;border-radius:2px;
  }

  .spot.dragging{ opacity:.35; }
  .spot.drop-target{ outline:3px solid var(--ink); outline-offset:2px; }
  .drag-ghost{
    position:fixed; pointer-events:none; z-index:500;
    opacity:.95; transform:scale(1.06);
    box-shadow:0 14px 30px rgba(27,42,74,.4);
    border-radius:var(--radius);
  }
  .gap-label{
    font-size:9.5px;color:var(--ink-faint);text-align:center;line-height:1.3;
    font-family:var(--font-display);text-transform:uppercase;letter-spacing:.03em;
  }

  .spot-id{font-family:var(--font-display);font-size:10px;color:var(--ink-soft);}
  .spot-label{font-family:var(--font-body);font-weight:600;font-size:12.5px;color:var(--ink);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .spot-sub{font-size:10.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .spot-dim{font-family:var(--font-display);font-size:9.5px;color:var(--ink-faint);align-self:flex-end;}

  .spot-del{
    position:absolute;top:-8px;right:-8px;
    width:18px;height:18px;border-radius:50%;
    background:var(--card);border:1px solid var(--line);
    color:var(--ink-soft);font-size:11px;line-height:1;
    display:none;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .spot:hover .spot-del{display:flex;}

  .spot.long-stay{border-left-width:4px;border-left-color:var(--trailer);}
  .long-stay-badge{
    position:absolute;top:-7px;left:-7px;
    width:16px;height:16px;border-radius:50%;
    background:var(--trailer);color:var(--card);
    font-size:9px;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }

  .add-spot-wrap{position:relative;flex-shrink:0;}
  .add-spot-btn{
    height:88px;width:50px;
    border:1.5px dashed var(--ink-faint);
    background:transparent;
    border-radius:var(--radius);
    color:var(--ink-faint);
    font-size:22px;
    cursor:pointer;
    font-family:var(--font-display);
  }
  .add-spot-btn:hover{color:var(--ink);border-color:var(--ink);}

  .add-menu{
    position:absolute;bottom:100%;left:0;margin-bottom:6px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 6px 18px rgba(27,42,74,.18);
    padding:10px;z-index:20;width:220px;
  }
  .add-menu.below{ bottom:auto; top:100%; margin-bottom:0; margin-top:6px; }
  .add-menu .type-row{margin-bottom:10px;}
  .add-menu .type-chip{font-size:11px;padding:6px 3px;min-width:0;}
  .add-menu-qty{
    display:flex;align-items:center;gap:8px;
    padding-top:8px;border-top:1px dashed var(--line);
  }
  .add-menu-qty label{font-size:11px;color:var(--ink-soft);font-weight:600;}
  .add-menu-qty input{
    width:52px;padding:5px 6px;border:1px solid var(--line);border-radius:var(--radius);
    font-family:var(--font-body);font-size:13px;color:var(--ink);background:var(--paper);outline:none;
  }
  .add-menu-qty input:focus{border-color:var(--ink);}
  .add-menu-qty .btn{margin-left:auto;}
  .add-menu button{
    width:100%;text-align:left;background:transparent;border:none;
    padding:7px 8px;font-size:12.5px;color:var(--ink);cursor:pointer;
    border-radius:2px;display:flex;align-items:center;gap:8px;font-family:var(--font-body);
  }
  .add-menu button:hover{background:var(--paper);}
  .dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}

  /* ---------- buttons ---------- */
  .btn{
    font-family:var(--font-body);
    font-size:12.5px;
    font-weight:600;
    padding:6px 12px;
    border-radius:var(--radius);
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
  }
  .btn:hover{opacity:.88;}
  .btn.ghost{background:transparent;color:var(--ink-soft);border-color:var(--line);}
  .btn.ghost:hover{color:var(--ink);border-color:var(--ink-soft);}
  .btn.small{padding:4px 9px;font-size:11.5px;}
  .btn.danger{background:var(--car);border-color:var(--car);}

  .empty-state{
    text-align:center;padding:50px 20px;color:var(--ink-soft);font-size:13.5px;
  }
  .empty-state b{color:var(--ink);}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(27,42,74,.35);
    display:none;align-items:center;justify-content:center;z-index:100;
    padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--card);border-radius:6px;border:1px solid var(--line);
    width:340px;max-width:100%;padding:20px;
    box-shadow:0 20px 50px rgba(27,42,74,.3);
  }
  .modal h3{margin:0 0 4px;font-family:var(--font-display);font-size:15px;color:var(--ink);}
  .modal .sub{font-size:11.5px;color:var(--ink-soft);margin-bottom:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
  .field input, .field textarea, .field select{
    width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:var(--radius);
    font-family:var(--font-body);font-size:13px;color:var(--ink);background:var(--paper);
    outline:none;
  }
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--ink);}
  .field textarea{resize:vertical;min-height:50px;}
  .modal-actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;}
  .type-row{display:flex;gap:6px;flex-wrap:wrap;}
  .type-chip{
    flex:1;min-width:70px;text-align:center;padding:7px 4px;border-radius:var(--radius);
    border:1.5px solid var(--line);font-size:11.5px;font-weight:600;cursor:pointer;color:var(--ink-soft);
  }
  .type-chip.active{border-color:var(--ink);color:var(--ink);}

  .occ-list{max-height:260px;overflow-y:auto;margin-bottom:8px;}
  .occ-row{
    border:1px solid var(--paper-line);border-radius:var(--radius);

  .occ-row-top{display:flex;gap:5px;align-items:center;margin-bottom:5px;}
  .occ-row input{
    min-width:0;padding:6px 7px;border:1px solid var(--line);border-radius:var(--radius);

  .status-line{font-size:11px;color:var(--ink-faint);text-align:center;margin-top:14px;font-family:var(--font-display);}

  /* ---------- manage types modal ---------- */
  .modal.wide{width:400px;}
  .type-manage-row{
    display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--paper-line);
  }
  .type-manage-row input[type="color"]{
    width:26px;height:26px;padding:0;border:1px solid var(--line);border-radius:4px;cursor:pointer;flex-shrink:0;background:none;
  }
  .type-manage-row .tm-label{
    flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--radius);padding:5px 7px;
    font-family:var(--font-body);font-size:12.5px;color:var(--ink);background:var(--paper);outline:none;
  }
  .type-manage-row .tm-label:focus{border-color:var(--ink);}
  .type-manage-row .tm-length{
    width:50px;border:1px solid var(--line);border-radius:var(--radius);padding:5px 6px;
    font-family:var(--font-body);font-size:12px;color:var(--ink);background:var(--paper);outline:none;flex-shrink:0;
  }
  .type-manage-row .tm-length:focus{border-color:var(--ink);}
  .type-manage-row .tm-usage{font-size:10px;color:var(--ink-faint);width:52px;flex-shrink:0;text-align:right;font-family:var(--font-display);}
  .type-manage-row .tm-del{
    flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:transparent;
    color:var(--ink-soft);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .type-manage-row .tm-del:disabled{opacity:.3;cursor:not-allowed;}
  .type-manage-row .tm-del:not(:disabled):hover{border-color:var(--car);color:var(--car);}
  .add-type-row{
    display:flex;align-items:center;gap:8px;padding-top:12px;margin-top:6px;border-top:1.5px dashed var(--line);
  }
  /* ---------- print ---------- */
  .print-only{display:none;}
  .print-report h1{font-family:var(--font-display);font-size:20px;margin:0 0 2px;}
  .print-report .print-meta{font-size:11px;color:#555;margin-bottom:14px;}
  .print-report .print-summary{display:flex;gap:24px;margin-bottom:18px;font-size:12px;}
  .print-warehouse{margin-bottom:14px;}
  .print-warehouse h2{
    font-family:var(--font-display);font-size:14px;margin:0 0 2px;
    border-bottom:1.5px solid #000;padding-bottom:4px;
  }
  .print-empty{font-size:11px;color:#777;font-style:italic;padding:6px 0;}
  .print-row-label{font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:#555;margin:9px 0 3px;}
  .print-row{display:flex;flex-wrap:wrap;gap:5px;}
  .print-aisle{
    text-align:center;font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    border-top:1px dashed #000;border-bottom:1px dashed #000;padding:5px 0;margin:8px 0;
  }
  .print-bay-box{
    width:96px;min-height:56px;border:1px solid #000;border-radius:2px;
    padding:4px 5px;font-size:9px;line-height:1.25;
    display:flex;flex-direction:column;justify-content:flex-start;
    break-inside:avoid;box-sizing:border-box;
  }
  .print-bay-box.print-empty-box{border-style:dashed;color:#666;}
  .print-bay-box.print-door{
    align-items:center;text-align:center;justify-content:center;
    background:repeating-linear-gradient(90deg,#000 0 4px,transparent 4px 8px);
    background-size:100% 1px;background-position:top;background-repeat:no-repeat;
  }
  .pbb-tag{font-weight:700;font-size:10.5px;}
  .pbb-type{color:#555;font-size:8.5px;margin-top:1px;}
  .pbb-name{font-weight:700;margin-top:3px;}
  .pbb-reg{color:#333;}
  .pbb-since{color:#777;font-size:8.5px;}
  .pbb-sub{color:#777;font-size:8.5px;margin-top:2px;}
  .pbb-notes{
    color:#444;font-size:8px;font-style:italic;margin-top:3px;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  @media print{
    body *{visibility:hidden;}
    .print-only, .print-only *{visibility:visible;}
    .print-only{display:block;position:absolute;top:0;left:0;width:100%;margin:0;padding:16px;background:#fff;color:#000;}
    .print-warehouse{page-break-before:always;}
    .print-warehouse:first-of-type{page-break-before:auto;}
    @page{margin:12mm;}
  }
</style>
</head>
<body>

<div class="pin-gate" id="pinGate" style="display:none;">
  <div class="pin-card">
    <div class="pin-eyebrow">Storage Sites</div>
    <h1>Enter PIN</h1>
    <input type="tel" inputmode="numeric" autocomplete="off" id="pinInput" class="pin-input" placeholder="••••" />
    <div class="pin-error" id="pinError" style="display:none;">Incorrect PIN — try again.</div>
    <button class="btn" id="pinSubmitBtn" style="width:100%;margin-top:12px;">Unlock</button>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="titleblock">
    <div class="titleblock-left">
      <div class="eyebrow">Site plan — vehicle storage</div>
      <input id="facilityName" value="Storage Sites" />
      <div class="scale-note">Click a bay to edit · press and hold, then drag onto another bay to swap</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
      <div class="stats" id="stats"></div>
      <div style="display:flex;gap:6px;">
        <button class="btn ghost small" id="backupsBtn">Backups</button>
        <button class="btn ghost small" id="printBtn">Print</button>
        <button class="btn ghost small" id="manageTypesBtn">Manage types</button>
        <button class="btn ghost small" id="exportBtn">Export data</button>
        <button class="btn ghost small" id="importBtn">Import data</button>
        <input type="file" id="importFile" accept="application/json" style="display:none" />
      </div>
    </div>
  </div>

  <div class="search-wrap" id="searchWrap">
    <input type="text" id="searchInput" placeholder="Find a person, name or registration — across all warehouses…" autocomplete="off" />
    <div class="search-filters">
      <select id="searchWhFilter"><option value="all">All warehouses</option></select>
      <label class="search-free-toggle"><input type="checkbox" id="freeOnlyFilter" /> Free bays only</label>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="wh-tabs" id="whTabs"></div>
  <div class="global-stat-line" id="globalStatLine"></div>
  <div class="wh-purpose" id="whPurpose"></div>

  <div class="legend" id="legend"></div>

  <div id="plan"></div>

  <div class="status-line" id="statusLine">loading…</div>
  <div class="status-line" id="lockLine" style="display:none;"><a href="#" id="lockLink" style="color:inherit;">🔒 Lock</a></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBody"></div>
</div>

<div id="printReport" class="print-only"></div>

<!-- Optional cross-device sync. Safe to leave as-is if you haven't set up
     Firebase yet — the app just runs without sync until firebase-config.js
     has real values in it. See firebase-config.js for setup notes. -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
(function(){
  const DEFAULT_TYPES = {
    car:           { label:'Car',             length:4.5, color:'#B54834' },
    campervan:     { label:'Campervan',       length:6.0, color:'#2E6E62' },
    caravan:       { label:'Caravan',         length:7.0, color:'#47598C' },
    trailer:       { label:'Trailer',         length:5.0, color:'#B4831F' },
    foldingTrailer:{ label:'Folding Trailer', length:4.0, color:'#6E5B8C' },
  };
  // TYPES always points at state.vehicleTypes once state is loaded (see bindTypes()),
  // so edits made through "Manage types" are visible everywhere without extra plumbing.
  let TYPES = DEFAULT_TYPES;
  function bindTypes(){ TYPES = state.vehicleTypes; }
  function hexAlpha(hex, alpha){
    const a = Math.round(alpha * 255).toString(16).padStart(2,'0');
    return (hex.length === 7 ? hex : '#999999') + a;
  }
  const LONG_STAY_MS = 365 * 24 * 60 * 60 * 1000;
  function isLongStay(since){
    if(!since) return false;
    const d = new Date(since);
    if(isNaN(d.getTime())) return false;
    return (Date.now() - d.getTime()) > LONG_STAY_MS;
  }
  function slugify(label, existingKeys){
    let base = label.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'type';
    let key = base, n = 1;
    while(existingKeys.includes(key)) key = `${base}-${++n}`;
    return key;
  }
  const PX_PER_M = 15.5;
  const MIN_W = 56;
  const STORAGE_KEY = 'yard-plan-state-v2';

  function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }

  function emptyRow(){ return { id: uid(), spots: [] }; }

  function defaultWarehouse(cfg){
    return {
      id: uid(),
      name: cfg.name,
      purpose: cfg.purpose || '',
      recommended: cfg.recommended || null,
      layout: cfg.layout || 'aisle', // 'aisle' (two-sided, indoor) or 'single' (one row, outdoor — no aisle)
      aisleDoor: cfg.aisleDoor || null, // 'left' | 'right' | null — only meaningful for 'aisle' layout
      left: Array.from({length: cfg.left}, emptyRow),
      right: Array.from({length: cfg.right || 0}, emptyRow),
    };
  }

  function defaultState(){
    const warehouses = [
      defaultWarehouse({ name:'Warehouse 1', left:1, right:1, purpose:'Caravans & folding trailers', recommended:['caravan','foldingTrailer'] }),
      defaultWarehouse({ name:'Warehouse 2', left:1, right:1, purpose:'Caravans & folding trailers', recommended:['caravan','foldingTrailer'] }),
      defaultWarehouse({ name:'Warehouse 3', left:1, right:1, purpose:'Cars, caravans & campervans', recommended:['car','caravan','campervan'] }),
      defaultWarehouse({ name:'Warehouse 4', left:2, right:2 }),
      defaultWarehouse({ name:'Warehouse 5', left:2, right:1 }),
    ];
    return {
      facilityName: 'Storage Sites',
      warehouses,
      activeWarehouseId: warehouses[0].id,
      vehicleTypes: JSON.parse(JSON.stringify(DEFAULT_TYPES)),
    };
  }

  function spotDefault(type, seq){
    return { id: uid(), type, length: TYPES[type].length, occupants: [], seq, removed: false, isDoor: false };
  }
  function nextSeqFor(row){
    return row.spots.reduce((max, s) => Math.max(max, s.seq || 0), 0) + 1;
  }

  let state = null;
  let showOverview = false; // UI-only, not persisted
  let saveTimer = null;

  function migrate(loaded){
    if(!loaded || !Array.isArray(loaded.warehouses)) return null;
    if(!loaded.vehicleTypes || typeof loaded.vehicleTypes !== 'object'){
      loaded.vehicleTypes = JSON.parse(JSON.stringify(DEFAULT_TYPES));
    }
    loaded.warehouses.forEach(w => {
      // upgrade a pre-side/row save (single "aisles" array) into left/right rows
      if(Array.isArray(w.aisles) && !Array.isArray(w.left)){
        w.left = [{ id: uid(), spots: w.aisles.flatMap(a => a.spots) }];
        w.right = [emptyRow()];
        delete w.aisles;
      }
      if(!Array.isArray(w.left)) w.left = [emptyRow()];
      if(!Array.isArray(w.right)) w.right = [emptyRow()];
      if(typeof w.purpose !== 'string') w.purpose = '';
      if(w.layout !== 'single' && w.layout !== 'aisle') w.layout = 'aisle';
      if(w.aisleDoor !== 'left' && w.aisleDoor !== 'right') w.aisleDoor = null;
      [...w.left, ...w.right].forEach(row => {
        row.spots.forEach((s, i) => {
          if(typeof s.seq !== 'number') s.seq = i + 1;
          if(typeof s.removed !== 'boolean') s.removed = false;
          if(typeof s.isDoor !== 'boolean') s.isDoor = false;
          if(!Array.isArray(s.occupants)){
            s.occupants = s.occupant ? [s.occupant] : [];
          }
          delete s.occupant;
        });
      });
    });
    return loaded;
  }

  // Uses window.storage when running inside Claude.ai (needs a connection).
  // Falls back to the browser's own localStorage when opened as a standalone
  // file with no connection at all — that's what makes offline use possible.
  const hasCloudStorage = typeof window.storage !== 'undefined' && window.storage;

  // Optional real-time sync across devices via Firebase, configured in firebase-config.js.
  // Not required — the app works fine without it, just without cross-device sync.
  const hasFirebaseSync = typeof FIREBASE_ENABLED !== 'undefined' && FIREBASE_ENABLED
    && typeof firebaseConfig !== 'undefined' && firebaseConfig.apiKey && firebaseConfig.databaseURL;
  let syncRef = null;      // base ref at SYNC_PATH — parent of both 'data' and 'backups'
  let syncDataRef = null;  // syncRef.child('data') — the live, currently-synced state
  let applyingRemote = false;   // guards against feedback loops while applying an incoming update
  let suppressNextEcho = false; // set right after our own write, so we don't re-render our own echo

  function initFirebaseSync(){
    if(!hasFirebaseSync) return;
    let connected = false;
    const timeoutId = setTimeout(() => {
      if(!connected){
        setStatus('sync not responding — check firebase-config.js values and your database rules');
      }
    }, 7000);
    try{
      firebase.initializeApp(firebaseConfig);
      syncRef = firebase.database().ref(typeof SYNC_PATH !== 'undefined' ? SYNC_PATH : 'storage-sites-data');
      syncDataRef = syncRef.child('data');
      syncDataRef.on('value', (snapshot) => {
        connected = true;
        clearTimeout(timeoutId);
        if(suppressNextEcho){ suppressNextEcho = false; return; }
        const remote = snapshot.val();
        if(!remote){
          // Nothing at the live-data path. This does NOT automatically push
          // anything anymore — an earlier version did, and a transient/empty
          // read caused real data loss. Now it just tells you, and pushing
          // is a deliberate, confirmed action via the Backups dialog.
          const n = allSpotsGlobal().length;
          setStatus(`cloud is empty — this device has ${n} bay${n===1?'':'s'} locally; open "Backups" to push it up when you're sure`);
          return;
        }
        const parsed = migrate(JSON.parse(remote));
        if(!parsed) return;
        // don't yank the rug out from under an in-progress edit
        if(document.getElementById('overlay').classList.contains('show')) return;
        applyingRemote = true;
        state = parsed;
        if(!state.warehouses.find(w => w.id === state.activeWarehouseId)){
          state.activeWarehouseId = state.warehouses[0]?.id;
        }
        bindTypes();
        render();
        setStatus('synced just now');
        applyingRemote = false;
      }, (error) => {
        connected = true;
        clearTimeout(timeoutId);
        console.error('Firebase sync error', error);
        setStatus('sync error: ' + (error && error.message ? error.message : error) + ' — check your database rules');
      });
    }catch(e){
      clearTimeout(timeoutId);
      console.error('Firebase sync failed to start', e);
      setStatus('sync failed to start: ' + (e && e.message ? e.message : e));
    }
  }

  async function load(){
    try{
      if(hasCloudStorage){
        const res = await window.storage.get(STORAGE_KEY, false);
        state = res && res.value ? migrate(JSON.parse(res.value)) : null;
      } else {
        const raw = localStorage.getItem(STORAGE_KEY);
        state = raw ? migrate(JSON.parse(raw)) : null;
      }
      if(!state) state = defaultState();
      if(!state.warehouses.find(w => w.id === state.activeWarehouseId)){
        state.activeWarehouseId = state.warehouses[0]?.id;
      }
    }catch(e){
      state = defaultState();
    }
    bindTypes();
    render();
    setStatus(hasCloudStorage ? 'saved' : (hasFirebaseSync ? 'connecting to sync…' : 'saved to this browser (offline)'));
    initFirebaseSync();
  }

  function save(){
    if(applyingRemote) return; // this "change" came from the server itself — don't bounce it back
    setStatus('saving…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try{
        if(hasCloudStorage){
          const ok = await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
          setStatus(ok ? 'saved' : 'save failed — changes kept in this session only');
        } else {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          setStatus(hasFirebaseSync ? 'saved locally' : 'saved to this browser (offline)');
        }
        if(hasFirebaseSync && syncDataRef){
          suppressNextEcho = true;
          syncDataRef.set(JSON.stringify(state))
            .then(() => setStatus('synced across devices'))
            .catch(() => setStatus('saved locally — sync failed (offline?)'));
        }
        maybeAutoBackup();
      }catch(e){
        setStatus('save failed — changes kept in this session only');
      }
    }, 250);
  }

  // ---------- backup history ----------
  // Auto-snapshots at most once every 15 minutes of activity, plus always
  // right before a restore (so a restore itself is never a one-way door).
  const MAX_BACKUPS = 15;
  const BACKUP_INTERVAL_MS = 15 * 60 * 1000;
  const LOCAL_BACKUPS_KEY = STORAGE_KEY + '-backups';
  let lastBackupAt = 0;

  function maybeAutoBackup(){
    const now = Date.now();
    if(now - lastBackupAt < BACKUP_INTERVAL_MS) return;
    lastBackupAt = now;
    createBackup();
  }

  function createBackup(){
    const ts = Date.now();
    const json = JSON.stringify(state);
    if(hasFirebaseSync && syncRef){
      syncRef.child('backups').child(String(ts)).set(json).then(() => pruneFirebaseBackups()).catch(() => {});
    } else {
      try{
        const raw = localStorage.getItem(LOCAL_BACKUPS_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        arr.push({ ts, json });
        while(arr.length > MAX_BACKUPS) arr.shift();
        localStorage.setItem(LOCAL_BACKUPS_KEY, JSON.stringify(arr));
      }catch(e){}
    }
  }

  function pruneFirebaseBackups(){
    syncRef.child('backups').once('value').then(snap => {
      const val = snap.val();
      if(!val) return;
      const keys = Object.keys(val).sort((a,b) => Number(a) - Number(b));
      while(keys.length > MAX_BACKUPS){
        syncRef.child('backups').child(keys.shift()).remove();
      }
    }).catch(() => {});
  }

  function listBackups(callback){
    if(hasFirebaseSync && syncRef){
      syncRef.child('backups').once('value').then(snap => {
        const val = snap.val() || {};
        const list = Object.keys(val).map(k => ({ ts: Number(k), json: val[k] })).sort((a,b) => b.ts - a.ts);
        callback(list);
      }).catch(() => callback([]));
    } else {
      try{
        const raw = localStorage.getItem(LOCAL_BACKUPS_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        callback([...arr].sort((a,b) => b.ts - a.ts));
      }catch(e){ callback([]); }
    }
  }

  function pushLocalToCloudSectionHtml(){
    if(!hasFirebaseSync) return '';
    const n = allSpotsGlobal().length;
    return `
      <div class="field" style="border:1px solid var(--line);border-radius:var(--radius);padding:10px;background:var(--paper);">
        <label style="margin-bottom:4px;">Cloud sync</label>
        <div class="sub" style="margin-bottom:8px;">This device currently has ${n} bay${n===1?'':'s'} locally. Only use this if you're sure this device's copy is the one everyone else should get — it overwrites the cloud copy.</div>
        <button class="btn ghost small" id="pushCloudBtn">Push this device's data to the cloud</button>
      </div>
    `;
  }

  function bindPushCloudBtn(){
    const btn = document.getElementById('pushCloudBtn');
    if(!btn) return;
    btn.addEventListener('click', () => {
      confirmAction(
        'Push local data to the cloud?',
        `This overwrites the cloud copy with what's on this device right now. If another device has different or newer data, that will be lost. A safety backup of what's currently in the cloud is not possible to guarantee here, so only do this if you're confident this device is correct.`,
        () => {
          createBackup();
          if(syncDataRef){
            suppressNextEcho = true;
            syncDataRef.set(JSON.stringify(state))
              .then(() => setStatus('pushed to cloud'))
              .catch(() => setStatus('push failed — check your connection'));
          }
        }
      );
    });
  }

  function openBackupsModal(){
    const overlay = document.getElementById('overlay');
    const body = document.getElementById('modalBody');
    body.className = 'modal wide';
    body.innerHTML = `<h3>Backups</h3><div class="sub">Loading…</div>`;
    overlay.classList.add('show');
    overlay.addEventListener('click', (e) => { if(e.target === overlay){ body.className = 'modal'; closeModal(); } }, { once:true });

    listBackups((list) => {
      if(list.length === 0){
        body.innerHTML = `
          <h3>Backups</h3>
          <div class="sub">No backups yet. One is taken automatically roughly every 15 minutes while you're actively using the app, and always right before a restore.</div>
          ${pushLocalToCloudSectionHtml()}
          <div class="modal-actions"><button class="btn ghost" id="bkCloseBtn">Close</button></div>
        `;
      } else {
        body.innerHTML = `
          <h3>Backups</h3>
          <div class="sub">Restoring replaces everything currently in the app with that snapshot. A safety backup of what's there right now is taken first, so restoring is never a one-way trip.</div>
          <div id="bkList">
            ${list.map((b, i) => `
              <div class="type-manage-row">
                <span style="flex:1;font-size:12.5px;color:var(--ink);">${escapeHtml(new Date(b.ts).toLocaleString())}</span>
                <button class="btn ghost small" data-restore-backup="${i}">Restore</button>
              </div>
            `).join('')}
          </div>
          ${pushLocalToCloudSectionHtml()}
          <div class="modal-actions"><button class="btn ghost" id="bkCloseBtn">Close</button></div>
        `;
        body.querySelectorAll('[data-restore-backup]').forEach(btn => {
          btn.addEventListener('click', () => {
            const b = list[parseInt(btn.getAttribute('data-restore-backup'), 10)];
            confirmAction(
              'Restore this backup?',
              `This replaces everything currently in the app with the snapshot from ${new Date(b.ts).toLocaleString()}. A safety backup of the current state is taken first.`,
              () => {
                createBackup(); // safety snapshot of current state, taken before we overwrite it
                const parsed = migrate(JSON.parse(b.json));
                if(!parsed) return;
                state = parsed;
                if(!state.warehouses.find(w => w.id === state.activeWarehouseId)){
                  state.activeWarehouseId = state.warehouses[0]?.id;
                }
                bindTypes();
                body.className = 'modal';
                render(); save();
              }
            );
          });
        });
      }
      bindPushCloudBtn();
      const closeBtn = document.getElementById('bkCloseBtn');
      if(closeBtn) closeBtn.addEventListener('click', () => { body.className = 'modal'; closeModal(); });
    });
  }

  function setStatus(t){
    document.getElementById('statusLine').textContent = t;
  }

  function widthFor(length){
    return Math.max(MIN_W, Math.round(length * PX_PER_M));
  }

  function activeWarehouse(){
    return state.warehouses.find(w => w.id === state.activeWarehouseId) || state.warehouses[0];
  }

  function warehouseRows(w){
    return [...w.left, ...w.right];
  }
  function warehouseSpots(w){
    return warehouseRows(w).flatMap(r => r.spots).filter(s => !s.removed && !s.isDoor);
  }
  function allSpots(){
    return warehouseSpots(activeWarehouse());
  }
  function allSpotsGlobal(){
    return state.warehouses.flatMap(w => warehouseSpots(w));
  }
  function findRow(rowId){
    const w = activeWarehouse();
    return warehouseRows(w).find(r => r.id === rowId);
  }

  function render(){
    document.getElementById('facilityName').value = state.facilityName;
    renderTabs();
    populateSearchWhFilter();
    if(showOverview){
      renderOverviewStats();
      document.getElementById('legend').innerHTML = '';
      document.getElementById('whPurpose').innerHTML = '';
      renderOverviewPage();
    } else {
      renderStats();
      renderGlobalStatLine();
      renderPurpose();
      renderLegend();
      renderPlan();
    }
  }

  function renderOverviewStats(){
    const spots = allSpotsGlobal();
    const total = spots.length;
    const occupied = spots.filter(s => s.occupants && s.occupants.length > 0).length;
    const free = total - occupied;
    const el = document.getElementById('stats');
    el.innerHTML = '';
    [['Plekken', total], ['In gebruik', occupied], ['Vrij', free]].forEach(([l,n]) => {
      const d = document.createElement('div');
      d.className = 'stat';
      d.innerHTML = `<div class="n">${n}</div><div class="l">${l}</div>`;
      el.appendChild(d);
    });
    document.getElementById('globalStatLine').textContent = `All ${state.warehouses.length} warehouses`;
  }

  function renderOverviewPage(){
    const wrap = document.getElementById('plan');
    wrap.innerHTML = '';

    const container = document.createElement('div');
    container.className = 'overview';

    // ---- per-warehouse availability ----
    const whSection = document.createElement('div');
    whSection.className = 'overview-section';
    let whRows = state.warehouses.map(w => {
      const spots = warehouseSpots(w);
      const occupied = spots.filter(s => s.occupants && s.occupants.length > 0).length;
      const doors = warehouseRows(w).flatMap(r => r.spots).filter(s => s.isDoor && !s.removed).length;
      return { id: w.id, name: w.name, total: spots.length, occupied, free: spots.length - occupied, doors };
    });
    const whTotals = whRows.reduce((acc, r) => ({
      total: acc.total + r.total, occupied: acc.occupied + r.occupied, free: acc.free + r.free
    }), { total:0, occupied:0, free:0 });

    whSection.innerHTML = `
      <h3 class="overview-h">Places available per warehouse</h3>
      <table class="overview-table">
        <thead><tr><th>Warehouse</th><th>Bays</th><th>In gebruik</th><th>Vrij</th></tr></thead>
        <tbody>
          ${whRows.map(r => `
            <tr class="ov-row" data-jump-wh="${r.id}" title="Open ${escapeAttr(r.name)}">
              <td>${escapeHtml(r.name)}${r.doors ? ` <span class="ov-door-note">(${r.doors} ${doorIconSvg(10)})</span>` : ''}</td>
              <td>${r.total}</td>
              <td>${r.occupied}</td>
              <td class="${r.free > 0 ? 'ov-free' : ''}">${r.free}</td>
            </tr>
          `).join('')}
        </tbody>
        <tfoot>
          <tr>
            <td>Total</td>
            <td>${whTotals.total}</td>
            <td>${whTotals.occupied}</td>
            <td>${whTotals.free}</td>
          </tr>
        </tfoot>
      </table>
    `;
    whSection.querySelectorAll('[data-jump-wh]').forEach(row => {
      row.addEventListener('click', () => {
        showOverview = false;
        state.activeWarehouseId = row.getAttribute('data-jump-wh');
        render();
      });
    });
    container.appendChild(whSection);

    // ---- pieces per vehicle type (counts individual vehicles, not bays —
    // a bay holding 3 motors counts as 3 pieces of that type) ----
    const typeSection = document.createElement('div');
    typeSection.className = 'overview-section';
    const typeCounts = {};
    Object.keys(TYPES).forEach(k => typeCounts[k] = 0);
    allSpotsGlobal().forEach(s => {
      if(!s.occupants) return;
      const n = s.occupants.length;
      if(n > 0) typeCounts[s.type] = (typeCounts[s.type] || 0) + n;
    });
    const totalPieces = Object.values(typeCounts).reduce((a,b) => a+b, 0);

    typeSection.innerHTML = `
      <h3 class="overview-h">Pieces per vehicle type</h3>
      <table class="overview-table">
        <thead><tr><th>Type</th><th>Pieces</th></tr></thead>
        <tbody>
          ${Object.keys(TYPES).map(key => {
            const t = TYPES[key];
            const n = typeCounts[key] || 0;
            return `
              <tr>
                <td><span class="dot" style="background:${t.color}"></span>${escapeHtml(t.label)}</td>
                <td>${n}</td>
              </tr>
            `;
          }).join('')}
        </tbody>
        <tfoot>
          <tr><td>Total</td><td>${totalPieces}</td></tr>
        </tfoot>
      </table>

    container.appendChild(typeSection);

    wrap.appendChild(container);

  function renderTabs(){
    const el = document.getElementById('whTabs');
    el.innerHTML = '';

    const overviewTab = document.createElement('div');
    overviewTab.className = 'wh-tab' + (showOverview ? ' active' : '');

  function openRenameWarehouseModal(warehouseId){
    const w = state.warehouses.find(x => x.id === warehouseId);
    if(!w) return;
    const overlay = document.getElementById('overlay');
    const body = document.getElementById('modalBody');
    body.className = 'modal';
    let layout = w.layout;
    let aisleDoor = w.aisleDoor;

    function layoutChipHtml(){
      return `
        <div class="type-row" id="layoutRow">
          <div class="type-chip ${layout==='aisle'?'active':''}" data-layout="aisle">Aisle (indoor, two-sided)</div>
          <div class="type-chip ${layout==='single'?'active':''}" data-layout="single">Single row (outdoor)</div>
        </div>
      `;
    }
    function doorChipHtml(){
      return `
        <div class="type-row" id="doorRow">
          <div class="type-chip ${!aisleDoor?'active':''}" data-door="">No door marker</div>
          <div class="type-chip ${aisleDoor==='left'?'active':''}" data-door="left">Door on left</div>
          <div class="type-chip ${aisleDoor==='right'?'active':''}" data-door="right">Door on right</div>
        </div>
      `;
    }

    body.innerHTML = `
      <h3>Warehouse settings</h3>
      <div class="field">
        <label>Warehouse name</label>
        <input type="text" id="fWhName" value="${escapeAttr(w.name)}" />
      </div>
      <div class="field">
        <label>Purpose / description (optional)</label>
        <input type="text" id="fWhPurpose" value="${escapeAttr(w.purpose || '')}" placeholder="e.g. Caravans & folding trailers" />
      </div>
      <div class="field">
        <label>Layout</label>
        <div id="layoutWrap">${layoutChipHtml()}</div>
      </div>
      <div class="field" id="doorField" style="${layout==='single'?'display:none;':''}">
        <label>Door position on aisle</label>
        <div id="doorWrap">${doorChipHtml()}</div>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="whCancelBtn">Cancel</button>
        <button class="btn" id="whSaveBtn">Save</button>
      </div>
    `;
    overlay.classList.add('show');
    const input = document.getElementById('fWhName');
    input.focus();
    input.select();

    function bindLayoutChips(){
      document.querySelectorAll('#layoutRow [data-layout]').forEach(chip => {
        chip.addEventListener('click', () => {
          layout = chip.getAttribute('data-layout');
          document.getElementById('layoutWrap').innerHTML = layoutChipHtml();
          bindLayoutChips();
          document.getElementById('doorField').style.display = layout === 'single' ? 'none' : '';
        });
      });
    }
    function bindDoorChips(){
      document.querySelectorAll('#doorRow [data-door]').forEach(chip => {
        chip.addEventListener('click', () => {
          aisleDoor = chip.getAttribute('data-door') || null;
          document.getElementById('doorWrap').innerHTML = doorChipHtml();
          bindDoorChips();
        });
      });
    }
    bindLayoutChips();
    bindDoorChips();

    const finish = (shouldSave) => {
      if(shouldSave){
        const val = input.value.trim();
        if(val) w.name = val;
        w.purpose = document.getElementById('fWhPurpose').value.trim();
        if(layout !== w.layout){
          if(layout === 'single'){
            // merge the bays from both sides into one row — not one row per
            // side, so switching to "single" actually ends up as one row
            if(w.left.length === 0) w.left = [emptyRow()];
            const rightSpots = w.right.flatMap(r => r.spots);
            w.left[0].spots = [...w.left[0].spots, ...rightSpots];
            w.left = [w.left[0]]; // drop any extra left rows too — single means one row
            w.right = [];
          } else if(w.right.length === 0){
            w.right = [emptyRow()];
          }
          w.layout = layout;
        }
        w.aisleDoor = layout === 'single' ? null : aisleDoor;
      }
      closeModal();
      render();
      if(shouldSave) save();
    };
    document.getElementById('whCancelBtn').addEventListener('click', () => finish(false));
    document.getElementById('whSaveBtn').addEventListener('click', () => finish(true));
    input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter') finish(true);
      if(e.key === 'Escape') finish(false);
    });
    overlay.addEventListener('click', (e) => { if(e.target === overlay) finish(false); }, { once:true });
  }

    const free = total - occupied;
    const el = document.getElementById('stats');

  function rowLabel(sideName, idx, hasAisle){
    if(!hasAisle) return `Row ${idx+1}`;
    if(idx === 0) return `${sideName} · row 1 (near aisle)`;
    return `${sideName} · row ${idx+1} (back)`;
  }

  function renderPlan(){
    const wrap = document.getElementById('plan');
    wrap.innerHTML = '';
    const w = activeWarehouse();
    if(!w) return;
    const hasAisle = w.layout !== 'single';

    const scroller = document.createElement('div');
    scroller.className = 'plan-scroll';

    const plan = document.createElement('div');
    plan.className = 'plan';

    if(hasAisle){
      // right side, farthest row first so it sits furthest from the aisle bar
      [...w.right].reverse().forEach((row, i) => {
        const realIdx = w.right.length - 1 - i;
        plan.appendChild(renderRowBlock(row, 'Right', realIdx, w.right.length, 'right', 'R', true));
      });

      const aisle = document.createElement('div');
      aisle.className = 'aisle-bar';
      let doorHtml = '';
      if(w.aisleDoor === 'left') doorHtml = `<span class="aisle-door aisle-door-left" title="Door">${doorIconSvg(16)}</span>`;
      if(w.aisleDoor === 'right') doorHtml = `<span class="aisle-door aisle-door-right" title="Door">${doorIconSvg(16)}</span>`;
      aisle.innerHTML = `${doorHtml}<span class="aisle-label">AISLE</span>`;
      plan.appendChild(aisle);

      // left side, row 1 nearest the aisle first
      w.left.forEach((row, i) => {
        plan.appendChild(renderRowBlock(row, 'Left', i, w.left.length, 'left', 'L', true));
      });
    } else {
      // outdoor / single-row layout — no aisle, no left/right split
      w.left.forEach((row, i) => {
        plan.appendChild(renderRowBlock(row, 'Row', i, w.left.length, 'left', '', false));
      });
    }

    scroller.appendChild(plan);
    wrap.appendChild(scroller);
  }

  function renderRowBlock(row, sideName, idx, sideCount, sideKey, tagPrefix, hasAisle){
    const block = document.createElement('div');
    block.className = 'row-block';

    const head = document.createElement('div');
    head.className = 'row-head';
    let actionsHtml = `<span class="add-spot-wrap"><button class="btn ghost small" data-add-spot="${row.id}">+ Add bay</button></span>`;
    if(idx === sideCount - 1){
      // controls live on the outermost (back) row
      if(sideCount > 1){
        actionsHtml += `<button class="side-toggle" data-remove-row="${sideKey}">− remove row ${idx+1} (deletes its bays)</button>`;
      } else {
        actionsHtml += `<button class="side-toggle" data-add-row="${sideKey}">+ add another row</button>`;
      }
    }
    const activeCount = row.spots.filter(s => !s.removed).length;
    const removedCount = row.spots.length - activeCount;
    const countLabel = `${activeCount} bay${activeCount===1?'':'s'}` + (removedCount ? ` · ${removedCount} removed` : '');
    head.innerHTML = `
      <span class="row-tag">${rowLabel(sideName, idx, hasAisle)}</span>
      <span style="font-size:10.5px;color:var(--ink-faint);font-family:var(--font-display)">${countLabel}</span>
      <div class="row-actions">${actionsHtml}</div>
    `;
    block.appendChild(head);

    const lane = document.createElement('div');
    lane.className = 'lane';
    row.spots.forEach((spot, sIdx) => {
      lane.appendChild(renderSpot(row, spot, sideName, idx, sIdx, tagPrefix));
    });
    lane.appendChild(renderAddSpotControl(row));
    block.appendChild(lane);

    return block;
  }

  function autoTag(tagPrefix, seq){
    return `${tagPrefix}${seq}`;
  }
  function displayTag(spot, tagPrefix){
    return (spot.label && spot.label.trim()) ? spot.label.trim() : autoTag(tagPrefix, spot.seq);
  }

  function renderSpot(row, spot, sideName, rowIdx, sIdx, tagPrefix){
    const el = document.createElement('div');
    const w = widthFor(spot.length);
    el.style.width = w + 'px';
    el.setAttribute('data-spot-id', spot.id);
    const tag = displayTag(spot, tagPrefix);

    if(spot.removed){
      el.className = 'spot gap';
      el.title = 'Removed bay — click to reuse this spot';
      el.innerHTML = `
        <div class="spot-del" data-hard-remove="${spot.id}" title="Delete this slot permanently">✕</div>
        <span class="spot-id" style="align-self:flex-start">${escapeHtml(tag)}</span>
        <span class="gap-label">removed<br/>tap to reuse</span>
      `;
      el.addEventListener('click', (e) => {
        if(e.target.closest('[data-hard-remove]')) return;
        spot.removed = false;
        render(); save();
      });
      return el;
    }

    if(spot.isDoor){
      el.className = 'spot door';
      el.title = 'Door — click to edit';
      el.innerHTML = `
        <div class="spot-del" data-remove-spot="${spot.id}" title="Remove this bay">✕</div>
        <span class="spot-id" style="align-self:flex-start">${escapeHtml(tag)}</span>
        <span class="door-label">${doorIconSvg(20)}<br/>${escapeHtml(spot.label && spot.label.trim() ? spot.label.trim() : 'door')}</span>
      `;
      el.addEventListener('click', (e) => {
        if(e.target.closest('[data-remove-spot]')) return;
        openSpotModal(row, spot, sideName, rowIdx, sIdx, tagPrefix);
      });
      return el;
    }

    if(spot.occupants && spot.occupants.length > 0){
      const t = TYPES[spot.type] || { color:'#7A7A7A', label:'Unknown' };
      const longStay = spot.occupants.some(o => isLongStay(o.since));
      el.className = 'spot' + (longStay ? ' long-stay' : '');
      el.style.background = hexAlpha(t.color, 0.16);
      el.style.borderColor = t.color;
      const multi = spot.occupants.length > 1;
      const primary = multi ? `${spot.occupants.length}× ${t.label}` : (spot.occupants[0].name || 'Unnamed');
      const single = spot.occupants[0];
      const sub = multi
        ? spot.occupants.map(o => o.name || 'Unnamed').join(', ')
        : [single.reg, single.since].filter(Boolean).join(' · ');
      el.innerHTML = `
        <div class="spot-del" data-clear="${spot.id}" title="Clear bay">✕</div>
        ${longStay ? `<div class="long-stay-badge" title="Stored over a year">⏱</div>` : ''}
        <div class="spot-id">${escapeHtml(tag)}</div>
        <div>
          <div class="spot-label">${escapeHtml(primary)}</div>
          <div class="spot-sub">${escapeHtml(sub)}</div>
        </div>
        <div class="spot-dim">${spot.length}m</div>
      `;
    } else {
      el.className = 'spot empty';
      el.innerHTML = `
        <div class="spot-del" data-remove-spot="${spot.id}" title="Remove this bay">✕</div>
        <span class="plus">+</span>
        ${spot.label ? `<div class="spot-id" style="align-self:flex-start">${escapeHtml(spot.label)}</div>` : ''}
      `;
    }
    el.addEventListener('click', (e) => {
      if(e.target.closest('[data-clear]') || e.target.closest('[data-remove-spot]')) return;
      if(dragJustHappened){ dragJustHappened = false; return; }
      openSpotModal(row, spot, sideName, rowIdx, sIdx, tagPrefix);
    });
    attachDragToSwap(el, spot.id);
    return el;
  }

  // ---------- press-and-hold drag to swap two bays' contents ----------
  // A quick swipe still scrolls the row normally; only a held-then-moved
  // touch/click picks a bay up, so the two gestures don't fight each other.
  let dragState = null;
  let dragJustHappened = false; // suppresses the click that follows a drag release

  function findSpotById(id){
    for(const w of state.warehouses){
      for(const r of warehouseRows(w)){
        const s = r.spots.find(sp => sp.id === id);
        if(s) return s;
      }
    }
    return null;
  }

  function swapSpotContents(idA, idB){
    const a = findSpotById(idA), b = findSpotById(idB);
    if(!a || !b || a.removed || b.removed || a.isDoor || b.isDoor) return;
    // Only what's PARKED there moves — the bay's own name/number (label, seq)
    // stays put, since that's the physical bay's identity, not the vehicle's.
    const fields = ['type','length','occupants'];
    const tmp = {};
    fields.forEach(f => tmp[f] = a[f]);
    fields.forEach(f => a[f] = b[f]);
    fields.forEach(f => b[f] = tmp[f]);
  }

  function attachDragToSwap(el, spotId){
    el.addEventListener('pointerdown', (e) => {
      if(e.target.closest('.spot-del')) return;
      if(e.pointerType === 'mouse' && e.button !== 0) return;
      const startX = e.clientX, startY = e.clientY;
      const pointerId = e.pointerId;
      let cancelled = false;

      const cancelIfMoved = (ev) => {
        if(Math.hypot(ev.clientX - startX, ev.clientY - startY) > 10){
          cancelled = true;
          clearTimeout(timer);
          el.removeEventListener('pointermove', cancelIfMoved);
          el.removeEventListener('pointerup', cancelEarly);
        }
      };
      const cancelEarly = () => {
        cancelled = true;
        clearTimeout(timer);
        el.removeEventListener('pointermove', cancelIfMoved);
        el.removeEventListener('pointerup', cancelEarly);
      };
      el.addEventListener('pointermove', cancelIfMoved);
      el.addEventListener('pointerup', cancelEarly);

      const timer = setTimeout(() => {
        el.removeEventListener('pointermove', cancelIfMoved);
        el.removeEventListener('pointerup', cancelEarly);
        if(cancelled) return;
        startDrag(el, spotId, pointerId, startX, startY);
      }, 450);
    });
  }

  function startDrag(sourceEl, spotId, pointerId, startX, startY){
    try{ sourceEl.setPointerCapture(pointerId); }catch(e){}
    sourceEl.classList.add('dragging');

    const rect = sourceEl.getBoundingClientRect();
    const ghost = sourceEl.cloneNode(true);
    ghost.className = 'spot drag-ghost';
    ghost.style.width = rect.width + 'px';
    ghost.style.height = rect.height + 'px';
    ghost.style.left = rect.left + 'px';
    ghost.style.top = rect.top + 'px';
    ghost.querySelectorAll('.spot-del').forEach(n => n.remove());
    document.body.appendChild(ghost);

    let currentTarget = null;

    function onMove(e){
      e.preventDefault();
      const dx = e.clientX - startX, dy = e.clientY - startY;
      ghost.style.transform = `translate(${dx}px, ${dy}px) scale(1.06)`;

      ghost.style.display = 'none';
      const under = document.elementFromPoint(e.clientX, e.clientY);
      ghost.style.display = '';
      const targetEl = under ? under.closest('.spot:not(.gap):not(.door)') : null;

      if(targetEl !== currentTarget){
        if(currentTarget) currentTarget.classList.remove('drop-target');
        if(targetEl && targetEl !== sourceEl) targetEl.classList.add('drop-target');
        currentTarget = (targetEl && targetEl !== sourceEl) ? targetEl : null;
      }
    }

    function onUp(e){
      sourceEl.removeEventListener('pointermove', onMove);
      sourceEl.removeEventListener('pointerup', onUp);
      sourceEl.removeEventListener('pointercancel', onCancel);
      sourceEl.classList.remove('dragging');
      if(currentTarget) currentTarget.classList.remove('drop-target');
      ghost.remove();

      if(currentTarget){
        const targetId = currentTarget.getAttribute('data-spot-id');
        swapSpotContents(spotId, targetId);
        dragJustHappened = true;
        setTimeout(() => { dragJustHappened = false; }, 300);
        render(); save();
      }
    }

    function onCancel(){
      sourceEl.removeEventListener('pointermove', onMove);
      sourceEl.removeEventListener('pointerup', onUp);
      sourceEl.removeEventListener('pointercancel', onCancel);
      sourceEl.classList.remove('dragging');
      if(currentTarget) currentTarget.classList.remove('drop-target');
      ghost.remove();
    }

    sourceEl.addEventListener('pointermove', onMove);
    sourceEl.addEventListener('pointerup', onUp);
    sourceEl.addEventListener('pointercancel', onCancel);
  }

  function renderAddSpotControl(row){
    const wrap = document.createElement('div');
    wrap.className = 'add-spot-wrap';
    wrap.innerHTML = `<button class="add-spot-btn" data-add-spot="${row.id}">+</button>`;
    return wrap;

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s){ return escapeHtml(s); }

  function doorIconSvg(size){
    return `<svg viewBox="0 0 16 16" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.3" style="display:inline-block;vertical-align:middle;flex-shrink:0;">
      <rect x="3" y="1.3" width="10" height="13.4" rx="0.6"/>
      <circle cx="10.3" cy="8" r="0.85" fill="currentColor" stroke="none"/>
    </svg>`;
  }

  function typeOrderFor(w){
    const keys = Object.keys(TYPES);
    if(!w.recommended) return keys;
    return [...w.recommended, ...keys.filter(k => !w.recommended.includes(k))];
  }

  // ---------- reusable confirm dialog for destructive actions ----------

  // ---------- modal: manage vehicle types ----------
  function typeUsageCount(key){
    let n = 0;
    state.warehouses.forEach(w => {
      warehouseRows(w).forEach(r => r.spots.forEach(s => { if(s.type === key && !s.isDoor && !s.removed) n++; }));
    });
    return n;
  }

  function openManageTypesModal(){
    const overlay = document.getElementById('overlay');
    const body = document.getElementById('modalBody');
    body.className = 'modal wide';

    function renderRows(){
      const keys = Object.keys(TYPES);
      const listHtml = keys.map(key => {
        const t = TYPES[key];
        const usage = typeUsageCount(key);
        const canDelete = usage === 0 && keys.length > 1;
        return `
          <div class="type-manage-row" data-row="${key}">
            <input type="color" class="tm-color" data-key="${key}" value="${t.color}" />
            <input type="text" class="tm-label" data-key="${key}" value="${escapeAttr(t.label)}" />
            <input type="number" class="tm-length" data-key="${key}" value="${t.length}" min="1" max="20" step="0.1" title="Default length (m)" />
            <span class="tm-usage">${usage} bay${usage===1?'':'s'}</span>
            <button class="tm-del" data-del-type="${key}" ${canDelete?'':'disabled'} title="${canDelete?'Remove this type':'Cannot remove: still in use, or the only type left'}">✕</button>
          </div>
        `;
      }).join('');

      body.innerHTML = `
        <h3>Manage vehicle types</h3>
        <div class="sub">Rename existing types, tweak colors and default lengths, or add your own storage categories.</div>

        <div class="add-type-row">
