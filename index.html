          <input type="text" class="tm-label" id="newTypeLabel" placeholder="e.g. Boat trailer" style="flex:1;" />
          <input type="number" class="tm-length" id="newTypeLength" placeholder="5" min="1" max="20" step="0.1" title="Default length (m)" />
          <button class="btn small" id="addTypeBtn">+ Add</button>
        </div>
        <div class="modal-actions">
          <button class="btn" id="doneTypesBtn">Done</button>
        </div>
      `;

      body.querySelectorAll('.tm-label[data-key]').forEach(inp => {
        inp.addEventListener('change', () => {
          const key = inp.getAttribute('data-key');
          TYPES[key].label = inp.value.trim() || TYPES[key].label;
          save();
        });
      });
      body.querySelectorAll('.tm-color').forEach(inp => {
        inp.addEventListener('input', () => {
          TYPES[inp.getAttribute('data-key')].color = inp.value;
          save();
        });
      });
      body.querySelectorAll('.tm-length[data-key]').forEach(inp => {
        inp.addEventListener('change', () => {
          const key = inp.getAttribute('data-key');
          const v = parseFloat(inp.value);
          if(v > 0) TYPES[key].length = v;
          save();
        });
      });
      body.querySelectorAll('[data-del-type]').forEach(btn => {
        btn.addEventListener('click', () => {
          if(btn.disabled) return;
          const key = btn.getAttribute('data-del-type');
          if(!confirm(`Delete the "${TYPES[key].label}" type? This can't be undone.`)) return;
          delete TYPES[key];
          state.warehouses.forEach(w => {
            if(Array.isArray(w.recommended)) w.recommended = w.recommended.filter(k => k !== key);
          });
          save();
          renderRows();
        });
      });

      body.querySelector('#addTypeBtn').addEventListener('click', () => {
        const labelInp = body.querySelector('#newTypeLabel');
        const colorInp = body.querySelector('#newTypeColor');
        const lengthInp = body.querySelector('#newTypeLength');
        const label = labelInp.value.trim();
        if(!label){ labelInp.focus(); return; }
        const length = parseFloat(lengthInp.value) || 5;
        const key = slugify(label, Object.keys(TYPES));
        TYPES[key] = { label, color: colorInp.value, length };
        save();
        renderRows();
      });

      body.querySelector('#doneTypesBtn').addEventListener('click', () => {
        body.className = 'modal';
        closeModal();
        render();
      });
    }

    renderRows();
    overlay.classList.add('show');
    overlay.addEventListener('click', (e) => {
      if(e.target === overlay){ body.className = 'modal'; closeModal(); render(); }
    }, { once:true });
  }

  document.getElementById('manageTypesBtn').addEventListener('click', openManageTypesModal);
  document.getElementById('backupsBtn').addEventListener('click', openBackupsModal);

  // ---------- global click handling ----------
  document.addEventListener('click', (e) => {
    const addSpotBtn = e.target.closest('[data-add-spot]');
    if(addSpotBtn){
      e.stopPropagation();
      openAddBayModal(addSpotBtn.getAttribute('data-add-spot'));
      return;
    }
    const clearBtn = e.target.closest('[data-clear]');
    if(clearBtn){
      const id = clearBtn.getAttribute('data-clear');
      const spot = allSpots().find(s => s.id === id);
      if(spot){ spot.occupants = []; render(); save(); }
      return;
    }
    const removeSpotBtn = e.target.closest('[data-remove-spot]');
    if(removeSpotBtn){
      const id = removeSpotBtn.getAttribute('data-remove-spot');
      warehouseRows(activeWarehouse()).forEach(r => {
        const s = r.spots.find(sp => sp.id === id);
        if(s){ s.removed = true; s.occupants = []; s.isDoor = false; }
      });
      render(); save();
      return;
    }
    const hardRemoveBtn = e.target.closest('[data-hard-remove]');
    if(hardRemoveBtn){
      const id = hardRemoveBtn.getAttribute('data-hard-remove');
      confirmAction(
        'Delete this bay slot?',
        `This permanently removes the slot from the plan (unlike "remove", it can't be tapped to reuse afterward). This can't be undone.`,
        () => {
          warehouseRows(activeWarehouse()).forEach(r => { r.spots = r.spots.filter(s => s.id !== id); });
          render(); save();
        }
      );
      return;
    }
    const addRowBtn = e.target.closest('[data-add-row]');
    if(addRowBtn){
      const side = addRowBtn.getAttribute('data-add-row');
      activeWarehouse()[side].push(emptyRow());
      render(); save();
      return;
    }
    const removeRowBtn = e.target.closest('[data-remove-row]');
    if(removeRowBtn){
      const side = removeRowBtn.getAttribute('data-remove-row');
      const w = activeWarehouse();
      if(w[side].length > 1){
        const lastRow = w[side][w[side].length - 1];
        const doIt = () => { w[side].pop(); render(); save(); };
        if(lastRow.spots.length > 0){
          confirmAction(
            'Remove this row?',
            `This deletes the row and all ${lastRow.spots.length} bay${lastRow.spots.length===1?'':'s'} in it, including any occupants. This can't be undone.`,
            doIt
          );
        } else {
          doIt();
        }
      }
      return;
    }
    const editWhBtn = e.target.closest('[data-edit-wh]');
    if(editWhBtn){
      e.stopPropagation();
      openRenameWarehouseModal(editWhBtn.getAttribute('data-edit-wh'));
      return;
    }
    const delWhBtn = e.target.closest('[data-del-wh]');
    if(delWhBtn){
      e.stopPropagation();
      if(state.warehouses.length <= 1) return;
      const id = delWhBtn.getAttribute('data-del-wh');
      const wh = state.warehouses.find(w => w.id === id);
      confirmAction(
        'Remove warehouse?',
        `This deletes "${wh ? wh.name : 'this warehouse'}" and everything stored in it — bays, occupants, everything. This can't be undone.`,
        () => {
          const removingActive = id === state.activeWarehouseId;
          state.warehouses = state.warehouses.filter(w => w.id !== id);
          if(removingActive) state.activeWarehouseId = state.warehouses[0].id;
          render(); save();
        }
      );
      return;
    }
    const addWhBtn = e.target.closest('#addWarehouseBtn');
    if(addWhBtn){
      const wh = defaultWarehouse({ name:`Warehouse ${state.warehouses.length + 1}`, left:1, right:1 });
      state.warehouses.push(wh);
      state.activeWarehouseId = wh.id;
      render(); save();
      return;
    }
  });

  document.getElementById('facilityName').addEventListener('input', (e) => {
    state.facilityName = e.target.value;
    save();
  });

  // ---------- print-friendly report ----------
  function printBayBoxHtml(spot, tagPrefix){
    if(spot.removed) return '';
    const tag = displayTag(spot, tagPrefix);

    if(spot.isDoor){
      return `
        <div class="print-bay-box print-door">
          ${doorIconSvg(14)}
          <div class="pbb-tag">${escapeHtml(tag)}</div>
          <div class="pbb-sub">door</div>
        </div>
      `;
    }

    const t = TYPES[spot.type] || { label: 'Unknown' };
    if(!spot.occupants || spot.occupants.length === 0){
      return `
        <div class="print-bay-box print-empty-box">
          <div class="pbb-tag">${escapeHtml(tag)}</div>
          <div class="pbb-sub">${escapeHtml(t.label)}<br/>empty</div>
        </div>
      `;
    }

    const names = spot.occupants.map(o => o.name || 'Unnamed').join(', ');
    const single = spot.occupants.length === 1 ? spot.occupants[0] : null;
    const multiNotes = !single ? spot.occupants.filter(o => o.notes).map(o => `${o.name || 'Unnamed'}: ${o.notes}`) : [];
    return `
      <div class="print-bay-box">
        <div class="pbb-tag">${escapeHtml(tag)}</div>
        <div class="pbb-type">${escapeHtml(t.label)}${spot.occupants.length > 1 ? ` ×${spot.occupants.length}` : ''}</div>
        <div class="pbb-name">${escapeHtml(names)}</div>
        ${single && single.reg ? `<div class="pbb-reg">${escapeHtml(single.reg)}</div>` : ''}
        ${single && single.since ? `<div class="pbb-since">since ${escapeHtml(single.since)}</div>` : ''}
        ${single && single.notes ? `<div class="pbb-notes">${escapeHtml(single.notes)}</div>` : ''}
        ${multiNotes.length ? `<div class="pbb-notes">${escapeHtml(multiNotes.join(' · '))}</div>` : ''}
      </div>
    `;
  }

  function printRowHtml(row, label, tagPrefix){
    if(row.spots.filter(s => !s.removed).length === 0) return '';
    return `
      <div class="print-row-label">${escapeHtml(label)}</div>
      <div class="print-row">${row.spots.map(s => printBayBoxHtml(s, tagPrefix)).join('')}</div>
    `;
  }

  function buildPrintReport(){
    const spots = allSpotsGlobal();
    const occupied = spots.filter(s => s.occupants && s.occupants.length > 0).length;
    const stamp = new Date().toLocaleDateString();

    let html = `
      <h1>${escapeHtml(state.facilityName || 'Storage Sites')}</h1>
      <div class="print-meta">Printed ${escapeHtml(stamp)}</div>
      <div class="print-summary">
        <div><strong>${spots.length}</strong> bays</div>
        <div><strong>${occupied}</strong> in gebruik</div>
        <div><strong>${spots.length - occupied}</strong> vrij</div>
      </div>
    `;

    state.warehouses.forEach(w => {
      const hasAisle = w.layout !== 'single';
      const totalBays = warehouseSpots(w).length;

      const doorNotes = [];
      if(w.aisleDoor) doorNotes.push(`aisle door (${w.aisleDoor})`);
      const doorBays = warehouseRows(w).flatMap(r => r.spots).filter(s => s.isDoor && !s.removed);
      if(doorBays.length) doorNotes.push(`${doorBays.length} bay-door${doorBays.length===1?'':'s'}`);

      html += `<div class="print-warehouse">`;
      html += `<h2>${escapeHtml(w.name)}${w.purpose ? ' — ' + escapeHtml(w.purpose) : ''}${doorNotes.length ? ` <span style="font-weight:400;font-size:11px;">(${escapeHtml(doorNotes.join(', '))})</span>` : ''}</h2>`;

      if(totalBays === 0 && doorBays.length === 0){
        html += `<div class="print-empty">No bays yet in this warehouse.</div>`;
      } else if(hasAisle){
        [...w.right].reverse().forEach((row, i) => {
          const realIdx = w.right.length - 1 - i;
          html += printRowHtml(row, `Right · row ${realIdx+1}`, 'R');
        });
        html += `<div class="print-aisle">Aisle${w.aisleDoor ? ` — door on ${w.aisleDoor}` : ''}</div>`;
        w.left.forEach((row, i) => {
          html += printRowHtml(row, `Left · row ${i+1}`, 'L');
        });
      } else {
        w.left.forEach((row, i) => {
          html += printRowHtml(row, `Row ${i+1}`, '');
        });
      }

      html += `</div>`;
    });

    document.getElementById('printReport').innerHTML = `<div class="print-report">${html}</div>`;
  }

  document.getElementById('printBtn').addEventListener('click', () => {
    buildPrintReport();
    window.print();
  });

  document.getElementById('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `${(state.facilityName || 'yard-plan').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  document.getElementById('importBtn').addEventListener('click', () => {
    document.getElementById('importFile').click();
  });

  function countBaysAndOccupants(st){
    let bays = 0, occ = 0;
    (st.warehouses || []).forEach(w => {
      warehouseRows(w).forEach(r => (r.spots || []).forEach(s => {
        if(s.removed || s.isDoor) return;
        bays++;
        if(s.occupants && s.occupants.length) occ += s.occupants.length;
      }));
    });
    return { bays, occ };
  }

  document.getElementById('importFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = migrate(JSON.parse(reader.result));
        if(!parsed) throw new Error('bad file');

        const applyImport = () => {
          createBackup(); // safety snapshot of what's currently loaded, before we replace it
          state = parsed;
          if(!state.warehouses.find(w => w.id === state.activeWarehouseId)){
            state.activeWarehouseId = state.warehouses[0]?.id;
          }
          bindTypes();
          render(); save();
        };

        const cur = countBaysAndOccupants(state);
        const inc = countBaysAndOccupants(parsed);
        const shrunk = (cur.bays > 3 && inc.bays < cur.bays * 0.7)
          || (cur.occ > 1 && inc.occ < cur.occ * 0.7);

        if(shrunk){
          confirmAction(
            'This file looks smaller than your current data',
            `What's currently loaded has ${cur.bays} bays (${cur.occ} occupied). The file you're importing has ${inc.bays} bays (${inc.occ} occupied). Importing replaces everything currently loaded with this file. A safety backup of your current data is taken first either way — but make sure this is really the file you meant to import.`,
            applyImport
          );
        } else {
          applyImport();
        }
      }catch(err){
        setStatus('import failed — file was not a valid export');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // ---------- search ----------
  function getSearchFilters(){
    const whSel = document.getElementById('searchWhFilter');
    const freeChk = document.getElementById('freeOnlyFilter');
    return {
      warehouseId: whSel ? whSel.value : 'all',
      freeOnly: freeChk ? freeChk.checked : false,
    };
  }

  function populateSearchWhFilter(){
    const sel = document.getElementById('searchWhFilter');
    if(!sel) return;
    const current = sel.value;
    sel.innerHTML = '<option value="all">All warehouses</option>' +
      state.warehouses.map(w => `<option value="${w.id}">${escapeHtml(w.name)}</option>`).join('');
    if([...sel.options].some(o => o.value === current)) sel.value = current;
  }

  function searchAll(query){
    const q = query.trim().toLowerCase();
    const filters = getSearchFilters();
    const hasActiveFilter = filters.warehouseId !== 'all' || filters.freeOnly;
    if(!q && !hasActiveFilter) return [];
    const results = [];
    state.warehouses.forEach(w => {
      if(filters.warehouseId !== 'all' && w.id !== filters.warehouseId) return;
      const hasAisle = w.layout !== 'single';
      const sides = hasAisle ? [['left','Left','L'],['right','Right','R']] : [['left','Row','']];
      sides.forEach(([key, sideName, tagPrefix]) => {
        w[key].forEach((row, rowIdx) => {
          row.spots.forEach((spot, sIdx) => {
            if(spot.removed) return;

            if(filters.freeOnly){
              if(spot.isDoor) return;
              const isFree = !spot.occupants || spot.occupants.length === 0;
              if(!isFree) return;
              const bayHay = [spot.label || '', displayTag(spot, tagPrefix)].join(' ').toLowerCase();
              if(!q || bayHay.includes(q)) results.push({ warehouse: w, spot, sideName, rowIdx, sIdx, tagPrefix, occupant: null });
              return;
            }

            (spot.occupants || []).forEach(o => {
              const hay = [o.name || '', o.reg || '', o.notes || '', o.since || ''].join(' ').toLowerCase();
              if(q && hay.includes(q)) results.push({ warehouse: w, spot, sideName, rowIdx, sIdx, tagPrefix, occupant: o });
            });
            const bayHay = [spot.label || '', displayTag(spot, tagPrefix)].join(' ').toLowerCase();
            if(q && bayHay.includes(q)) results.push({ warehouse: w, spot, sideName, rowIdx, sIdx, tagPrefix, occupant: null });
          });
        });
      });
    });
    return results.slice(0, 30);
  }

  function renderSearchResults(results, query){
    const el = document.getElementById('searchResults');
    const filters = getSearchFilters();
    const hasActiveFilter = filters.warehouseId !== 'all' || filters.freeOnly;
    if(!query.trim() && !hasActiveFilter){
      el.classList.remove('show');
      el.innerHTML = '';
      return;
    }
    if(results.length === 0){
      el.innerHTML = `<div class="search-empty">No matches for "${escapeHtml(query)}"</div>`;
      el.classList.add('show');
      return;
    }
    el.innerHTML = results.map((r, i) => {
      const t = TYPES[r.spot.type] || { color:'#7A7A7A', label:'Unknown' };
      const tag = displayTag(r.spot, r.tagPrefix);
      let who, reg = '';
      if(r.occupant){
        who = r.occupant.name || 'Unnamed';
        reg = r.occupant.reg || '';
      } else if(r.spot.isDoor){
        who = 'Door' + (r.spot.label ? ' — ' + r.spot.label : '');
      } else if(r.spot.occupants && r.spot.occupants.length > 1){
        who = `${r.spot.occupants.length} vehicles in this bay`;
      } else {
        who = r.spot.label ? '(unassigned bay)' : 'Unassigned';
      }
      return `
        <div class="search-result" data-result="${i}">
          <span class="dot" style="background:${t.color}"></span>
          <div class="search-result-main">
            <div class="search-result-name">${escapeHtml(who)}${reg ? ' · ' + escapeHtml(reg) : ''}</div>
            <div class="search-result-meta">${escapeHtml(r.warehouse.name)} · bay ${escapeHtml(tag)} · ${t.label}</div>
          </div>
        </div>
      `;
    }).join('');
    el.classList.add('show');

    el.querySelectorAll('[data-result]').forEach(node => {
      node.addEventListener('click', () => {
        const r = results[parseInt(node.getAttribute('data-result'), 10)];
        jumpToSpot(r.warehouse.id, r.spot.id);
      });
    });
  }

  function jumpToSpot(warehouseId, spotId){
    state.activeWarehouseId = warehouseId;
    render();
    document.getElementById('searchResults').classList.remove('show');
    document.getElementById('searchInput').value = '';
    setTimeout(() => {
      const el = document.querySelector(`[data-spot-id="${spotId}"]`);
      if(el){
        el.scrollIntoView({ behavior:'smooth', block:'center', inline:'center' });
        el.classList.add('jump-highlight');
        setTimeout(() => el.classList.remove('jump-highlight'), 2000);
      }
    }, 60);
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    const results = searchAll(e.target.value);
    renderSearchResults(results, e.target.value);
  });
  function rerunSearch(){
    const val = document.getElementById('searchInput').value;
    renderSearchResults(searchAll(val), val);
  }
  document.getElementById('searchWhFilter').addEventListener('change', rerunSearch);
  document.getElementById('freeOnlyFilter').addEventListener('change', rerunSearch);
  document.addEventListener('click', (e) => {
    if(!e.target.closest('#searchWrap')){
      document.getElementById('searchResults').classList.remove('show');
    }
  });

  // ---------- pin gate ----------
  const PIN_UNLOCK_KEY = 'storage-sites-pin-unlocked';
  const gateEnabled = typeof APP_PIN !== 'undefined' && APP_PIN;

  function showPinGate(){
    document.getElementById('sheet').style.display = 'none';
    const gate = document.getElementById('pinGate');
    gate.style.display = 'flex';
    const input = document.getElementById('pinInput');
    const errorEl = document.getElementById('pinError');
    input.value = '';
    input.focus();

    function tryUnlock(){
      if(input.value === APP_PIN){
        try{ localStorage.setItem(PIN_UNLOCK_KEY, 'yes'); }catch(e){}
        gate.style.display = 'none';
        document.getElementById('sheet').style.display = '';
        load();
      } else {
        errorEl.style.display = 'block';
        input.value = '';
        input.focus();
      }
    }
    document.getElementById('pinSubmitBtn').addEventListener('click', tryUnlock);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') tryUnlock(); });
  }

  if(gateEnabled){
    const lockLine = document.getElementById('lockLine');
    lockLine.style.display = 'block';
    document.getElementById('lockLink').addEventListener('click', (e) => {
      e.preventDefault();
      try{ localStorage.removeItem(PIN_UNLOCK_KEY); }catch(err){}
      location.reload();
    });
    let alreadyUnlocked = false;
    try{ alreadyUnlocked = localStorage.getItem(PIN_UNLOCK_KEY) === 'yes'; }catch(e){}
    if(alreadyUnlocked){
      load();
    } else {
      showPinGate();
    }
  } else {
    load();
  }
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {
        // offline on first-ever load with no cached service worker yet — harmless, just skip
      });
    });
  }
</script>
