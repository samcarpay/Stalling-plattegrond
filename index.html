    <div class="search-filters">
      <select id="searchWhFilter"><option value="all">Alle loodsen</option></select>
      <label class="search-free-toggle"><input type="checkbox" id="freeOnlyFilter" /> Alleen vrije plekken</label>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="wh-tabs" id="whTabsWarehouses" style="margin-top:6px;"></div>

  <div class="wh-purpose" id="whPurpose"></div>

  <div id="plan"></div>

  <div class="legend" id="legend"></div>

  <div class="status-line" id="statusLine">laden…</div>

  <div class="status-line logout-line" id="logoutLine" style="display:none;">Ingelogd als <span id="logoutEmailText"></span> · <a href="#" id="logoutLink" style="color:inherit;">Uitloggen</a></div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        // a home-screen app is often resumed rather than reopened — check for a new version then too
        document.addEventListener('visibilitychange', () => {
          if(document.visibilityState === 'visible') reg.update().catch(() => {});
        });
      }).catch(() => {
        // offline on first-ever load with no cached service worker yet — harmless, just skip
      });
    });

    // When a new version's service worker takes over, reload once so it shows
    // right away. Skipped on the very first install (nothing old to replace),
    // and held back while a modal is open so a half-filled form isn't lost.
    const hadController = !!navigator.serviceWorker.controller;
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if(!hadController || reloading) return;
      reloading = true;
      (function reloadWhenIdle(){
        if(document.getElementById('overlay')?.classList.contains('show')){
          setTimeout(reloadWhenIdle, 2000);
        } else {
          location.reload();
        }
      })();
    });
  }
</script>
