  function autoTag(tagPrefix, seq){
    return `${tagPrefix}${seq}`;
  }
  function displayTag(spot, tagPrefix){
    return (spot.label && spot.label.trim()) ? spot.label.trim() : autoTag(tagPrefix, spot.seq);
  }

  // Finds whether any occupant of this spot also currently holds a bay in
  // ANY other warehouse (matched by objectNummer) — e.g. a customer who
  // moves from Buiten Boven to Buiten Beneden for winter, or from an
  // outdoor bay into a Winter warehouse's aisle. Returns the first match
  // found (warehouse + bay tag), or null if there isn't one, so the badge
  // can show exactly where the customer's other spot is.
  // Loose "is this plausibly the same person" check — handles the natural
  // variation real records have for the same customer (nicknames, only a
  // surname the second time, "Ronald en Greet" vs "Ronald/Greet", etc.)
  // without needing an exact match. Dutch connector words and very short
  // fragments are ignored so they don't cause false matches on their own.
  function namesLikelyMatch(a, b){
    const stopWords = new Set(['en','de','van','vd','v','der','den','het','tot','een']);
    const words = (s) => (s || '').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, ' ').split(/\s+/)
      .filter(w => w.length >= 3 && !stopWords.has(w));
    const wordsA = words(a), wordsB = words(b);
    if(wordsA.length === 0 || wordsB.length === 0) return false;
    return wordsA.some(w => wordsB.includes(w));
  }

  // Checks whether an object nummer is already used elsewhere in a way that
  // should be BLOCKED as a likely mistake. The same object nummer under the
  // same (or plausibly the same) customer name is the normal, intended way
  // to show a customer has a different bay for another season — that's
  // never blocked. It's only blocked when the SAME object nummer turns up
  // under a clearly DIFFERENT name, which is almost certainly a typo.
  // excludeSpotId leaves the bay currently being edited out of the check,
  // since its own pre-save values are about to be overwritten anyway.
  function findBlockingDuplicateObjectNummer(objectNummer, name, kind, excludeSpotId){
    const q = (objectNummer || '').trim().toLowerCase();
    if(!q) return null;
    for(const w of state.warehouses){
      const hasAisle = w.layout !== 'single';
      const sides = hasAisle ? ['left','right'] : ['left'];
      for(const key of sides){
        for(const row of w[key]){
          for(const s of row.spots){
            if(s.removed || s.isDoor || s.id === excludeSpotId) continue;
            if(kind === 'occupant'){
              for(const o of (s.occupants || [])){
                if((o.objectNummer || '').trim().toLowerCase() === q && !namesLikelyMatch(name, o.name)){
                  return { warehouse: w, spot: s, otherName: o.name };
                }
              }
            } else {
              if(s.winterKlant && (s.winterKlant.objectNummer || '').trim().toLowerCase() === q && !namesLikelyMatch(name, s.winterKlant.name)){
                return { warehouse: w, spot: s, otherName: s.winterKlant.name };
              }
            }
          }
        }
      }
    }
    return null;
  }

  function findOccupantElsewhere(spot, excludeWarehouseId){
    const objNums = (spot.occupants || []).map(o => (o.objectNummer || '').trim().toLowerCase()).filter(Boolean);
    if(spot.winterKlant && spot.winterKlant.objectNummer){
      objNums.push(spot.winterKlant.objectNummer.trim().toLowerCase());
    }
    if(objNums.length === 0) return null;
    for(const w of state.warehouses){
      if(w.id === excludeWarehouseId) continue;
      const hasAisle = w.layout !== 'single';
      const sides = hasAisle ? [['left','L'],['right','R']] : [['left','']];
      for(const [key, tagPrefix] of sides){
        for(const row of w[key]){
          for(const s of row.spots){
            if(s.removed || s.isDoor) continue;
            for(const o of (s.occupants || [])){
              if(objNums.includes((o.objectNummer || '').trim().toLowerCase())){
                return { warehouse: w, spot: s, tag: displayTag(s, tagPrefix) };
              }
            }
            if(s.winterKlant && s.winterKlant.objectNummer && objNums.includes(s.winterKlant.objectNummer.trim().toLowerCase())){
              return { warehouse: w, spot: s, tag: displayTag(s, tagPrefix) };
            }
          }
        }
      }
    }
    return null;
  }

  function renderSpot(row, spot, sideName, rowIdx, sIdx, tagPrefix){
    const el = document.createElement('div');
    const w = widthFor(spot.length);
    el.style.width = w + 'px';
    el.setAttribute('data-spot-id', spot.id);
    const tag = displayTag(spot, tagPrefix);

    if(spot.removed){
      el.className = 'spot gap';
      el.title = 'Verwijderde plek — klik om opnieuw te gebruiken';
      el.innerHTML = `
        <div class="spot-del" data-hard-remove="${spot.id}" title="Deze plek permanent verwijderen">✕</div>
        <span class="spot-id" style="align-self:flex-start">${escapeHtml(tag)}</span>
        <span class="gap-label">verwijderd<br/>tik om te hergebruiken</span>
      `;
      el.addEventListener('click', (e) => {
        if(e.target.closest('[data-hard-remove]')) return;
        spot.removed = false;
        render(); save();
      });
      return el;
    }

    if(spot.isDoor){
      el.className = 'spot door';
      el.title = 'Deur — klik om te bewerken';
      el.innerHTML = `
        <div class="spot-del" data-remove-spot="${spot.id}" title="Plek verwijderen">✕</div>
        <span class="spot-id" style="align-self:flex-start">${escapeHtml(tag)}</span>
        <span class="door-label">${doorIconSvg(20)}<br/>${escapeHtml(spot.label && spot.label.trim() ? spot.label.trim() : 'door')}</span>
      `;
      el.addEventListener('click', (e) => {
        if(e.target.closest('[data-remove-spot]')) return;
        openSpotModal(row, spot, sideName, rowIdx, sIdx, tagPrefix);
      });
      return el;
    }

    const wk = spot.winterKlant;
    const wkLabel = wk && (wk.name || wk.objectNummer) ? (wk.name || wk.objectNummer) : null;
    const wkTitle = wk ? `Winterklant: ${wk.name || '(geen naam)'}${wk.objectNummer ? ' · object ' + wk.objectNummer : ''}` : '';
    const wkBadge = wkLabel ? `<div class="winterklant-badge" title="${escapeAttr(wkTitle)}">❄ ${escapeHtml(wkLabel)}</div>` : '';

    if(spot.occupants && spot.occupants.length > 0){
      const t = TYPES[spot.type] || { color:'#7A7A7A', label:'Onbekend' };
      const longStay = spot.occupants.some(o => isLongStay(o.since));
      const anyAway = spot.occupants.some(o => o.away);
      const elsewhere = findOccupantElsewhere(spot, state.activeWarehouseId);
      el.className = 'spot' + (longStay ? ' long-stay' : '') + (anyAway ? ' is-away' : '');
      el.style.background = hexAlpha(t.color, 0.16);
      el.style.borderColor = t.color;
      const multi = spot.occupants.length > 1;
      const primary = multi ? `${spot.occupants.length}× ${t.label}` : (spot.occupants[0].name || 'Naam onbekend');
      const single = spot.occupants[0];
      const sub = multi
        ? spot.occupants.map(o => o.name || 'Naam onbekend').join(', ')
        : [single.reg, single.since].filter(Boolean).join(' · ');
      el.innerHTML = `
        <div class="spot-del" data-clear="${spot.id}" title="Plek leegmaken">✕</div>
        ${longStay ? `<div class="long-stay-badge" title="Langer dan een jaar gestald">⏱</div>` : ''}
        ${anyAway ? `<div class="away-badge" title="Momenteel weg — tijdelijk opgehaald">WEG</div>` : ''}
        ${elsewhere ? `<div class="winter-badge" title="Heeft ook een plek in ${escapeAttr(elsewhere.warehouse.name)}, plek ${escapeAttr(elsewhere.tag)}">❄️</div>` : ''}
        <div class="spot-id">${escapeHtml(tag)}</div>
        <div>
          <div class="spot-label">${escapeHtml(primary)}</div>
          <div class="spot-sub">${escapeHtml(sub)}</div>
        </div>
        <div class="spot-dim">${spot.length}m</div>
        ${wkBadge}
      `;
    } else {
      el.className = 'spot empty';
      el.innerHTML = `
        <div class="spot-del" data-remove-spot="${spot.id}" title="Plek verwijderen">✕</div>
        <span class="plus">+</span>
        ${spot.label ? `<div class="spot-id" style="align-self:flex-start">${escapeHtml(spot.label)}</div>` : ''}
        ${wkBadge}
      `;
    }
    el.addEventListener('click', (e) => {
      if(e.target.closest('[data-clear]') || e.target.closest('[data-remove-spot]')) return;
      if(dragJustHappened){ dragJustHappened = false; return; }
      openSpotModal(row, spot, sideName, rowIdx, sIdx, tagPrefix);
    });
    attachDragToSwap(el, spot.id);
    return el;
  }

  // ---------- press-and-hold drag to swap two bays' contents ----------
  // A quick swipe still scrolls the row normally; only a held-then-moved
  // touch/click picks a bay up, so the two gestures don't fight each other.
  let dragState = null;
  let dragJustHappened = false; // suppresses the click that follows a drag release

  function findSpotById(id){
    for(const w of state.warehouses){
      for(const r of warehouseRows(w)){
        const s = r.spots.find(sp => sp.id === id);
        if(s) return s;
      }
    }
    return null;
  }

  function swapSpotContents(idA, idB){
    const a = findSpotById(idA), b = findSpotById(idB);
    if(!a || !b || a.removed || b.removed || a.isDoor || b.isDoor) return;
    // Only what's PARKED there moves — the bay's own name/number (label, seq)
    // stays put, since that's the physical bay's identity, not the vehicle's.
    const fields = ['type','length','occupants'];
    const tmp = {};
    fields.forEach(f => tmp[f] = a[f]);
    fields.forEach(f => a[f] = b[f]);
    fields.forEach(f => b[f] = tmp[f]);
  }

  function attachDragToSwap(el, spotId){
    el.addEventListener('pointerdown', (e) => {
      if(e.target.closest('.spot-del')) return;
      if(e.pointerType === 'mouse' && e.button !== 0) return;
      // Belt-and-braces alongside the CSS: tell the browser up front not to
      // start its own touch gesture (text selection, callout) for this
      // touch at all, rather than relying only on user-select/touch-action.
      // Touch only — desktop mouse users don't have this problem.
      if(e.pointerType === 'touch') e.preventDefault();
      const startX = e.clientX, startY = e.clientY;
      const pointerId = e.pointerId;
      let cancelled = false;

      const cancelIfMoved = (ev) => {
        if(Math.hypot(ev.clientX - startX, ev.clientY - startY) > 10){
          cancelled = true;
          clearTimeout(timer);
          el.removeEventListener('pointermove', cancelIfMoved);
          el.removeEventListener('pointerup', cancelEarly);
        }
      };
      const cancelEarly = () => {
        cancelled = true;
        clearTimeout(timer);
        el.removeEventListener('pointermove', cancelIfMoved);
        el.removeEventListener('pointerup', cancelEarly);
      };
      el.addEventListener('pointermove', cancelIfMoved);
      el.addEventListener('pointerup', cancelEarly);

      const timer = setTimeout(() => {
        el.removeEventListener('pointermove', cancelIfMoved);
        el.removeEventListener('pointerup', cancelEarly);
        if(cancelled) return;
        startDrag(el, spotId, pointerId, startX, startY);
      }, 450);
    });
  }

  function startDrag(sourceEl, spotId, pointerId, startX, startY){
    try{ sourceEl.setPointerCapture(pointerId); }catch(e){}
    sourceEl.classList.add('dragging');
    // Fully take over touch handling for the duration of the drag — the
    // CSS touch-action:pan-x is only meant for quick swipes before a drag
    // has started; once we're actually dragging, no default gesture
    // (panning in any direction) should be allowed to compete with it.
    // We replace that native panning with our own edge auto-scroll below,
    // so dragging toward the edge of the screen still reaches bays that
    // are currently off-screen.
    const prevTouchAction = sourceEl.style.touchAction;
    sourceEl.style.touchAction = 'none';

    const rect = sourceEl.getBoundingClientRect();
    const ghost = sourceEl.cloneNode(true);
    ghost.className = 'spot drag-ghost';
    ghost.style.width = rect.width + 'px';
    ghost.style.height = rect.height + 'px';
    ghost.style.left = rect.left + 'px';
    ghost.style.top = rect.top + 'px';
    ghost.querySelectorAll('.spot-del').forEach(n => n.remove());
    document.body.appendChild(ghost);

    let currentTarget = null;
    let curX = startX, curY = startY;
    const scrollContainer = sourceEl.closest('.plan-scroll');
    const EDGE_ZONE = 46;      // px from the screen edge that triggers scrolling
    const MAX_SCROLL_SPEED = 16; // px per frame at the very edge
    let scrolling = true;

    function updateGhostPosition(){
      const dx = curX - startX, dy = curY - startY;
      ghost.style.transform = `translate(${dx}px, ${dy}px) scale(1.06)`;
    }

    function updateDropTarget(){
      ghost.style.display = 'none';
      const under = document.elementFromPoint(curX, curY);
      ghost.style.display = '';
      const targetEl = under ? under.closest('.spot:not(.gap):not(.door)') : null;

      if(targetEl !== currentTarget){
        if(currentTarget) currentTarget.classList.remove('drop-target');
        if(targetEl && targetEl !== sourceEl) targetEl.classList.add('drop-target');
        currentTarget = (targetEl && targetEl !== sourceEl) ? targetEl : null;
      }
    }

    function autoScrollStep(){
      if(!scrolling) return;
      if(scrollContainer){
        const r = scrollContainer.getBoundingClientRect();
        let dx = 0;
        if(curX < r.left + EDGE_ZONE){
          dx = -MAX_SCROLL_SPEED * Math.min(1, (r.left + EDGE_ZONE - curX) / EDGE_ZONE);
        } else if(curX > r.right - EDGE_ZONE){
          dx = MAX_SCROLL_SPEED * Math.min(1, (curX - (r.right - EDGE_ZONE)) / EDGE_ZONE);
        }
        if(dx !== 0){
          scrollContainer.scrollLeft += dx;
          // Content shifts under a finger that may not be moving right now
          // (it's just sitting in the edge zone) — re-check what's under it.
          updateDropTarget();
        }
      }
      requestAnimationFrame(autoScrollStep);
    }
    requestAnimationFrame(autoScrollStep);

    function onMove(e){
      e.preventDefault();
      curX = e.clientX; curY = e.clientY;
      updateGhostPosition();
      updateDropTarget();
    }

    function cleanup(){
      scrolling = false;
      sourceEl.removeEventListener('pointermove', onMove);
      sourceEl.removeEventListener('pointerup', onUp);
      sourceEl.removeEventListener('pointercancel', onCancel);
      sourceEl.classList.remove('dragging');
      sourceEl.style.touchAction = prevTouchAction;
      if(currentTarget) currentTarget.classList.remove('drop-target');
      ghost.remove();
    }

    function onUp(e){
      const target = currentTarget;
      cleanup();
      if(target){
        const targetId = target.getAttribute('data-spot-id');
        swapSpotContents(spotId, targetId);
        dragJustHappened = true;
        setTimeout(() => { dragJustHappened = false; }, 300);
        render(); save();
      }
    }

    function onCancel(){
      cleanup();
    }

    sourceEl.addEventListener('pointermove', onMove, { passive: false });
    sourceEl.addEventListener('pointerup', onUp, { passive: false });
    sourceEl.addEventListener('pointercancel', onCancel, { passive: false });
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s){ return escapeHtml(s); }

  function doorIconSvg(size){
    return `<svg viewBox="0 0 16 16" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.3" style="display:inline-block;vertical-align:middle;flex-shrink:0;">
      <rect x="3" y="1.3" width="10" height="13.4" rx="0.6"/>

  function typeOrderFor(w){
    const keys = Object.keys(TYPES);
    if(!w.recommended) return keys;
    return [...w.recommended, ...keys.filter(k => !w.recommended.includes(k))];
  }

          <div class="type-row" id="typeRow">

              const t = TYPES[key];
              const active = spot.type===key;
              const styleAttr = active ? ` style="border-color:${t.color};background:${hexAlpha(t.color,0.14)};color:${t.color}"` : '';
              return `<div class="type-chip ${active?'active':''}" data-type="${key}"${styleAttr}>${escapeHtml(t.label)}</div>`;
            }).join('')}
          </div>
        </div>
        <div class="field">
          <label>Lengte (m)</label>
          <input type="number" id="fLength" min="2" max="15" step="0.1" value="${spot.length}" />
        </div>
        <div class="field">
          <label>Voertuigen op deze plek</label>
          <div class="occ-list" id="occList"></div>
          <button class="btn ghost small" id="addOccBtn">+ Nog een voertuig op deze plek</button>
        </div>
        <div class="field">
          <label>Winterklant (optioneel)</label>
          <div class="sub" style="margin:-2px 0 8px;">Voor als een andere klant deze plek tijdelijk gebruikt tijdens de winter — alleen naam en object nummer, geen apart voertuig nodig.</div>
          <div style="display:flex;gap:6px;">
            <input type="text" id="fWinterName" placeholder="Naam winterklant" value="${escapeAttr(spot.winterKlant.name)}" style="flex:2;" />
            <input type="text" id="fWinterObjNum" placeholder="Object nummer" value="${escapeAttr(spot.winterKlant.objectNummer)}" style="flex:1;" />
          </div>
        </div>
      </div>
      <div class="modal-actions">
        ${isEditing ? '<button class="btn danger" id="clearBtn">Plek leegmaken</button>' : ''}
        <button class="btn ghost" id="cancelBtn">Annuleren</button>
        <button class="btn" id="saveBtn">Opslaan</button>
      </div>
      <div id="spotSaveError" style="display:none;color:var(--car);font-size:12px;margin-top:10px;"></div>
    `;

    function renderOccList(){
      const listEl = document.getElementById('occList');
      listEl.innerHTML = occDraft.map((o, idx) => `
        <div class="occ-row" data-occ-idx="${idx}">
          <div class="occ-row-top">
            <input type="text" class="occ-name" placeholder="Naam eigenaar / klant" value="${escapeAttr(o.name)}" />
            <input type="text" class="occ-reg" placeholder="Kenteken" value="${escapeAttr(o.reg)}" />
            <input type="date" class="occ-since" value="${escapeAttr(o.since)}" title="Gestald sinds" />
            <button class="occ-remove" data-remove-occ="${idx}" title="Dit voertuig verwijderen">✕</button>
          </div>
          <div class="occ-row-contact">
            <input type="tel" class="occ-phone" placeholder="Telefoonnummer" value="${escapeAttr(o.phone)}" />
            <input type="email" class="occ-email" placeholder="E-mailadres" value="${escapeAttr(o.email)}" />
          </div>
          <input type="text" class="occ-objnum" placeholder="Object nummer (komt overeen met aanvragen)" value="${escapeAttr(o.objectNummer)}" style="margin-bottom:6px;" />
          <input type="text" class="occ-notes" placeholder="Notities" value="${escapeAttr(o.notes)}" />
          <label class="occ-away-toggle"><input type="checkbox" class="occ-away" ${o.away?'checked':''} /> Momenteel weg (tijdelijk opgehaald, plek blijft gereserveerd)</label>
        </div>
      `).join('');
      listEl.querySelectorAll('.occ-row').forEach(rowEl => {
        const idx = parseInt(rowEl.getAttribute('data-occ-idx'), 10);
        rowEl.querySelector('.occ-name').addEventListener('input', (e) => { occDraft[idx].name = e.target.value; });
        rowEl.querySelector('.occ-reg').addEventListener('input', (e) => { occDraft[idx].reg = e.target.value; });
        rowEl.querySelector('.occ-since').addEventListener('input', (e) => { occDraft[idx].since = e.target.value; });
        rowEl.querySelector('.occ-phone').addEventListener('input', (e) => { occDraft[idx].phone = e.target.value; });
        rowEl.querySelector('.occ-email').addEventListener('input', (e) => { occDraft[idx].email = e.target.value; });
        rowEl.querySelector('.occ-objnum').addEventListener('input', (e) => { occDraft[idx].objectNummer = e.target.value; });
        rowEl.querySelector('.occ-notes').addEventListener('input', (e) => { occDraft[idx].notes = e.target.value; });
        rowEl.querySelector('.occ-away').addEventListener('change', (e) => { occDraft[idx].away = e.target.checked; });
        rowEl.querySelector('.occ-remove').addEventListener('click', () => {
          occDraft.splice(idx, 1);
          if(occDraft.length === 0) occDraft.push({ name:'', reg:'', since:'', notes:'', away:false, objectNummer:'', email:'', phone:'' });
          renderOccList();
        });
      });
    }
    renderOccList();

    document.getElementById('addOccBtn').addEventListener('click', () => {
      occDraft.push({ name:'', reg:'', since:'', notes:'', away:false, objectNummer:'', email:'', phone:'' });
      renderOccList();
    });

    document.getElementById('fIsDoor').addEventListener('change', (e) => {
      document.getElementById('storageFields').style.display = e.target.checked ? 'none' : '';
    });

    let selectedType = spot.type;
    body.querySelectorAll('.type-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        selectedType = chip.getAttribute('data-type');
        body.querySelectorAll('.type-chip').forEach(c => {
          c.classList.remove('active');
          c.style.borderColor = ''; c.style.background = ''; c.style.color = '';
        });
        const t = TYPES[selectedType];
        chip.classList.add('active');
        chip.style.borderColor = t.color;
        chip.style.background = hexAlpha(t.color, 0.14);
        chip.style.color = t.color;
        document.getElementById('fLength').value = t.length;
      });
    });

    document.getElementById('manageTypesLink').addEventListener('click', (e) => {
      e.preventDefault();
      closeModal();
      openManageTypesModal();
    });

    overlay.classList.add('show');

    document.getElementById('cancelBtn').addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); }, { once:true });

    if(isEditing){
      document.getElementById('clearBtn').addEventListener('click', () => {
        spot.occupants = [];
        spot.isDoor = false;
        closeModal(); render(); save();
      });
    }

    document.getElementById('saveBtn').addEventListener('click', () => {
      const errorEl = document.getElementById('spotSaveError');
      errorEl.style.display = 'none';

      const isDoor = document.getElementById('fIsDoor').checked;
      const winterObjNum = document.getElementById('fWinterObjNum').value.trim();

      // Validate object nummers before committing any changes to the spot.
      if(!isDoor){
        const seenInDraft = new Set();
        for(const o of occDraft){
          const num = o.objectNummer.trim();
          if(!num) continue;
          const key = num.toLowerCase();
          if(seenInDraft.has(key)){
            errorEl.textContent = `Object nummer "${num}" staat hier al bij een ander voertuig op dezelfde plek.`;
            errorEl.style.display = 'block';
            return;
          }
          seenInDraft.add(key);
          const dup = findBlockingDuplicateObjectNummer(num, o.name, 'occupant', spot.id);
          if(dup){
            errorEl.textContent = `Object nummer "${num}" is al in gebruik door "${dup.otherName || 'iemand anders'}" bij een andere plek (${dup.warehouse.name}). Klopt de naam niet, controleer het nummer — is dit wel dezelfde klant, pas dan de naam aan zodat ze overeenkomen.`;
            errorEl.style.display = 'block';
            return;
          }
        }
      }
      if(winterObjNum){
        const winterName = document.getElementById('fWinterName').value.trim();
        const dup = findBlockingDuplicateObjectNummer(winterObjNum, winterName, 'winterKlant', spot.id);
        if(dup){
          errorEl.textContent = `Object nummer "${winterObjNum}" is al in gebruik door "${dup.otherName || 'iemand anders'}" als Winterklant bij een andere plek (${dup.warehouse.name}).`;
          errorEl.style.display = 'block';
          return;
        }
      }

      const label = document.getElementById('fLabel').value.trim();
      spot.label = label;
      spot.isDoor = isDoor;

      if(isDoor){
        spot.occupants = [];
      } else {
        const length = parseFloat(document.getElementById('fLength').value) || TYPES[selectedType].length;
        spot.type = selectedType;
        spot.length = length;
        spot.occupants = occDraft
          .map(o => ({ name:o.name.trim(), reg:o.reg.trim(), since:o.since.trim(), notes:o.notes.trim(), away:!!o.away, objectNummer:o.objectNummer.trim(), email:o.email.trim(), phone:o.phone.trim() }))
          .filter(o => o.name || o.reg || o.notes || o.objectNummer || o.email || o.phone);
      }

      spot.winterKlant = {
        name: document.getElementById('fWinterName').value.trim(),
        objectNummer: document.getElementById('fWinterObjNum').value.trim(),
      };

      const placedId = pendingPlacementAanvraagId;
      closeModal(); render(); save();

      if(placedId && contractDb){
        contractDb.collection('aanvragen').doc(placedId).update({ geplaatstInStorageSites: true })
          .catch((err) => console.error('Kon aanvraag niet als geplaatst markeren', err));
      }
    });
  }

  function closeModal(){
    document.getElementById('overlay').classList.remove('show');
    pendingPlacementAanvraagId = null;
  }

  // ---------- reusable confirm dialog for destructive actions ----------
  function confirmAction(title, message, onConfirm){
    const overlay = document.getElementById('overlay');
    const body = document.getElementById('modalBody');
    body.className = 'modal';
    body.innerHTML = `
      <h3>${escapeHtml(title)}</h3>
      <div class="sub">${escapeHtml(message)}</div>
      <div class="modal-actions">
        <button class="btn ghost" id="confirmCancelBtn">Annuleren</button>
        <button class="btn danger" id="confirmYesBtn">Verwijderen</button>
      </div>
    `;
    overlay.classList.add('show');
    document.getElementById('confirmCancelBtn').addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); }, { once:true });
    document.getElementById('confirmYesBtn').addEventListener('click', () => {
      closeModal();
      onConfirm();
    });
  }

      body.innerHTML = `

        if(!label){ labelInp.focus(); return; }
        const length = parseFloat(lengthInp.value) || 5;
        const key = slugify(label, Object.keys(TYPES));
        TYPES[key] = { label, color: colorInp.value, length };
        save();
        renderRows();
      });

      body.querySelector('#doneTypesBtn').addEventListener('click', () => {
        body.className = 'modal';
        closeModal();
        render();
      });
    }

    renderRows();
    overlay.classList.add('show');
    overlay.addEventListener('click', (e) => {
      if(e.target === overlay){ body.className = 'modal'; closeModal(); render(); }
    }, { once:true });
  }

  document.getElementById('manageTypesBtn').addEventListener('click', openManageTypesModal);
  document.getElementById('backupsBtn').addEventListener('click', openBackupsModal);
  if(typeof BLOCKED_DATES_PATH !== 'undefined' && BLOCKED_DATES_PATH){
    document.getElementById('blockedDatesBtn').style.display = '';
    document.getElementById('blockedDatesBtn').addEventListener('click', openBlockedDatesModal);
  }

  // ---------- global click handling ----------
  document.addEventListener('click', (e) => {
    const addSpotBtn = e.target.closest('[data-add-spot]');
    if(addSpotBtn){
      e.stopPropagation();
      openAddBayModal(addSpotBtn.getAttribute('data-add-spot'));
      return;
    }
    const clearBtn = e.target.closest('[data-clear]');
    if(clearBtn){
      const id = clearBtn.getAttribute('data-clear');
      const spot = allSpots().find(s => s.id === id);
      if(spot){ spot.occupants = []; render(); save(); }
      return;
    }
    const removeSpotBtn = e.target.closest('[data-remove-spot]');
    if(removeSpotBtn){
      const id = removeSpotBtn.getAttribute('data-remove-spot');
      warehouseRows(activeWarehouse()).forEach(r => {
        const s = r.spots.find(sp => sp.id === id);
        if(s){ s.removed = true; s.occupants = []; s.isDoor = false; }
      });
      render(); save();
      return;
    }
    const hardRemoveBtn = e.target.closest('[data-hard-remove]');
    if(hardRemoveBtn){
      const id = hardRemoveBtn.getAttribute('data-hard-remove');
      confirmAction(
        'Deze plek verwijderen?',
        `Dit verwijdert de plek permanent van de plattegrond (in tegenstelling tot "verwijderen" kan hij daarna niet meer worden hergebruikt). Dit kan niet ongedaan worden gemaakt.`,
        () => {
          warehouseRows(activeWarehouse()).forEach(r => { r.spots = r.spots.filter(s => s.id !== id); });
          render(); save();
        }
      );
      return;
    }
    const addRowBtn = e.target.closest('[data-add-row]');
    if(addRowBtn){
      const side = addRowBtn.getAttribute('data-add-row');
      activeWarehouse()[side].push(emptyRow());
      render(); save();
      return;
    }
    const removeRowBtn = e.target.closest('[data-remove-row]');
    if(removeRowBtn){
      const side = removeRowBtn.getAttribute('data-remove-row');
      const w = activeWarehouse();
      if(w[side].length > 1){
        const lastRow = w[side][w[side].length - 1];
        const doIt = () => { w[side].pop(); render(); save(); };
        if(lastRow.spots.length > 0){
          confirmAction(
            'Deze rij verwijderen?',
            `Dit verwijdert de rij en alle ${lastRow.spots.length} plek${lastRow.spots.length===1?'':'ken'} erin, inclusief eventuele bewoners. Dit kan niet ongedaan worden gemaakt.`,
            doIt
          );
        } else {
          doIt();
        }
      }
      return;
    }
    const editWhBtn = e.target.closest('[data-edit-wh]');
    if(editWhBtn){
      e.stopPropagation();
      openRenameWarehouseModal(editWhBtn.getAttribute('data-edit-wh'));
      return;
    }
    const moveWhBtn = e.target.closest('[data-move-wh]');
    if(moveWhBtn){
      e.stopPropagation();
      const id = moveWhBtn.getAttribute('data-move-wh');
      const dir = parseInt(moveWhBtn.getAttribute('data-dir'), 10);
      const idx = state.warehouses.findIndex(w => w.id === id);
      const swapIdx = idx + dir;
      if(idx === -1 || swapIdx < 0 || swapIdx >= state.warehouses.length) return;
      const tmp = state.warehouses[idx];
      state.warehouses[idx] = state.warehouses[swapIdx];
      state.warehouses[swapIdx] = tmp;
      renderTabs();
      save();
      return;
    }
    const delWhBtn = e.target.closest('[data-del-wh]');
    if(delWhBtn){
      e.stopPropagation();
      if(state.warehouses.length <= 1) return;
      const id = delWhBtn.getAttribute('data-del-wh');
      const wh = state.warehouses.find(w => w.id === id);
      confirmAction(
        'Loods verwijderen?',
        `Dit verwijdert "${wh ? wh.name : 'deze loods'}" en alles wat erin is opgeslagen — plekken, bewoners, alles. Dit kan niet ongedaan worden gemaakt.`,
        () => {
          const removingActive = id === state.activeWarehouseId;
          state.warehouses = state.warehouses.filter(w => w.id !== id);
          if(removingActive) state.activeWarehouseId = state.warehouses[0].id;
          render(); save();
        }
      );
      return;
    }
    const addWhBtn = e.target.closest('#addWarehouseBtn');
    if(addWhBtn){
      const wh = defaultWarehouse({ name:`Loods ${state.warehouses.length + 1}`, left:1, right:1 });
      state.warehouses.push(wh);
      state.activeWarehouseId = wh.id;
      render(); save();
      return;
    }
  });

  document.getElementById('facilityName').addEventListener('input', (e) => {
    state.facilityName = e.target.value;
    save();
  });

  // ---------- print-friendly report ----------
  function printBayBoxHtml(spot, tagPrefix){
    if(spot.removed) return '';
    const tag = displayTag(spot, tagPrefix);

    if(spot.isDoor){
      return `
        <div class="print-bay-box print-door">
          ${doorIconSvg(14)}
          <div class="pbb-tag">${escapeHtml(tag)}</div>
          <div class="pbb-sub">deur</div>
        </div>
      `;
    }

    const t = TYPES[spot.type] || { label: 'Onbekend' };
    if(!spot.occupants || spot.occupants.length === 0){
      return `
        <div class="print-bay-box print-empty-box">
          <div class="pbb-tag">${escapeHtml(tag)}</div>
          <div class="pbb-sub">${escapeHtml(t.label)}<br/>leeg</div>
        </div>
      `;
    }

    const names = spot.occupants.map(o => o.name || 'Naam onbekend').join(', ');
    const single = spot.occupants.length === 1 ? spot.occupants[0] : null;
    const multiNotes = !single ? spot.occupants.filter(o => o.notes).map(o => `${o.name || 'Naam onbekend'}: ${o.notes}`) : [];
    return `
      <div class="print-bay-box">
        <div class="pbb-tag">${escapeHtml(tag)}</div>
        <div class="pbb-type">${escapeHtml(t.label)}${spot.occupants.length > 1 ? ` ×${spot.occupants.length}` : ''}</div>
        <div class="pbb-name">${escapeHtml(names)}</div>
        ${single && single.reg ? `<div class="pbb-reg">${escapeHtml(single.reg)}</div>` : ''}
        ${single && single.since ? `<div class="pbb-since">sinds ${escapeHtml(single.since)}</div>` : ''}
        ${single && single.phone ? `<div class="pbb-since">${escapeHtml(single.phone)}</div>` : ''}
        ${single && single.notes ? `<div class="pbb-notes">${escapeHtml(single.notes)}</div>` : ''}
        ${multiNotes.length ? `<div class="pbb-notes">${escapeHtml(multiNotes.join(' · '))}</div>` : ''}
      </div>
    `;
  }

  function printRowHtml(row, label, tagPrefix){
    if(row.spots.filter(s => !s.removed).length === 0) return '';
    return `
      <div class="print-row-label">${escapeHtml(label)}</div>
      <div class="print-row">${row.spots.map(s => printBayBoxHtml(s, tagPrefix)).join('')}</div>
    `;
  }

  function buildPrintReport(){
    const spots = allSpotsGlobal();
    const occupied = spots.filter(s => s.occupants && s.occupants.length > 0).length;
    const stamp = new Date().toLocaleDateString();

    let html = `
      <h1>${escapeHtml(state.facilityName || 'Opslagsites')}</h1>
      <div class="print-meta">Afgedrukt op ${escapeHtml(stamp)}</div>
      <div class="print-summary">
        <div><strong>${spots.length}</strong> plekken</div>
        <div><strong>${occupied}</strong> in gebruik</div>
        <div><strong>${spots.length - occupied}</strong> vrij</div>
      </div>
    `;

    state.warehouses.forEach(w => {
      const hasAisle = w.layout !== 'single';
      const totalBays = warehouseSpots(w).length;

      const doorNotes = [];
      if(w.aisleDoor) doorNotes.push(`deur op pad (${w.aisleDoor === 'left' ? 'links' : 'rechts'})`);
      const doorBays = warehouseRows(w).flatMap(r => r.spots).filter(s => s.isDoor && !s.removed);
      if(doorBays.length) doorNotes.push(`${doorBays.length} deur${doorBays.length===1?'':'en'} op plek`);

      html += `<div class="print-warehouse">`;
      html += `<h2>${escapeHtml(w.name)}${w.purpose ? ' — ' + escapeHtml(w.purpose) : ''}${doorNotes.length ? ` <span style="font-weight:400;font-size:11px;">(${escapeHtml(doorNotes.join(', '))})</span>` : ''}</h2>`;

      if(totalBays === 0 && doorBays.length === 0){
        html += `<div class="print-empty">Nog geen plekken in deze loods.</div>`;
      } else if(hasAisle){
        [...w.right].reverse().forEach((row, i) => {
          const realIdx = w.right.length - 1 - i;
          html += printRowHtml(row, `Rechts · rij ${realIdx+1}`, 'R');
        });
        html += `<div class="print-aisle">Pad${w.aisleDoor ? ` — deur ${w.aisleDoor === 'left' ? 'links' : 'rechts'}` : ''}</div>`;
        w.left.forEach((row, i) => {
          html += printRowHtml(row, `Links · rij ${i+1}`, 'L');
        });
      } else {
        w.left.forEach((row, i) => {
          html += printRowHtml(row, `Rij ${i+1}`, '');
        });
      }

      html += `</div>`;
    });

    document.getElementById('printReport').innerHTML = `<div class="print-report">${html}</div>`;
  }

  document.getElementById('printBtn').addEventListener('click', () => {
    buildPrintReport();
    window.print();
  });

  document.getElementById('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `${(state.facilityName || 'yard-plan').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  document.getElementById('importBtn').addEventListener('click', () => {
    document.getElementById('importFile').click();
  });

  function countBaysAndOccupants(st){
    let bays = 0, occ = 0;
    (st.warehouses || []).forEach(w => {
      warehouseRows(w).forEach(r => (r.spots || []).forEach(s => {
        if(s.removed || s.isDoor) return;
        bays++;
        if(s.occupants && s.occupants.length) occ += s.occupants.length;
      }));
    });
    return { bays, occ };
  }

  document.getElementById('importFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = migrate(JSON.parse(reader.result));
        if(!parsed) throw new Error('bad file');

        const applyImport = () => {
          createBackup(); // safety snapshot of what's currently loaded, before we replace it
          state = parsed;
          if(!state.warehouses.find(w => w.id === state.activeWarehouseId)){
            state.activeWarehouseId = state.warehouses[0]?.id;
          }
          bindTypes();
          render(); save();
        };

        const cur = countBaysAndOccupants(state);
        const inc = countBaysAndOccupants(parsed);
        const shrunk = (cur.bays > 3 && inc.bays < cur.bays * 0.7)
          || (cur.occ > 1 && inc.occ < cur.occ * 0.7);

        if(shrunk){
          confirmAction(
            'Dit bestand lijkt kleiner dan je huidige gegevens',
            `Wat er nu geladen is heeft ${cur.bays} plekken (${cur.occ} in gebruik). Het bestand dat je importeert heeft ${inc.bays} plekken (${inc.occ} in gebruik). Importeren vervangt alles wat nu geladen is door dit bestand. Er wordt hoe dan ook eerst een veiligheidsback-up van je huidige gegevens gemaakt — maar controleer of dit echt het bedoelde bestand is.`,
            applyImport
          );
        } else {
          applyImport();
        }
      }catch(err){
        setStatus('importeren mislukt — bestand was geen geldige export');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // ---------- search ----------
  function getSearchFilters(){
    const whSel = document.getElementById('searchWhFilter');
    const freeChk = document.getElementById('freeOnlyFilter');
    return {
      warehouseId: whSel ? whSel.value : 'all',
      freeOnly: freeChk ? freeChk.checked : false,
    };
  }

  function populateSearchWhFilter(){
    const sel = document.getElementById('searchWhFilter');
    if(!sel) return;
    const current = sel.value;
    sel.innerHTML = '<option value="all">Alle loodsen</option>' +
      state.warehouses.map(w => `<option value="${w.id}">${escapeHtml(w.name)}</option>`).join('');
    if([...sel.options].some(o => o.value === current)) sel.value = current;
  }

  // Independent of the main search bar's filters (warehouse/free-only) —
  // used only by the "Link to bay" modal, always searching occupied bays.
  function searchOccupiedBaysForLink(query){
    const q = query.trim().toLowerCase();
    if(!q) return [];
    const results = [];
    state.warehouses.forEach(w => {
      const hasAisle = w.layout !== 'single';
      const sides = hasAisle ? [['left','L'],['right','R']] : [['left','']];
      sides.forEach(([key, tagPrefix]) => {
        w[key].forEach(row => {
          row.spots.forEach(spot => {
            if(spot.removed || spot.isDoor) return;
            (spot.occupants || []).forEach(o => {
              const hay = [o.name || '', o.reg || '', o.notes || '', o.objectNummer || '', o.email || '', o.phone || ''].join(' ').toLowerCase();
              if(hay.includes(q)) results.push({ warehouse: w, spot, tagPrefix, occupant: o });
            });
          });
        });
      });
    });
    return results.slice(0, 20);
  }

  function searchAll(query){
    const q = query.trim().toLowerCase();
    const filters = getSearchFilters();
    const hasActiveFilter = filters.warehouseId !== 'all' || filters.freeOnly;
    if(!q && !hasActiveFilter) return [];
    const results = [];
    state.warehouses.forEach(w => {
      if(filters.warehouseId !== 'all' && w.id !== filters.warehouseId) return;
      const hasAisle = w.layout !== 'single';
      const sides = hasAisle ? [['left','Links','L'],['right','Rechts','R']] : [['left','Rij','']];
      sides.forEach(([key, sideName, tagPrefix]) => {
        w[key].forEach((row, rowIdx) => {
          row.spots.forEach((spot, sIdx) => {
            if(spot.removed) return;

            if(filters.freeOnly){
              if(spot.isDoor) return;
              const isFree = !spot.occupants || spot.occupants.length === 0;
              if(!isFree) return;
              const bayHay = [spot.label || '', displayTag(spot, tagPrefix)].join(' ').toLowerCase();
              if(!q || bayHay.includes(q)) results.push({ warehouse: w, spot, sideName, rowIdx, sIdx, tagPrefix, occupant: null });
              return;
            }

            (spot.occupants || []).forEach(o => {
              const hay = [o.name || '', o.reg || '', o.notes || '', o.since || '', o.objectNummer || '', o.email || '', o.phone || ''].join(' ').toLowerCase();
              if(q && hay.includes(q)) results.push({ warehouse: w, spot, sideName, rowIdx, sIdx, tagPrefix, occupant: o });
            });
            if(spot.winterKlant && (spot.winterKlant.name || spot.winterKlant.objectNummer)){
              const wkHay = [spot.winterKlant.name || '', spot.winterKlant.objectNummer || ''].join(' ').toLowerCase();
              if(q && wkHay.includes(q)){
                results.push({ warehouse: w, spot, sideName, rowIdx, sIdx, tagPrefix, occupant: { name: `❄ Winterklant: ${spot.winterKlant.name || spot.winterKlant.objectNummer}`, reg: '' } });
              }
            }
            const bayHay = [spot.label || '', displayTag(spot, tagPrefix)].join(' ').toLowerCase();
            if(q && bayHay.includes(q)) results.push({ warehouse: w, spot, sideName, rowIdx, sIdx, tagPrefix, occupant: null });
          });
        });
      });
    });
    return results.slice(0, 30);
  }

  function renderSearchResults(results, query){
    const el = document.getElementById('searchResults');
    const filters = getSearchFilters();
    const hasActiveFilter = filters.warehouseId !== 'all' || filters.freeOnly;
    if(!query.trim() && !hasActiveFilter){
      el.classList.remove('show');
      el.innerHTML = '';
      return;
    }
    if(results.length === 0){
      el.innerHTML = `<div class="search-empty">Geen resultaten voor "${escapeHtml(query)}"</div>`;
      el.classList.add('show');
      return;
    }
    el.innerHTML = results.map((r, i) => {
      const t = TYPES[r.spot.type] || { color:'#7A7A7A', label:'Onbekend' };
      const tag = displayTag(r.spot, r.tagPrefix);
      let who, reg = '';
      if(r.occupant){
        who = r.occupant.name || 'Naam onbekend';
        reg = r.occupant.reg || '';
      } else if(r.spot.isDoor){
        who = 'Deur' + (r.spot.label ? ' — ' + r.spot.label : '');
      } else if(r.spot.occupants && r.spot.occupants.length > 1){
        who = `${r.spot.occupants.length} voertuigen op deze plek`;
      } else {
        who = r.spot.label ? '(niet-toegewezen plek)' : 'Niet toegewezen';
      }
      return `
        <div class="search-result" data-result="${i}">
          <span class="dot" style="background:${t.color}"></span>
          <div class="search-result-main">
            <div class="search-result-name">${escapeHtml(who)}${reg ? ' · ' + escapeHtml(reg) : ''}</div>
            <div class="search-result-meta">${escapeHtml(r.warehouse.name)} · plek ${escapeHtml(tag)} · ${t.label}</div>
          </div>
        </div>
      `;
    }).join('');
    el.classList.add('show');

    el.querySelectorAll('[data-result]').forEach(node => {
      node.addEventListener('click', () => {
        const r = results[parseInt(node.getAttribute('data-result'), 10)];
        jumpToSpot(r.warehouse.id, r.spot.id);
      });
    });
  }

  function jumpToSpot(warehouseId, spotId){
    state.activeWarehouseId = warehouseId;
    render();
    document.getElementById('searchResults').classList.remove('show');
    document.getElementById('searchInput').value = '';
    setTimeout(() => {
      const el = document.querySelector(`[data-spot-id="${spotId}"]`);
      if(el){
        el.scrollIntoView({ behavior:'smooth', block:'center', inline:'center' });
        el.classList.add('jump-highlight');
        setTimeout(() => el.classList.remove('jump-highlight'), 2000);
      }
    }, 60);
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    const results = searchAll(e.target.value);
    renderSearchResults(results, e.target.value);
  });
  function rerunSearch(){
    const val = document.getElementById('searchInput').value;
    renderSearchResults(searchAll(val), val);
  }
  document.getElementById('searchWhFilter').addEventListener('change', rerunSearch);
  document.getElementById('freeOnlyFilter').addEventListener('change', rerunSearch);
  document.addEventListener('click', (e) => {
    if(!e.target.closest('#searchWrap')){
      document.getElementById('searchResults').classList.remove('show');
    }
  });

  // ---------- pin gate ----------
  const PIN_UNLOCK_KEY = 'storage-sites-pin-unlocked';
  const gateEnabled = !useRealLogin && typeof APP_PIN !== 'undefined' && APP_PIN;

  function showPinGate(){
    document.getElementById('sheet').style.display = 'none';
    const gate = document.getElementById('pinGate');
    gate.style.display = 'flex';
    const input = document.getElementById('pinInput');
    const errorEl = document.getElementById('pinError');
    input.value = '';
    input.focus();

    function tryUnlock(){
      if(input.value === APP_PIN){
        try{ localStorage.setItem(PIN_UNLOCK_KEY, 'yes'); }catch(e){}
        gate.style.display = 'none';
        document.getElementById('sheet').style.display = '';
        load();
      } else {
        errorEl.style.display = 'block';
        input.value = '';
        input.focus();
      }
    }
    document.getElementById('pinSubmitBtn').addEventListener('click', tryUnlock);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') tryUnlock(); });
  }

  // ---------- real login (email/password via Firebase Authentication) ----------
  function showLoginGate(){
    initFirebaseAppOnce();
    let hasLoadedOnce = false;
    let hasSeenFirstState = false;

    firebase.auth().onAuthStateChanged((user) => {
      const gate = document.getElementById('loginGate');
      if(user){
        gate.style.display = 'none';
        document.getElementById('sheet').style.display = '';
        const logoutLine = document.getElementById('logoutLine');
        logoutLine.style.display = 'block';
        document.getElementById('logoutEmailText').textContent = user.email || '';
        hasSeenFirstState = true;
        if(!hasLoadedOnce){
          hasLoadedOnce = true;
          load();
        }
      } else {
        if(hasSeenFirstState){
          // was logged in, just signed out — cleanest way back to a fresh gate
          location.reload();
          return;
        }
        hasSeenFirstState = true;
        document.getElementById('sheet').style.display = 'none';
        gate.style.display = 'flex';
        document.getElementById('loginEmailInput').focus();
      }
    });

    function tryLogin(){
      const email = document.getElementById('loginEmailInput').value.trim();
      const password = document.getElementById('loginPasswordInput').value;
      const errorEl = document.getElementById('loginError');
      errorEl.style.display = 'none';
      firebase.auth().signInWithEmailAndPassword(email, password).catch((err) => {
        console.error('Login failed', err);
        errorEl.style.display = 'block';
      });
    }
    document.getElementById('loginSubmitBtn').addEventListener('click', tryLogin);
    document.getElementById('loginPasswordInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') tryLogin(); });
    document.getElementById('logoutLink').addEventListener('click', (e) => {
      e.preventDefault();
      firebase.auth().signOut();
    });
  }

  if(useRealLogin){
    showLoginGate();
  } else if(gateEnabled){
    const lockLine = document.getElementById('lockLine');
    lockLine.style.display = 'block';
    document.getElementById('lockLink').addEventListener('click', (e) => {
      e.preventDefault();
      try{ localStorage.removeItem(PIN_UNLOCK_KEY); }catch(err){}
      location.reload();
    });
    let alreadyUnlocked = false;
    try{ alreadyUnlocked = localStorage.getItem(PIN_UNLOCK_KEY) === 'yes'; }catch(e){}
    if(alreadyUnlocked){
      load();
    } else {
      showPinGate();
    }
  } else {
    load();
  }
})();
</script>

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {
        // offline on first-ever load with no cached service worker yet — harmless, just skip
      });
    });
  }
</script>
